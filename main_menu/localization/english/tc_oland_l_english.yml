l_english:
 STATIC_MODIFIER_NAME_swe_olands_djurgard: "Öland Deer Park"
 STATIC_MODIFIER_DESC_swe_olands_djurgard: "The whole island is the king's hunting ground. Only the king and his retinue may hunt here, the peasants may cut wood only as the Crown allows, and the deer graze their fields and pastures. Many islanders have had enough and left. In the south, at Ottenby, the Crown breeds horses for the royal stables."

 swe_oland_djurgard_decision.title: "The King's Deer Park"
 swe_oland_djurgard_decision.desc: "The meadows and woods of [ShowLocationName('oland')] teem with game. If the whole island were made a royal deer park, its hunting would belong to the king alone, closed even to the nobility, and the Crown's foresters would watch over every tree. The [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] of the island would have to make do with whatever timber the Crown allowed them."
 swe_oland_djurgard_decision.desc.entry: "Öland could become the king's deer park."
 swe_oland_djurgard_decision.historical_info: "On 7 April 1569 King Johan III declared the whole of Öland a royal deer park (one source gives 1572). From then on only the king and his retinue could hunt on the island. The islanders lost the right to hunt and could take timber and firewood only in the amounts the Crown granted them from its forests, and breaking the rules could mean prison. The deer park lasted for more than two centuries."
 swe_oland_djurgard_decision.a: "The island's game belongs to the king."

 swe_oland.1.title: "The Peasants of Öland"
 swe_oland.1.entry: "$swe_oland.1.title$"
 swe_oland.1.desc: "Deputies from [ShowLocationName('oland')] have brought us a long list of grievances. The king's deer trample their fields and graze their pastures, they may not hunt the animals that eat their crops, and they must beg the Crown's foresters for every load of firewood. They ask that the deer park be ended. The foresters answer that its rules are the only reason the island still has a forest, and that the peasants will cut it down for tar and lime."
 swe_oland.1.historical_info: "The peasants of Öland lived with the royal deer park for more than two hundred years. At the Riksdag of 1800 the island's deputies asked for it to be abolished, and the Crown agreed: a royal letter of 12 May 1801 ended the deer park. The Crown kept the forest at Böda in the north of the island as a crown park. Its peasants went on taking wood there for tar, lime and building, and in April 1850 a force of 110 men was sent to put down the Böda Uprising."
 swe_oland.1.a: "End the deer park."
 swe_oland.1.a.entry: "The deer park on Öland was ended."
 swe_oland.1.b: "The king's deer stay."
 swe_oland.1.b.entry: "The deer park on Öland was kept."
 swe_oland.1.b_tt: "This answer is final: the deer park stays for good."
