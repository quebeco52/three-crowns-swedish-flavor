 swe_council_regency: "Förmyndarregering"
 swe_council_regency_desc: "When the realm has no [ruler|e], the council of the realm governs through one of its own as [regent|e], as it did for Magnus Eriksson, Kristina and Karl XI. The [cabinet|e] works the better for it, while the Crown's hold slackens."
