l_english:
 STATIC_MODIFIER_NAME_swe_jamtland_tings: "The Jämtland Tings"
 STATIC_MODIFIER_DESC_swe_jamtland_tings: "The Jämtlanders keep their old tings, and they have been promised that they need only defend their own province. They guard their valleys well, but few of them go to the Crown's wars."
 STATIC_MODIFIER_NAME_swe_jamtmarknaden: "The Frösö Market"
 STATIC_MODIFIER_DESC_swe_jamtmarknaden: "Every year traders from Norway, the Bothnian coast and the valleys of Jämtland meet at the great market on Frösö."

 swe_jamtland.1.title: "The Jämtlanders"
 swe_jamtland.1.entry: "$swe_jamtland.1.title$"
 swe_jamtland.1.desc: "[ShowProvinceDefinitionName('jamtland_province')] is ours, but its people speak Norwegian, trade over the mountains with Trondheim, and owe us little loyalty. The Crown could send Swedish priests to the parishes and found a diocese of our own on the coast to train them. Or the Jämtlanders could be left alone: let them keep the market on [ShowLocationName('froso')] and the tings held there, and they will defend their valleys for us."
 swe_jamtland.1.historical_info: "Jämtland belonged to Norway for most of the Middle Ages and changed hands thirteen times between 1563 and 1677. Denmark-Norway ceded it to Sweden, together with Härjedalen, at Brömsebro in 1645. A year earlier, men from Dalarna had taken the neighbouring parishes of Idre and Särna in a bloodless march, and the border treaty of 1751 finally confirmed them as Swedish. In 1647 the Swedish government gave Jämtland and the northern coast a superintendent of their own at Härnösand and founded schools, partly to draw the Jämtlanders away from Trondheim. The yearly market at Frösön, the Jamtamót, with its tings at the opening and close, lived on for a time. Later writers saw in it the parliament of a medieval peasant republic, though historians now doubt the Jamtamót was ever more than a market and its courts."
 swe_jamtland.1.a: "Swedish priests for Swedish parishes."
 swe_jamtland.1.a.entry: "Swedish priests were sent to Jämtland."
 swe_jamtland.1.a_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('jamtland_province')] or at [ShowLocationName('idre')] where [ShowCultureName('norwegian')] culture dominates gains [ShowModifier('swe_forsvenskning')] for 20 years."
 swe_jamtland.1.b: "Let them keep their market and their tings."
 swe_jamtland.1.b.entry: "Jämtland kept its market and its tings."
 swe_jamtland.1.b_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('jamtland_province')] or at [ShowLocationName('idre')] where [ShowCultureName('norwegian')] culture dominates gains [ShowModifier('swe_jamtland_tings')]."

 swe_jamtland.2.title: "Hailed as Liberators"
 swe_jamtland.2.entry: "$swe_jamtland.2.title$"
 swe_jamtland.2.desc: "The enemy's soldiers have come over the mountains into [ShowProvinceDefinitionName('jamtland_province')], and the Jämtlanders are greeting them as friends. Peasants guide their columns through the forests, and whole parishes have sworn to the enemy's king. Whatever happens in this war, we must decide what to do with them. Punished, they will welcome the next army too. A promise of their old rights might keep them home, if they believe it. A traitor's farm belongs to the Crown, and the traitor is its likeliest buyer."
 swe_jamtland.2.historical_info: "After Jämtland went back to Denmark-Norway in 1613, Christian IV's commission held a reckoning there, the Räfst. It seized the farms of about 1,300 of the province's 1,470 farmers and stripped them of their hereditary rights, and most of them had to buy those rights back. In 1657 the Jämtlanders welcomed the invading Norwegian army as liberators, and during the Scanian War of 1677 they fought the Swedish army as partisans. Both times Sweden kept the province. Afterwards it pressed on with making the Jämtlanders Swedish, but it also bargained with them: an agreement of 1688 promised that they would only have to defend their own province. Karl XII broke that promise in 1718, when Jämtland's soldiers marched into Norway with Armfeldt's army, and thousands froze to death on the retreat."
 swe_jamtland.2.a: "Punish the traitors."
 swe_jamtland.2.a.entry: "The Jämtlanders were punished."
 swe_jamtland.2.a_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('jamtland_province')] or at [ShowLocationName('idre')] loses [ShowModifier('swe_jamtland_tings')]. Where [ShowCultureName('norwegian')] culture dominates, [ShowModifier('swe_forsvenskning')] runs for 20 years from now."
 swe_jamtland.2.b: "Promise them their old rights."
 swe_jamtland.2.b.entry: "The Jämtlanders were promised their old rights."
 swe_jamtland.2.b_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('jamtland_province')] or at [ShowLocationName('idre')] loses [ShowModifier('swe_forsvenskning')], and those where [ShowCultureName('norwegian')] culture dominates gain [ShowModifier('swe_jamtland_tings')]."
 swe_jamtland.2.c: "Take their farms, then sell them back."
 swe_jamtland.2.c.entry: "The Jämtlanders bought back their own farms."
 swe_jamtland.2.c_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('jamtland_province')] or at [ShowLocationName('idre')] loses [ShowModifier('swe_jamtland_tings')]."
