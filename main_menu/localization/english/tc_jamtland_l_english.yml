l_english:
 STATIC_MODIFIER_NAME_swe_jamtland_tings: "The Jämtland Tings"
 STATIC_MODIFIER_DESC_swe_jamtland_tings: "The Jämtlanders keep their old tings, and they have been promised that they need only defend their own province. They guard their valleys well, but few of them go to the Crown's wars."
 STATIC_MODIFIER_NAME_swe_jamtmarknaden: "The Frösön Market"
 STATIC_MODIFIER_DESC_swe_jamtmarknaden: "Every year traders from Norway, the Bothnian coast and the valleys of Jämtland meet at the great market on Frösön."

 swe_jamtland.1.title: "The Jämtlanders"
 swe_jamtland.1.entry: "$swe_jamtland.1.title$"
 swe_jamtland.1.desc: "[ShowProvinceDefinitionName('jamtland_province')] is ours, but its people speak Norwegian, trade over the mountains with Trondheim, and owe us little loyalty. Our officials want Swedish priests in the parishes and a diocese of our own on the coast to train them. Others say the Jämtlanders are best left alone: let them keep the market on [ShowLocationName('froso')] and the tings held there, and they will defend their valleys for us."
 swe_jamtland.1.historical_info: "Jämtland belonged to Norway for most of the Middle Ages and changed hands thirteen times between 1563 and 1677. Denmark-Norway ceded it to Sweden, together with Härjedalen, at Brömsebro in 1645. A year earlier, men from Dalarna had taken the neighbouring parishes of Idre and Särna in a bloodless march, and the border treaty of 1751 finally confirmed them as Swedish. The Swedish government created the diocese of Härnösand in 1647 and founded schools, partly to draw the Jämtlanders away from Trondheim. The yearly market at Frösön, the Jamtamót, with its tings at the opening and close, lived on for a time. Later writers saw in it the parliament of a medieval peasant republic, though historians now doubt the Jamtamót was ever more than a market and its courts."
 swe_jamtland.1.a: "Swedish priests for Swedish parishes."
 swe_jamtland.1.a.entry: "Jämtland is to become Swedish."
 swe_jamtland.1.a_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('jamtland_province')] or at [ShowLocationName('idre')] where [ShowCultureName('norwegian')] culture dominates gains $STATIC_MODIFIER_NAME_swe_forsvenskning$ for 20 years."
 swe_jamtland.1.b: "Let them keep their market and their tings."
 swe_jamtland.1.b.entry: "Jämtland keeps its tings."
 swe_jamtland.1.b_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('jamtland_province')] or at [ShowLocationName('idre')] where [ShowCultureName('norwegian')] culture dominates gains $STATIC_MODIFIER_NAME_swe_jamtland_tings$."

 swe_jamtland.2.title: "Hailed as Liberators"
 swe_jamtland.2.entry: "$swe_jamtland.2.title$"
 swe_jamtland.2.desc: "The enemy's soldiers have come over the mountains into [ShowProvinceDefinitionName('jamtland_province')], and the Jämtlanders are greeting them as friends. Peasants guide their columns through the forests, and our bailiffs report that whole parishes have sworn to the enemy's king. Whatever happens in this war, we must decide what to do with them."
 swe_jamtland.2.historical_info: "After Jämtland went back to Denmark-Norway in 1613, Christian IV's commission held a reckoning there, the Räfst. It declared just over 1,200 of about 1,469 farmers criminals and stripped them of their hereditary rights, and in 1614, 1,233 of them bought those rights back for a total of 7,275 daler. In 1657 the Jämtlanders welcomed the invading Norwegian army as liberators, and during the Scanian War of 1677 they fought the Swedish army as partisans. Both times Sweden kept the province. Afterwards it pressed on with making the Jämtlanders Swedish, but it also bargained with them: an agreement of 1688 promised that they would only have to defend their own province. Charles XII broke that promise in 1718, when Jämtland's soldiers marched into Norway with Armfeldt's army, and thousands froze to death on the retreat."
 swe_jamtland.2.a: "Punish the traitors."
 swe_jamtland.2.a.entry: "The Jämtlanders were punished."
 swe_jamtland.2.a_tt: "In every [location|e] we own in [ShowProvinceDefinitionName('jamtland_province')] or at [ShowLocationName('idre')], any $STATIC_MODIFIER_NAME_swe_jamtland_tings$ end. Where [ShowCultureName('norwegian')] culture dominates, $STATIC_MODIFIER_NAME_swe_forsvenskning$ runs for 20 years from now."
 swe_jamtland.2.b: "Promise them their old rights."
 swe_jamtland.2.b.entry: "The Jämtlanders were promised their old rights."
 swe_jamtland.2.b_tt: "In every [location|e] we own in [ShowProvinceDefinitionName('jamtland_province')] or at [ShowLocationName('idre')], $STATIC_MODIFIER_NAME_swe_forsvenskning$ ends. Where [ShowCultureName('norwegian')] culture dominates, $STATIC_MODIFIER_NAME_swe_jamtland_tings$ begins."
 swe_jamtland.2.c: "Take their farms, then sell them back."
 swe_jamtland.2.c.entry: "The Jämtlanders bought back their own farms."
 swe_jamtland.2.c_tt: "In every [location|e] we own in [ShowProvinceDefinitionName('jamtland_province')] or at [ShowLocationName('idre')], any $STATIC_MODIFIER_NAME_swe_jamtland_tings$ end."
