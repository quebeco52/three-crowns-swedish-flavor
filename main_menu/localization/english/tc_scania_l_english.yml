l_english:
 STATIC_MODIFIER_NAME_swe_forsvenskning: "Försvenskning"
 STATIC_MODIFIER_DESC_swe_forsvenskning: "Swedish law, Swedish priests and Swedish schoolbooks are slowly making Swedes of the people here, and not all of them are willing."

 STATIC_MODIFIER_NAME_swe_castle_ban: "The Castle Ban"
 STATIC_MODIFIER_DESC_swe_castle_ban: "No lord may raise a private castle here. The Crown's own strongholds are the only ones that count, though some very solid stone houses have been going up."
 STATIC_MODIFIER_NAME_swe_fasta_hus: "The Lords' Strongholds"
 STATIC_MODIFIER_DESC_swe_fasta_hus: "The lords of the district have been left free to fortify their houses. They can hold the land for us, and hold it against us as well."
 STATIC_MODIFIER_NAME_swe_varberg_fortress: "The Fortress at Varberg"
 STATIC_MODIFIER_DESC_swe_varberg_fortress: "New bastions and earthworks have turned the old castle into a modern fortress."
 STATIC_MODIFIER_NAME_swe_varberg_labour: "Fortress Labour"
 STATIC_MODIFIER_DESC_swe_varberg_labour: "The farmers of the district are called up for day after day of hauling stone and earth to the fortress, whatever needs doing at home."
 STATIC_MODIFIER_NAME_swe_lund_old_churches: "Lund's Old Churches"
 STATIC_MODIFIER_DESC_swe_lund_old_churches: "The old churches still stand, and the clergy who keep them remain a power in the town."
 STATIC_MODIFIER_NAME_swe_malmo_plot_crushed: "After the Plot"
 STATIC_MODIFIER_DESC_swe_malmo_plot_crushed: "The plotters are dead and their property forfeit. The Crown's men watch the town closely, and the town watches them right back."
 STATIC_MODIFIER_NAME_swe_malmo_mercy: "The Crown's Mercy"
 STATIC_MODIFIER_DESC_swe_malmo_mercy: "The town expected the axe and got a pardon instead. Its burghers are grateful, for now, and the Crown's officers tread carefully."

 swe_scania.1.title: "Making [ShowAreaNameWithNoTooltip('skaneland_area')] Swedish"
 swe_scania.1.entry: "$swe_scania.1.title$"
 swe_scania.1.desc: "[ShowAreaName('skaneland_area')] belongs to [ROOT.GetCountry.GetName], but its people still speak Danish, its courts follow Scanian law, and many of them look across the Sound for their king. Our governors want to make the provinces Swedish in more than name: Swedish law in the courts, Swedish priests in the pulpits and a school at [ShowLocationName('lund')] to train them. The Scanian lords warn that the peasants will not give up their old ways quietly."
 swe_scania.1.historical_info: "Sweden won Scania, Halland and Blekinge at the Treaty of Roskilde in 1658 and at first promised to keep their laws and privileges. Lund University was founded in 1666, in part to train priests for the new provinces in Swedish. During the Scanian War of 1675–79 many Scanians sided with Denmark, and afterwards Charles XI's government changed course: Swedish law replaced Scanian law in 1683, and the Swedish church ordinance, catechism and hymnal replaced the Danish ones. Within a few generations the provinces counted themselves Swedish, though the Scanian dialect lives on."
 swe_scania.1.a: "One realm, one law."
 swe_scania.1.a.entry: "Skåneland is to become Swedish."
 swe_scania.1.a_tt: "Every [location|e] in [ShowAreaNameWithNoTooltip('skaneland_area')] where [ShowCultureName('danish')] culture dominates gains $STATIC_MODIFIER_NAME_swe_forsvenskning$ for 20 years."
 swe_scania.1.b: "Let Skåneland keep its ways."
 swe_scania.1.b.entry: "Skåneland keeps its ways."

 swe_scania.2.title: "The Castle Ban"
 swe_scania.2.entry: "$swe_scania.2.title$"
 swe_scania.2.desc: "The nobles of [ShowAreaName('skaneland_area')] have been raising castles of their own, and they answer to the Crown only when it suits them. A royal proclamation could put a stop to it: no more private castles. The lords would grumble and look for a way around it, perhaps a strong stone house that is not quite called a castle. If we let them build, they will hold the countryside for us cheaply, and they could hold it against us just as easily."
 swe_scania.2.historical_info: "From 1396 to 1483 a royal ban forbade the building of private castles. Queen Margareta issued it, fearing that nobles with strongholds of their own would become too powerful and threaten royal authority. In Skåne the nobles got around it with fasta hus, fortified houses with thick walls and moats, such as Bollerup, Örup, Dybäck and Lillöhus. These could hold back rebellious peasants but could not stop the king's men. Glimmingehus, built after the ban was lifted, could afford a well-equipped defence and clever traps."
 swe_scania.2.a: "Forbid private castles."
 swe_scania.2.a.entry: "Private castles were forbidden in Skåneland."
 swe_scania.2.a_tt: "Every [location|e] in [ShowAreaNameWithNoTooltip('skaneland_area')] held by us or our subjects gains $STATIC_MODIFIER_NAME_swe_castle_ban$ for 85 years."
 swe_scania.2.b: "Let them build."
 swe_scania.2.b.entry: "The lords of Skåneland were left free to build."
 swe_scania.2.b_tt: "Every [location|e] in [ShowAreaNameWithNoTooltip('skaneland_area')] held by us or our subjects gains $STATIC_MODIFIER_NAME_swe_fasta_hus$ for 50 years."

 swe_scania.3.title: "The Alum of Andrarum"
 swe_scania.3.entry: "$swe_scania.3.title$"
 swe_scania.3.desc: "A prospector has found alum shale near [ShowLocationName('gladsax')] and asks for a royal privilege to work it. Dyers and tanners pay well for alum, and the deposit looks rich. But the works would need great pans and endless firewood, and he wants the rights to the forests for miles around. Those who live here would rather the land went on as it has."
 swe_scania.3.historical_info: "Jochum Beck found the alum shale at Andrarum in the summer of 1635, and on 7 October 1637 he received a Danish royal privilege. The works were nearly ready to open in 1643 when a Swedish attack on Skåne destroyed them. They resumed under Swedish privileges of 1686, which included rights to all forest within two mil. Christina Piper bought the works in 1725 and made them one of Sweden's more significant industries, building Christinehof beside them in the 1730s. About 200 people worked directly in alum production in 1776, and several thousand depended on it at its peak. Output from 1682 to 1912 came to 77,495 tons, and the works closed in 1912, mainly for lack of firewood."
 swe_scania.3.a: "Grant the privilege."
 swe_scania.3.a.entry: "The alum works at Andrarum were chartered."
 swe_scania.3.b: "Leave the land as it is."
 swe_scania.3.b.entry: "The alum at Andrarum stayed in the ground."

 swe_scania.4.title: "The Fortress at Varberg"
 swe_scania.4.entry: "$swe_scania.4.title$"
 swe_scania.4.desc: "[ShowLocationName('varberg')] is an old castle in an age of new guns, and our engineers say it needs bastions and earthworks if it is to hold the Halland coast. The work will take decades and a mountain of stone. The bailiffs propose the usual answer: call up the farmers of the district for days of labour, which will cost the treasury very little. The farmers have harvests to bring in and have already given more than their share. Hired labourers would spare them, at a high price."
 swe_scania.4.historical_info: "Varberg was rebuilt as a modern fortress in 1588-1618, which took an enormous amount of work. Heavy labour duties went to the fortresses of Varberg and Halmstad, and Museum Halland estimates that the farmers of northern Halland spent two million man-days hauling stone and earth to Varberg. Armies also lived off the land, so the people of Halland lost grain and livestock whichever side arrived. Denmark ceded Halland to Sweden for thirty years at Brömsebro in 1645, and for good at Roskilde in 1658. Danish law stayed in force at first, until Karl XI ordered the change in 1681 and Swedish law replaced it in 1683."
 swe_scania.4.a: "Call up the farmers."
 swe_scania.4.a.entry: "The farmers of Halland were called up to build Varberg's fortress."
 swe_scania.4.a_tt: "Every [location|e] in [ShowProvinceDefinitionName('halland_province')] held by us or our subjects gains $STATIC_MODIFIER_NAME_swe_varberg_labour$ for 25 years."
 swe_scania.4.b: "Pay for the work."
 swe_scania.4.b.entry: "Hired labourers rebuilt Varberg's fortress."

 swe_scania.5.title: "Lund's Churches Come Down"
 swe_scania.5.entry: "$swe_scania.5.title$"
 swe_scania.5.desc: "[ShowLocationName('lund')] has far more churches than it now has any use for. The old faith filled the town with them, and many stand empty with their altars stripped. Our council proposes to pull most of them down, keeping only the cathedral and one other, and to have the farmers of the district cart the stone to [ShowLocationName('malmo')]. The people of Lund would see the heart of their town torn out. The clergy want the buildings kept for the faith."
 swe_scania.5.historical_info: "Around 1300 Lund had twenty parish churches and five monastery churches. King Christian III abolished the archbishopric in 1536 and ordered the superfluous churches pulled down in 1536-37. One letter to the town said the churches and cemeteries were to be demolished by the citizens, and the material taken to Malmö by the farmers of Torna district. Only the cathedral and St Peter's monastery church were spared. Today, these and the Liberiet chapel are all that remain above ground of the medieval church buildings."
 swe_scania.5.a: "Pull them down."
 swe_scania.5.a.entry: "Lund's old churches were pulled down."
 swe_scania.5.b: "Keep the old churches."
 swe_scania.5.b.entry: "Lund's old churches were kept."

 swe_scania.6.title: "The Malmö Plot"
 swe_scania.6.entry: "$swe_scania.6.title$"
 swe_scania.6.desc: "A box of letters has been found hidden in a slope near [ShowLocationName('malmo')], and it has led our men to a conspiracy reaching across [ShowAreaName('skaneland_area')]. Leading burghers have been writing to the Danes, promising to surprise our garrison and hand over the town as soon as their ships arrive. 'We await you every hour,' says one of the letters. The prisoners have confessed. The court asks how far the punishment should go: execute the leaders and strip the rest of their property, or show mercy to a town we will have to go on living with."
 swe_scania.6.historical_info: "Denmark gave up Skåne at Roskilde in February 1658. That Christmas, leading burghers of Malmö planned to surprise the Swedish soldiers at Malmöhus and take the town with Danish help, but the Danish ships ran aground at Saltholm. In April 1659 arrests spread from Malmö across Skåne. That autumn a box was found in a slope at Limhamn, holding letters from besieged Copenhagen to Bartolomæus Mikkelsen, who lived at the lime quarry, and his drafts in reply. On 13 December 1659 a court found the accused guilty of high treason. Three days later the presumed leaders, Mikkelsen, Johan Jørgensen and Jokum Brun, were executed, and the rest lost their property and paid fines."
 swe_scania.6.a: "Execute the leaders and fine the rest."
 swe_scania.6.a.entry: "The leaders of the Malmö plot were executed."
 swe_scania.6.b: "Show mercy."
 swe_scania.6.b.entry: "The plotters of Malmö were shown mercy."
