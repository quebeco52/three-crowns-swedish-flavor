l_english:
 STATIC_MODIFIER_NAME_swe_forsvenskning: "Försvenskning"
 STATIC_MODIFIER_DESC_swe_forsvenskning: "Swedish law, Swedish priests and Swedish schoolbooks are slowly making Swedes of the people here, and not all of them are willing."

 STATIC_MODIFIER_NAME_swe_malmo_plot_crushed: "After the Plot"
 STATIC_MODIFIER_DESC_swe_malmo_plot_crushed: "The plotters are dead and their property forfeit, and the town's leading families have lost their say. The Crown's men watch the town closely, and the town watches them right back."
 STATIC_MODIFIER_NAME_swe_malmo_mercy: "The Crown's Mercy"
 STATIC_MODIFIER_DESC_swe_malmo_mercy: "The town expected the axe and got a pardon instead. Its burghers are grateful, for now, and the Crown's officers are careful not to test it."

 swe_scania.1.title: "The Scanians"
 swe_scania.1.entry: "$swe_scania.1.title$"
 swe_scania.1.desc: "[ShowAreaName('skaneland_area')] belongs to [ROOT.GetCountry.GetName], but its people still speak Danish, its courts follow Scanian law, and many of them look across the Sound for their king. Our governors want to make the provinces Swedish in more than name: Swedish law in the courts, Swedish priests in the pulpits and a school at [ShowLocationName('lund')] to train them. The Scanian lords warn that the peasants will not give up their old ways quietly."
 swe_scania.1.historical_info: "Sweden won Scania, Halland and Blekinge at the Treaty of Roskilde in 1658 and at first promised to keep their laws and privileges. Lund University was founded in 1666, in part to train priests for the new provinces in Swedish. During the Scanian War of 1675–79 many Scanians sided with Denmark, and Karl XI answered the snapphanar, the irregulars who fought on in the forests, with reprisals against the parishes that sheltered them and executions on the wheel and the stake. After the war his government changed course: Swedish law replaced Scanian law in 1683, and the Swedish church ordinance, catechism and hymnal replaced the Danish ones. Within a few generations the provinces counted themselves Swedish, though the Scanian dialect lives on."
 swe_scania.1.a: "One realm, one law."
 swe_scania.1.a.entry: "Swedish law and Swedish priests came to Skåneland."
 swe_scania.1.a_tt: "Every [location|e] in [ShowAreaNameWithNoTooltip('skaneland_area')] where [ShowCultureName('danish')] culture dominates gains [ShowModifier('swe_forsvenskning')] for 20 years."
 swe_scania.1.b: "Let Skåneland keep its ways."
 swe_scania.1.b.entry: "Skåneland kept its ways."

 swe_scania.6.title: "The Malmö Plot"
 swe_scania.6.entry: "$swe_scania.6.title$"
 swe_scania.6.desc: "A box of letters has been found hidden in a slope near [ShowLocationName('malmo')], and it has led our men to a conspiracy reaching across [ShowAreaName('skaneland_area')]. Leading burghers have been writing to the Danes, promising to surprise our garrison and hand over the town as soon as their ships arrive. 'We await you every hour,' says one of the letters. The prisoners have confessed. The court asks how far the punishment should go: execute the leaders and strip the rest of their property, or show mercy to a town we will have to go on living with."
 swe_scania.6.historical_info: "Denmark gave up Skåne at Roskilde in February 1658. That Christmas, leading burghers of Malmö planned to surprise the Swedish soldiers at Malmöhus and take the town with Danish help, but the Danish ships ran aground at Saltholm. In April 1659 arrests spread from Malmö across Skåne. That autumn a box was found in a slope at Limhamn, holding letters from besieged Copenhagen to Bartolomæus Mikkelsen, who lived at the lime quarry, and his drafts in reply. On 13 December 1659 a court found the accused guilty of high treason. Three days later the presumed leaders, Mikkelsen, Johan Jørgensen and Jokum Brun, were executed, and the rest lost their property and paid fines."
 swe_scania.6.a: "Execute the leaders and fine the rest."
 swe_scania.6.a.entry: "The leaders of the Malmö plot were executed."
 swe_scania.6.b: "Show mercy."
 swe_scania.6.b.entry: "The plotters of Malmö were shown mercy."

 STATIC_MODIFIER_NAME_swe_karlskrona_station: "The Naval Station"
 STATIC_MODIFIER_DESC_swe_karlskrona_station: "The fleet's base and yards are spread across the islands here, and everyone in the district works for them or sells to those who do."
 STATIC_MODIFIER_NAME_swe_ronneby_privileges_revoked: "Town Rights Withdrawn"
 STATIC_MODIFIER_DESC_swe_ronneby_privileges_revoked: "By royal order all sailing and dwelling here is to cease. Not everyone has gone, but nobody is building new warehouses."

 swe_scania.7.title: "Where the Fleet Lies"
 swe_scania.7.entry: "$swe_scania.7.title$"
 swe_scania.7.desc: "Our fleet lies at Skeppsholmen, a long sail from the fighting in the southern Baltic, and the ice can shut it in port. The islands off [ShowProvinceDefinitionName('blekinge_province')] offer a deep, sheltered harbour that is easy to defend and should stay open longer. Everything there would have to be built on bare rock and in thick woodland, and the new town would need people: [ShowLocationName('ronneby')] would lose its trade and its burghers to it. The yards at Skeppsholmen, meanwhile, are already built and paid for."
 swe_scania.7.historical_info: "During the Scanian War a Danish force took Kristianopel in Blekinge in September 1676, and Swedish troops retook it the next February and razed its walls. When the war ended in 1679, Sweden resolved on a new naval base, nearer the fighting in the southern Baltic, with a deep and defensible harbour and, it was hoped, longer ice-free periods than Skeppsholmen in Stockholm. The choice fell on the island of Trossö, then rocky hills and dense woods. Karl XI's privileges of 10 August 1680 gave the new town of Karlskrona the foreign trade of the district, Karlshamn excepted, and gave the burghers of Ronneby until 1682 to move, after which 'all sailing and dwelling there must cease'. They put it off to the last, until a fire in Ronneby and an offer of help with building stone houses in Karlskrona finally moved them. The base came to spread over about 30 islands."
 swe_scania.7.a: "Build on the islands."
 swe_scania.7.a.entry: "The fleet was moved to a new base in Blekinge."
 swe_scania.7.b: "The fleet stays at Skeppsholmen."
 swe_scania.7.b.entry: "The fleet stayed at Skeppsholmen."
 swe_scania.7.a_tt: "All [pops|e] in [ShowLocationName('ronneby')] lose 10% [pop_satisfaction|e]."
 swe_scania.7.b_tt: "All [pops|e] in [ShowLocationName('ronneby')] gain 5% [pop_satisfaction|e]."
