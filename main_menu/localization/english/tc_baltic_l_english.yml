l_english:
 STATIC_MODIFIER_NAME_swe_baltic_privileges: "The Knighthood's Privileges"
 STATIC_MODIFIER_DESC_swe_baltic_privileges: "The German knighthood here keeps its own diet, its courts and its German law, and rules its manors and the peasants on them as it always has. The Crown's governors rule with the lords' consent, and the land holds together under them, though its people change little."
 STATIC_MODIFIER_NAME_swe_baltic_town_privileges: "The Town's Privileges"
 STATIC_MODIFIER_DESC_swe_baltic_town_privileges: "The town keeps its council, its German law and the rights of its merchants and guilds. It answers to the Crown, but it governs itself, and its trade goes wherever its merchants please."
 STATIC_MODIFIER_NAME_swe_riga_licent: "The Licent"
 STATIC_MODIFIER_DESC_swe_riga_licent: "The Crown takes a toll on every cargo that passes through the harbour here. It fills the treasury, but the merchants complain that it drives their trade to other ports."

 STATIC_MODIFIER_NAME_swe_russian_transit: "The Russian Transit Trade"
 STATIC_MODIFIER_DESC_swe_russian_transit: "With no harbour of its own on the Baltic, Russia must send its furs, hemp, flax and leather to the West through ports like this one. The merchants here buy from the Russian traders and sell to the foreign ships at the quays."
 STATIC_MODIFIER_NAME_swe_russian_staple: "The Russian Staple"
 STATIC_MODIFIER_DESC_swe_russian_staple: "The Crown has named this town the staple of the Russian trade. Every cargo from the east must be landed and sold here before it can go any further."

 swe_baltic.1.title: "The Estonian Knighthood"
 swe_baltic.1.entry: "$swe_baltic.1.title$"
 swe_baltic.1.desc: "The knights of [ShowProvinceDefinitionName('estonia_province')] and the council of [ShowLocationName('tallinn')] have sworn allegiance to [ROOT.GetCountry.GetName], but they ask a price for their loyalty. The German lords want to keep their own diet and courts, their German law and their church, and to rule their manors and the peasants on them as their fathers did. Our officials would rather send Swedish governors and Swedish judges, and warn that a province that governs itself will never truly be ours."
 swe_baltic.1.historical_info: "In 1561, as the Livonian Confederation collapsed under Russian attack, the knighthoods of Harrien, Wierland and Jerwen and the town of Reval submitted to Erik XIV of Sweden. In return he confirmed their privileges: the nobility kept its diet, its own courts and German law, Reval kept its Lübeck law, and both kept the Lutheran church. These capitulations were the foundation of Swedish rule in Estonia, which lasted until 1710. The knighthood of Ösel, under Denmark from 1559, kept its privileges in the same way when the island passed to Sweden at Brömsebro in 1645. The German lords ran the province and held the Estonian peasants in ever harsher serfdom, and they resented the Crown's attempts to curb them, above all Karl XI's reduction of their estates in the 1680s. When Estonia and Reval capitulated to Peter the Great in 1710, he confirmed the same privileges, and they survived into the 19th century."
 swe_baltic.1.a: "Confirm the privileges of the knighthood."
 swe_baltic.1.a.entry: "The privileges of the Estonian knighthood were confirmed."
 swe_baltic.1.a_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('estonia_province')] and [ShowProvinceDefinitionName('rotalia_province')] except the towns of [ShowLocationName('tallinn')] and [ShowLocationName('narva')] gains [ShowModifier('swe_baltic_privileges')] for 50 years."
 swe_baltic.1.b: "Estonia will live under Swedish law."
 swe_baltic.1.b.entry: "Estonia was brought under Swedish law."
 swe_baltic.1.b_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('estonia_province')] and [ShowProvinceDefinitionName('rotalia_province')] where [ShowCultureName('swedish')] culture does not dominate gains [ShowModifier('swe_forsvenskning')] for 20 years."

 swe_baltic.2.title: "The Capitulation of Riga"
 swe_baltic.2.entry: "$swe_baltic.2.title$"
 swe_baltic.2.desc: "[ShowLocationName('riga')], the richest town on the eastern Baltic and the gateway to the trade of the Daugava, now answers to [ROOT.GetCountry.GetName]. Its council asks us to confirm the town's old law and the freedoms of its merchants and guilds, and the knights of Livonia ask the same for their diet, their courts and their manors. Our treasurers have another idea: Swedish law in the courts of Livonia, and a toll on every cargo that passes through the harbour of [ShowLocationNameWithNoTooltip('riga')]. The Germans warn that the merchants will take their trade elsewhere."
 swe_baltic.2.historical_info: "Gustav II Adolf took Riga after a siege in 1621, during his war with Poland, and went on to conquer most of Livonia, including Dorpat in 1625. Poland gave up the land north of the Daugava at the Truce of Altmark in 1629, and ceded it for good at Oliva in 1660. The king confirmed the privileges of Riga and of the Livonian knighthood, and in 1632 he founded a university at Dorpat. Riga, one of the largest towns of the Swedish realm, kept its council and its German law, but the Crown took a share of its wealth through the Licent, a toll on the trade of the Baltic ports introduced in the 1620s. Karl XI's reduction of the 1680s took back much of the Livonian nobles' land, and their leader Johann Reinhold von Patkul helped bring on the Great Northern War. In 1710 Riga and the Livonian knighthood capitulated to Peter the Great, who confirmed their privileges."
 swe_baltic.2.a: "Confirm the privileges of Riga and Livonia."
 swe_baltic.2.a.entry: "The privileges of Riga and the Livonian knighthood were confirmed."
 swe_baltic.2.a_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('south_livonia_province')], [ShowProvinceDefinitionName('north_livonia_province')], [ShowProvinceDefinitionName('inner_livonia_province')] and [ShowProvinceDefinitionName('tartu_province')], except [ShowLocationName('riga')], gains [ShowModifier('swe_baltic_privileges')] for 50 years."
 swe_baltic.2.b: "Swedish law, and a toll for the Crown."
 swe_baltic.2.b.entry: "Livonia was brought under Swedish law, and Riga's trade was tolled."
 swe_baltic.2.b_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('south_livonia_province')], [ShowProvinceDefinitionName('north_livonia_province')], [ShowProvinceDefinitionName('inner_livonia_province')] and [ShowProvinceDefinitionName('tartu_province')] where [ShowCultureName('swedish')] culture does not dominate gains [ShowModifier('swe_forsvenskning')] for 20 years."

 swe_baltic.4.title: "The Russian Staple"
 swe_baltic.4.entry: "$swe_baltic.4.title$"
 swe_baltic.4.desc: "[swe_russian_hinterland.GetName] no longer holds a single port on the Baltic Sea. The furs, hemp, flax, leather and grain of the Russian lands must now reach the West through our harbours, and foreign merchants are already crowding our quays to buy them. The [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] ask the Crown to name one town the staple of the Russian trade, where every cargo from the east must be landed and sold: [ShowLocationName('narva')] on its river below the border, [ShowLocationName('neva')] where the river from Lake Ladoga meets the sea, or [ShowLocationName('tallinn')], whose merchants have traded with Novgorod for centuries."
 swe_baltic.4.historical_info: "At the Treaty of Stolbovo in 1617 Russia ceded Ingria and Kexholm to Sweden and lost its last foothold on the Baltic. Gustav II Adolf told the Riksdag that the Russians could no longer launch a single boat on the Baltic without Sweden's leave. The Swedish government hoped to draw Russia's trade with the West through its own ports, where the Crown could toll it: Narva above all, but also Reval and Nyen, the new town beside the fortress of Nyenskans at the mouth of the Neva. Narva grew rich on Russian hemp, flax and leather, and its Baroque old town was built in these years. Yet much of Russia's trade still went by Archangel on the White Sea, beyond Sweden's reach. In 1703 Peter the Great took Nyenskans and founded Saint Petersburg nearby, and in 1704 he stormed Narva."
 swe_baltic.4.transit_tt: "Those of [ShowLocationName('narva')], [ShowLocationName('neva')] and [ShowLocationName('tallinn')] that we hold gain [ShowModifier('swe_russian_transit')] for 50 years."
 swe_baltic.4.a: "Make [ShowLocationNameWithNoTooltip('narva')] the staple."
 swe_baltic.4.a.entry: "Narva became the staple of the Russian trade."
 swe_baltic.4.b: "Make [ShowLocationNameWithNoTooltip('neva')] the staple."
 swe_baltic.4.b.entry: "Nyen became the staple of the Russian trade."
 swe_baltic.4.c: "Make [ShowLocationNameWithNoTooltip('tallinn')] the staple."
 swe_baltic.4.c.entry: "Reval became the staple of the Russian trade."

 STATIC_MODIFIER_NAME_swe_war_contributions: "War Contributions"
 STATIC_MODIFIER_DESC_swe_war_contributions: "The manors and farms here pay for the upkeep of our army in money, grain and horses. What they hand over to us they cannot put back into the land."
 STATIC_MODIFIER_NAME_swe_courland_low_dues: "Low Harbour Dues"
 STATIC_MODIFIER_DESC_swe_courland_low_dues: "Ships pay little to put in here, and they come in numbers for the grain, timber and flax of the country behind the harbour."

 swe_baltic.5.title: "The Lands of Courland"
 swe_baltic.5.entry: "$swe_baltic.5.title$"
 swe_baltic.5.desc: "We hold the manors around [ShowLocationName('jelgava')] and the harbours of Courland on the open sea. $swe_baltic.5.desc_lords$ $swe_baltic.5.desc_harbours$"
 swe_baltic.5.desc_harbours_only: "We hold the harbours of Courland on the open sea, though not [ShowLocationName('jelgava')] and the manors around it. $swe_baltic.5.desc_lords$ $swe_baltic.5.desc_harbours$"
 swe_baltic.5.desc_mitau_only: "We hold [ShowLocationName('jelgava')] and the manors around it, though not the harbours of Courland on the open sea. $swe_baltic.5.desc_lords$"
 swe_baltic.5.desc_lords: "The German lords here made no terms with us, and they are owed only what we choose to give them. Our commanders would have the estates of the land feed and pay our army, as an occupied country should; the estates can pay, though the land will take years to recover."
 swe_baltic.5.desc_harbours: "Our treasurers would rather put a toll on the ships in the harbours. The harbours have long lived on low dues, and their merchants say that ships which pay little here will keep coming, while ships which pay much will go elsewhere."
 swe_baltic.5.historical_info: "Swedish troops held Mitau during Gustav II Adolf's war with Poland, and the Truce of Altmark of 1629 gave it back to the Duke of Courland. Under the truce Sweden made Courland accept the licent, a toll on shipping, at its harbours of Windau and Libau. The dukes, who kept their own dues low to draw trade, resisted, and after Stuhmsdorf in 1635 the King of Poland kept the toll going in Sweden's place. In 1658, during Karl X Gustav's war with Poland, Field Marshal Robert Douglas seized Mitau and Duke Jakob, who was held prisoner until the Peace of Oliva in 1660, while the Dutch took his colony on Tobago. In July 1701 Karl XII crossed the Düna and occupied all of Courland, as a buffer for Livonia and to end the quarrel with the Dutch, the English and the Danes over Sweden's blockade of its harbours: once the ports were Swedish, there was nothing left to blockade. Unlike other lands his armies passed through, Courland was given a Swedish administration of its own, and its estates paid heavy contributions to the Swedish army for years afterwards."
 swe_baltic.5.a: "The estates will pay for our army."
 swe_baltic.5.a.entry: "Courland paid contributions to our army."
 swe_baltic.5.a_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('courland_province')] and [ShowProvinceDefinitionName('semigalia_province')] gains [ShowModifier('swe_war_contributions')] for 10 years."
 swe_baltic.5.b: "Toll the ships in the harbours."
 swe_baltic.5.b.entry: "The Crown took the licent at the harbours of Courland."
 swe_baltic.5.b_tt: "Those of [ShowLocationName('ventspils')] and [ShowLocationName('grobina')] that we own gain [ShowModifier('swe_riga_licent')] for 50 years."
 swe_baltic.5.c: "Keep the harbour dues low."
 swe_baltic.5.c.entry: "The harbours of Courland kept their low dues."
 swe_baltic.5.c_tt: "Those of [ShowLocationName('ventspils')] and [ShowLocationName('grobina')] that we own gain [ShowModifier('swe_courland_low_dues')] for 50 years."

 STATIC_MODIFIER_NAME_swe_julfa_factory: "The Armenian Hostel"
 STATIC_MODIFIER_DESC_swe_julfa_factory: "Armenian merchants from Isfahan keep a hostel and a warehouse here under the Crown's protection, and the silk of Persia passes through the town on its way west."

 swe_baltic.6.title: "Merchants from Isfahan"
 swe_baltic.6.entry: "$swe_baltic.6.title$"
 swe_baltic.6.desc: "A company of Armenian merchants from New Julfa, the Armenian quarter of Isfahan, has come to [ROOT.GetCountry.GetName] with an offer. The silk of Persia goes west by the Levant or by Archangel. They would bring it instead through Russia to [ShowLocationName('narva')], if we make it worth their while: freedom from toll for the first years, a hostel and a warehouse at Narva, and low dues on whatever they carry through. The hostel will cost us something to build, and the free years more. Our own merchants at Narva already carry the Russian trade, and have never been offered such terms."
 swe_baltic.6.historical_info: "Karl XI hoped to bring the Persian silk trade through Russia to Sweden's Baltic ports, and sent Ludvig Fabritius to the court of the Shah three times, in 1679-80, 1683-84 and 1697-1700. In 1682 Shah Suleiman agreed that the silk could go by Russia and Narva if the Armenian merchants were willing, and a delegation of Armenians from New Julfa came back to Sweden with Fabritius. On 27 September 1687 the Crown signed a contract with them: two years free of toll, a hostel and warehouse at Narva built with royal support, the right to trade in Stockholm under the king's protection, and transit dues of only one or two per cent. The Narva route was much used in the 1690s, until the Great Northern War closed it. Peter the Great stormed Narva in 1704."
 swe_baltic.6.a: "Grant them their terms."
 swe_baltic.6.a.entry: "Armenian merchants from Isfahan were given a hostel at Narva."
 swe_baltic.6.a_tt: "A small community of [ShowCultureName('armenian_culture')] merchants settles in [ShowLocationName('narva')]."
 swe_baltic.6.b: "They will pay the same tolls as anyone else."
 swe_baltic.6.b.entry: "The Armenian merchants were refused special terms."
