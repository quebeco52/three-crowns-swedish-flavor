l_english:
 STATIC_MODIFIER_NAME_swe_baltic_privileges: "The Knighthood's Privileges"
 STATIC_MODIFIER_DESC_swe_baltic_privileges: "The German knighthood here keeps its own diet, its courts and its German law, and rules its manors and the peasants on them as it always has. The Crown's governors rule with the lords' consent, and the land holds together under them, though its people change little."
 STATIC_MODIFIER_NAME_swe_baltic_town_privileges: "The Town's Privileges"
 STATIC_MODIFIER_DESC_swe_baltic_town_privileges: "The town keeps its council, its German law and the rights of its merchants and guilds. It answers to the Crown, but it governs itself, and its trade goes wherever its merchants please."
 STATIC_MODIFIER_NAME_swe_riga_licent: "The Licent"
 STATIC_MODIFIER_DESC_swe_riga_licent: "The Crown takes a toll on every cargo that passes through the harbour here. It fills the treasury, but the merchants complain that it drives their trade to other ports."

 STATIC_MODIFIER_NAME_swe_russian_transit: "The Russian Transit Trade"
 STATIC_MODIFIER_DESC_swe_russian_transit: "With no harbour of its own on the Baltic, Russia must send its furs, hemp, flax and leather to the West through ports like this one. The merchants here buy from the Russian traders and sell to the foreign ships at the quays."
 STATIC_MODIFIER_NAME_swe_russian_staple: "The Russian Staple"
 STATIC_MODIFIER_DESC_swe_russian_staple: "The Crown has named this town the staple of the Russian trade. Every cargo from the east must be landed and sold here before it can go any further."

 swe_baltic.1.title: "The Estonian Knighthood"
 swe_baltic.1.entry: "$swe_baltic.1.title$"
 swe_baltic.1.desc: "The knights of [ShowProvinceDefinitionName('estonia_province')] and the council of [ShowLocationName('tallinn')] have sworn allegiance to [ROOT.GetCountry.GetName], but they ask a price for their loyalty. The German lords want to keep their own diet and courts, their German law and their church, and to rule their manors and the peasants on them as their fathers did. Our officials would rather send Swedish governors and Swedish judges, and warn that a province that governs itself will never truly be ours."
 swe_baltic.1.historical_info: "In 1561, as the Livonian Confederation collapsed under Russian attack, the knighthoods of Harrien, Wierland and Jerwen and the town of Reval submitted to Erik XIV of Sweden. In return he confirmed their privileges: the nobility kept its diet, its own courts and German law, Reval kept its Lübeck law, and both kept the Lutheran church. These capitulations were the foundation of Swedish rule in Estonia, which lasted until 1710. The German lords ran the province and held the Estonian peasants in ever harsher serfdom, and they resented the Crown's attempts to curb them, above all Karl XI's reduction of their estates in the 1680s. When Estonia and Reval capitulated to Peter the Great in 1710, he confirmed the same privileges, and they survived into the 19th century."
 swe_baltic.1.a: "Confirm the privileges of the knighthood."
 swe_baltic.1.a.entry: "The privileges of the Estonian knighthood were confirmed."
 swe_baltic.1.a_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('estonia_province')] except the towns of [ShowLocationName('tallinn')] and [ShowLocationName('narva')] gains $STATIC_MODIFIER_NAME_swe_baltic_privileges$ for 50 years."
 swe_baltic.1.b: "Estonia will live under Swedish law."
 swe_baltic.1.b.entry: "Estonia was brought under Swedish law."
 swe_baltic.1.b_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('estonia_province')] where [ShowCultureName('swedish')] culture does not dominate gains $STATIC_MODIFIER_NAME_swe_forsvenskning$ for 20 years."

 swe_baltic.2.title: "The Capitulation of Riga"
 swe_baltic.2.entry: "$swe_baltic.2.title$"
 swe_baltic.2.desc: "[ShowLocationName('riga')], the richest town on the eastern Baltic and the gateway to the trade of the Daugava, now answers to [ROOT.GetCountry.GetName]. Its council asks us to confirm the town's old law and the freedoms of its merchants and guilds, and the knights of Livonia ask the same for their diet, their courts and their manors. Our treasurers have another idea: Swedish law in the courts of Livonia, and a toll on every cargo that passes through the harbour of [ShowLocationNameWithNoTooltip('riga')]. The Germans warn that the merchants will take their trade elsewhere."
 swe_baltic.2.historical_info: "Gustav II Adolf took Riga after a siege in 1621, during his war with Poland, and went on to conquer most of Livonia, including Dorpat in 1625. Poland gave up the land north of the Daugava at the Truce of Altmark in 1629, and ceded it for good at Oliva in 1660. The king confirmed the privileges of Riga and of the Livonian knighthood, and in 1632 he founded a university at Dorpat. Riga, one of the largest towns of the Swedish realm, kept its council and its German law, but the Crown took a share of its wealth through the Licent, a toll on the trade of the Baltic ports introduced in the 1620s. Karl XI's reduction of the 1680s took back much of the Livonian nobles' land, and their leader Johann Reinhold von Patkul helped bring on the Great Northern War. In 1710 Riga and the Livonian knighthood capitulated to Peter the Great, who confirmed their privileges."
 swe_baltic.2.a: "Confirm the privileges of Riga and Livonia."
 swe_baltic.2.a.entry: "The privileges of Riga and the Livonian knighthood were confirmed."
 swe_baltic.2.a_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('south_livonia_province')], [ShowProvinceDefinitionName('north_livonia_province')], [ShowProvinceDefinitionName('inner_livonia_province')] and [ShowProvinceDefinitionName('tartu_province')], except [ShowLocationName('riga')], gains $STATIC_MODIFIER_NAME_swe_baltic_privileges$ for 50 years."
 swe_baltic.2.b: "Swedish law, and a toll for the Crown."
 swe_baltic.2.b.entry: "Livonia was brought under Swedish law, and Riga's trade was tolled."
 swe_baltic.2.b_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('south_livonia_province')], [ShowProvinceDefinitionName('north_livonia_province')], [ShowProvinceDefinitionName('inner_livonia_province')] and [ShowProvinceDefinitionName('tartu_province')] where [ShowCultureName('swedish')] culture does not dominate gains $STATIC_MODIFIER_NAME_swe_forsvenskning$ for 20 years."

 swe_baltic.3.title: "The Knights of Ösel"
 swe_baltic.3.entry: "$swe_baltic.3.title$"
 swe_baltic.3.desc: "[ShowProvinceDefinitionName('rotalia_province')], the island of Ösel and the coast of Wiek, now answers to [ROOT.GetCountry.GetName]. The German lords of the island have served bishops and foreign kings before us, and each time they kept their diet, their courts and their manors. They ask the same of us. Our officials say that an island guarding the mouth of the Gulf of Riga should be ruled by our own governors, not by its knights."
 swe_baltic.3.historical_info: "In 1559 the last bishop of Ösel-Wiek sold his lands to Frederick II of Denmark, who gave them to his brother, Duke Magnus. Denmark kept Ösel until the Peace of Brömsebro in 1645, when it ceded the island to Sweden together with Gotland, Jämtland and Härjedalen. The Swedish Crown confirmed the privileges of the island's knighthood, which kept its own diet, its courts and German law, as it had under Denmark. In 1710 Ösel, like Estonia and Livonia, capitulated to Peter the Great on the same terms."
 swe_baltic.3.a: "The knights keep their diet."
 swe_baltic.3.a.entry: "The privileges of the Ösel knighthood were confirmed."
 swe_baltic.3.a_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('rotalia_province')] gains $STATIC_MODIFIER_NAME_swe_baltic_privileges$ for 50 years."
 swe_baltic.3.b: "Ösel will live under Swedish law."
 swe_baltic.3.b.entry: "Ösel was brought under Swedish law."
 swe_baltic.3.b_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('rotalia_province')] where [ShowCultureName('swedish')] culture does not dominate gains $STATIC_MODIFIER_NAME_swe_forsvenskning$ for 20 years."

 swe_baltic.4.title: "The Russian Staple"
 swe_baltic.4.entry: "$swe_baltic.4.title$"
 swe_baltic.4.desc: "[swe_russian_hinterland.GetName] no longer holds a single port on the Baltic Sea. The furs, hemp, flax, leather and grain of the Russian lands must now reach the West through our harbours, and foreign merchants are already crowding our quays to buy them. The [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] ask the Crown to name one town the staple of the Russian trade, where every cargo from the east must be landed and sold: [ShowLocationName('narva')] on its river below the border, [ShowLocationName('neva')] where the river from Lake Ladoga meets the sea, or [ShowLocationName('tallinn')], whose merchants have traded with Novgorod for centuries."
 swe_baltic.4.historical_info: "At the Treaty of Stolbovo in 1617 Russia ceded Ingria and Kexholm to Sweden and lost its last foothold on the Baltic. Gustav II Adolf told the Riksdag that the Russians could no longer launch a single boat on the Baltic without Sweden's leave. The Swedish government hoped to draw Russia's trade with the West through its own ports, where the Crown could toll it: Narva above all, but also Reval and Nyen, the new town beside the fortress of Nyenskans at the mouth of the Neva. Narva grew rich on Russian hemp, flax and leather, and its Baroque old town was built in these years. Yet much of Russia's trade still went by Archangel on the White Sea, beyond Sweden's reach. In 1703 Peter the Great took Nyenskans and founded Saint Petersburg nearby, and in 1704 he stormed Narva."
 swe_baltic.4.transit_tt: "Those of [ShowLocationName('narva')], [ShowLocationName('neva')] and [ShowLocationName('tallinn')] that we hold gain $STATIC_MODIFIER_NAME_swe_russian_transit$ for 50 years."
 swe_baltic.4.a: "Make [ShowLocationNameWithNoTooltip('narva')] the staple."
 swe_baltic.4.a.entry: "Narva became the staple of the Russian trade."
 swe_baltic.4.b: "Make [ShowLocationNameWithNoTooltip('neva')] the staple."
 swe_baltic.4.b.entry: "Nyen became the staple of the Russian trade."
 swe_baltic.4.c: "Make [ShowLocationNameWithNoTooltip('tallinn')] the staple."
 swe_baltic.4.c.entry: "Reval became the staple of the Russian trade."
