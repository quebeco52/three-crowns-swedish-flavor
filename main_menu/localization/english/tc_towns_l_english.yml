 STATIC_MODIFIER_NAME_swe_ostersund_freedoms: "Östersund's Freedoms"
 STATIC_MODIFIER_DESC_swe_ostersund_freedoms: "For its first twenty years the new town pays no taxes and has no guilds or trade restrictions, and settlers are moving in."

 swe_towns.1.title: "A Town on the Vanda"
 swe_towns.1.entry: "$swe_towns.1.title$"
 swe_towns.1.desc: "The merchants of [ShowLocationName('tallinn')] grow rich on the trade of the Gulf of Finland, and our side of the gulf has no town that can compete. $swe_towns.1.desc_plan$"
 swe_towns.1.desc_tallinn: "[ShowLocationName('tallinn')] is ours, and the trade of the Gulf of Finland already pays our tolls there. But its merchants are Germans who look to Lübeck, and our Finnish shore has no town of its own. $swe_towns.1.desc_plan$"
 swe_towns.1.desc_plan: "The Crown proposes to found one at the rapids where the Vanda river meets the sea, and to call it Helsingfors. So that the new town has [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] from the start, the merchants of Ekenäs, Borgå, Raumo and Ulvsby would be ordered to move there."
 swe_towns.1.historical_info: "On 12 June 1550 Gustav Vasa founded Helsingfors at the mouth of the Vanda river. Burghers who refused to move there stood to lose their trading rights. The harbour drew little trade, and Helsingfors remained a small and poor town until it was moved to the Estnäs peninsula in 1640."
 swe_towns.1.a: "A town to rival [ShowLocationNameWithNoTooltip('tallinn')]!"
 swe_towns.1.a_tallinn: "A town of our own on the Finnish shore!"
 swe_towns.1.a_tallinn.entry: "$swe_towns.1.a.entry$"
 swe_towns.1.a.entry: "Helsingfors was founded."
 swe_towns.1.b: "Let the burghers stay where they are."
 swe_towns.1.b.entry: "The burghers stayed in their towns."
 swe_towns.1.a_tt: "The burgher [pops|e] of [ShowLocationName('ekenas')], [ShowLocationName('porvoo')], [ShowLocationName('raumo')] and [ShowLocationName('bjorneborg')] lose 15% [pop_satisfaction|e]."
 swe_towns.1.b_tt: "The burgher [pops|e] of [ShowLocationName('ekenas')], [ShowLocationName('porvoo')], [ShowLocationName('raumo')] and [ShowLocationName('bjorneborg')] gain 5% [pop_satisfaction|e]."

 swe_towns.2.title: "A Town at Tingvalla"
 swe_towns.2.entry: "$swe_towns.2.title$"
 swe_towns.2.desc: "Where the Klarälven flows into Lake Vänern, the people of Värmland have long met at the ting of [ShowLocationName('tingvalla')] to settle disputes and to trade. The market there has grown large enough to be a town, and the Crown could grant it town privileges and a new name: Karlstad. But only forty-five families live on the island, the whole of Värmland would be called out to bridge the river for them, and the market at Bro, further along the lake, wants the same charter."
 swe_towns.2.historical_info: "In March 1584 Duke Karl, the youngest son of Gustav Vasa and later King Karl IX, granted town privileges to the old ting and market place of Tingvalla and named it Karlstad after himself. He also gave the town the whole of Tingvalla island, and ordered people from all over Värmland to help build two bridges over the river. Two years earlier he had granted town rights to Bro, later Kristinehamn, but they were moved to Karlstad, which became the first lasting town in Värmland."
 swe_towns.2.a: "Let it be Karlstad."
 swe_towns.2.a.entry: "Tingvalla became Karlstad."
 swe_towns.2.a_tt: "The peasant [pops|e] in every [location|e] we own in [ShowProvinceDefinitionName('varmland_province')] lose 5% [pop_satisfaction|e]."
 swe_towns.2.b: "Tingvalla can stay a market."
 swe_towns.2.b.entry: "Tingvalla stayed a market."
 swe_towns.2.b_tt: "The peasant [pops|e] in every [location|e] we own in [ShowProvinceDefinitionName('varmland_province')] gain 5% [pop_satisfaction|e]."

 swe_towns.3.title: "A Town by Korsholm"
 swe_towns.3.entry: "$swe_towns.3.title$"
 swe_towns.3.desc: "Near the castle of [ShowLocationName('korsholm')] there is an old harbour, where the peasants of Österbotten come to sell their [ShowGoodsName('tar')], [ShowGoodsName('fish')] and butter. With a town charter, it could become the Crown's trading town on this part of the Bothnian coast. It has managed without one since the days of Magnus Eriksson."
 swe_towns.3.historical_info: "Magnus Eriksson set up a customs and trading post at Mussor in 1348. On 2 October 1606 Karl IX founded a town by the old harbour near Korsholm castle and church. It was first called Mussor, after the parish, but within a few years it was renamed Vasa in honour of the royal house. It kept the name until 1855, when it was renamed Nikolaistad."
 swe_towns.3.a: "Found the town."
 swe_towns.3.a.entry: "A town was founded by Korsholm."
 swe_towns.3.b: "The harbour is enough."
 swe_towns.3.b.entry: "The harbour was left as it was."

 swe_towns.4.title: "A Town at Selånger"
 swe_towns.4.entry: "$swe_towns.4.title$"
 swe_towns.4.desc: "The peasants of Medelpad sell their goods themselves, and little of the profit reaches the Crown. A town on the land of [ShowLocationName('selanger')] parish, to be called Sundsvall, would give the region's trade a place where it must go and can be taxed. The neighbouring parishes are against it, since they would lose their own trade."
 swe_towns.4.historical_info: "Sundsvall was founded on the land of Selånger parish in 1621. It was one of several Norrland towns founded by Gustav II Adolf to bring the trade of the north under royal control, against the wishes of the neighbouring parishes. The site was poor: the land rose and the bay grew shallow, and by 1646 Axel Oxenstierna was looking into moving the town closer to the sea."
 swe_towns.4.a: "Found Sundsvall."
 swe_towns.4.a.entry: "Sundsvall was founded."
 swe_towns.4.a_tt: "The peasant [pops|e] in [ShowLocationName('selanger')] and [ShowLocationName('havero')] lose 5% [pop_satisfaction|e] if we own them."
 swe_towns.4.b: "Leave Medelpad to its peasants."
 swe_towns.4.b.entry: "Medelpad stayed without a town."
 swe_towns.4.b_tt: "The peasant [pops|e] in [ShowLocationName('selanger')] and [ShowLocationName('havero')] gain 5% [pop_satisfaction|e] if we own them."

 swe_towns.5.title: "Bogesund's Petition"
 swe_towns.5.entry: "$swe_towns.5.title$"
 swe_towns.5.desc: "The burghers of [ShowLocationName('bogesund')] have lost their right to drive oxen and sell provisions from farm to farm, and the neighbouring town of Borås is taking their trade. They now hope to win back the Crown's favour by giving their town a royal name: Ulricehamn. The old name has served for centuries, and a new one will not bring back the oxen."
 swe_towns.5.historical_info: "Bogesund was an old town, mentioned in Erik's Chronicle in 1307. A few years before 1741 it lost its right to the travelling trade in oxen and provisions. At the Riksdag of 1741 its mayor asked to rename the town Ulricehamn in honour of Queen Ulrika Eleonora, and it got its trading rights back on the same terms as Borås. Even so, trade stayed weak for many years."
 swe_towns.5.a: "A royal name for a loyal town."
 swe_towns.5.a.entry: "Bogesund became Ulricehamn."
 swe_towns.5.b: "Bogesund keeps its old name."
 swe_towns.5.b.entry: "Bogesund kept its name."

 swe_towns.6.title: "A Town on Storsjön"
 swe_towns.6.entry: "$swe_towns.6.title$"
 swe_towns.6.desc: "The people of Jämtland have always traded across the mountains with Norway, and little of that trade reaches the rest of [ROOT.GetCountry.GetName]. A new town on the mainland across the sound from [ShowLocationName('froso')], where there is nothing yet but a ferry landing, could draw it east, if it were free of taxes and guilds for its first twenty years. The merchants of [ShowLocationNameWithNoTooltip('froso')] would be asked to move there, and they have no wish to leave so rich a parish."
 swe_towns.6.historical_info: "Gustav III signed the founding charter of Östersund on 23 October 1786, on land bought from the Odensala farmers across the sound from Frösön. The town was meant to bring Jämtland's lucrative trade under Swedish control, and was freed from taxes, trade rules and guilds for twenty years. The merchants of Frösön stayed where they were, and growth was slow: in 1820 it still had fewer than four hundred inhabitants."
 swe_towns.6.a: "Found Östersund."
 swe_towns.6.a.entry: "Östersund was founded."
 swe_towns.6.b: "Jämtland can do without a town."
 swe_towns.6.b.entry: "[ShowLocationNameWithNoTooltip('froso')] stayed the heart of Jämtland."

 swe_towns.7.title: "A Town at Koppö"
 swe_towns.7.entry: "$swe_towns.7.title$"
 swe_towns.7.desc: "Our governor-general in Finland has a passion for founding towns, and he now wants one on the peninsula of [ShowLocationName('koppo')]. His surveyor would lay it out with a straight grid of streets, in the modern fashion, and he proposes to name it after his wife. All he needs is the Crown's blessing and a little of its money."
 swe_towns.7.historical_info: "On 5 December 1649, at Åbo castle, Count Per Brahe the Younger, Governor-General of Finland, issued a letter of foundation for a new town on the peninsula of Koppö in Lappfjärd parish. The surveyor Claes Claesson drew its Renaissance grid plan in 1651, and from 1 March 1651 the town was called Kristinestad, after Brahe's wife, Kristina Katarina Stenbock."
 swe_towns.7.a: "Found Kristinestad."
 swe_towns.7.a.entry: "Kristinestad was founded."
 swe_towns.7.b: "The coast has towns enough."
 swe_towns.7.b.entry: "[ShowLocationNameWithNoTooltip('koppo')] was left as it was."

 swe_towns.5.desc_alone: "The burghers of [ShowLocationName('bogesund')] have lost their right to drive oxen and sell provisions from farm to farm, and their trade is slipping away. They now hope to win back the Crown's favour by giving their town a royal name: Ulricehamn. The old name has served for centuries, and a new one will not bring back the oxen."

 STATIC_MODIFIER_NAME_swe_boras_privileges: "The Peddlers' Town"
 STATIC_MODIFIER_DESC_swe_boras_privileges: "The burghers of Borås may trade wherever they wish in the realm, once their goods have paid customs here."

 swe_towns.8.title: "A Town at Torpa"
 swe_towns.8.entry: "$swe_towns.8.title$"
 swe_towns.8.desc: "Men from the hundreds around [ShowLocationName('skene')] have come to us with a grievance: the neighbouring towns will not leave their peddlers alone. The towns have the law on their side. The farmers here walk the realm with packs of their own goods, and none of it has paid customs anywhere. They can be told to give up the trade by midsummer. Or they can be told to build a town of their own by the church at Torpa, where their goods would be taxed before they leave, and the Crown would have a town it did not pay for. The towns that complain would then have one more rival, this time a lawful one."
 swe_towns.8.historical_info: "In the spring of 1620 the district sent representatives to Gustav II Adolf to complain of how the neighbouring towns treated its peddlers, the knallar. Their goods had paid customs nowhere, which irritated the merchants' guilds and the Crown alike. The king told them to end their trade by midsummer or found a town. They chose the town, which was laid out around the parish church of Torpa. It received provisional privileges on 29 June 1621, and the king signed its charter on 25 May 1622. In 1624 the burghers of Borås were given the right to trade wherever they wished in the realm, provided their goods had paid customs in Borås."
 swe_towns.8.a: "Let them build their town."
 swe_towns.8.a.entry: "The peddlers founded the town of Borås."
 swe_towns.8.a_tt: "The burgher [pops|e] in every [location|e] we own in [ShowProvinceDefinitionName('vastergotland_province')] lose 5% [pop_satisfaction|e]."
 swe_towns.8.b: "The trade ends at midsummer."
 swe_towns.8.b.entry: "The peddlers were told to stop."
 swe_towns.8.b_tt: "The burgher [pops|e] in every [location|e] we own in [ShowProvinceDefinitionName('vastergotland_province')] gain 5% [pop_satisfaction|e]."
