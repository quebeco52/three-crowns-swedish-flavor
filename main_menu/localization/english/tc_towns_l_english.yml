 STATIC_MODIFIER_NAME_swe_ostersund_freedoms: "Östersund's Freedoms"
 STATIC_MODIFIER_DESC_swe_ostersund_freedoms: "The new town is free of taxes, trade rules and guilds for twenty years, and settlers are coming."

 swe_towns.1.title: "The Founding of Helsingfors"
 swe_towns.1.entry: "$swe_towns.1.title$"
 swe_towns.1.desc: "The merchants of Reval grow rich on the trade of the Gulf of Finland, trade that could be ours. At the rapids where the Vanda river meets the sea, the Crown proposes a new town: Helsingfors. To give it burghers from the first day, the merchants of Ekenäs, Borgå, Raumo and Ulvsby would be ordered to move there, whether they like it or not."
 swe_towns.1.historical_info: "On 12 June 1550 Gustav Vasa founded Helsingfors at the mouth of the Vanda river, to compete with Hanseatic Reval across the Gulf of Finland. The burghers of Borgå, Ekenäs, Raumo and Ulvsby were ordered to move to the new town on pain of losing their trading rights. The harbour drew little trade, and Helsingfors remained a small and poor town until it was moved to the Estnäs peninsula in 1640."
 swe_towns.1.a: "A town to rival Reval."
 swe_towns.1.a.entry: "Helsingfors is founded."
 swe_towns.1.b: "Let the burghers stay where they are."
 swe_towns.1.b.entry: "The burghers stay in their towns."

 swe_towns.2.title: "A Town at Tingvalla"
 swe_towns.2.entry: "$swe_towns.2.title$"
 swe_towns.2.desc: "Where the Klarälven meets Lake Vänern, the people of Värmland have long gathered at the thing of [ShowLocationName('tingvalla')] to judge and to trade. The market has grown, and the Crown can give it town privileges and a new name: Karlstad, the first town of Värmland."
 swe_towns.2.historical_info: "In March 1584 Duke Karl, the youngest son of Gustav Vasa and later King Karl IX, granted town privileges to the old thing and market place of Tingvalla and named it Karlstad after himself. He also gave the town the whole of Tingvalla island. It was the first town in Värmland."
 swe_towns.2.a: "Let it be Karlstad."
 swe_towns.2.a.entry: "Tingvalla becomes Karlstad."
 swe_towns.2.b: "Tingvalla can stay a market."
 swe_towns.2.b.entry: "Tingvalla stays a market."

 swe_towns.3.title: "A Town by Korsholm"
 swe_towns.3.entry: "$swe_towns.3.title$"
 swe_towns.3.desc: "Below the walls of [ShowLocationName('korsholm')] lies an old harbour where the peasants of Österbotten bring their tar, fish and butter. A chartered town here would give the Crown a trading place on the Bothnian coast, and a town worthy of the royal house."
 swe_towns.3.historical_info: "On 2 October 1606 Karl IX founded a town by the old harbour near Korsholm castle and church. It was first called Mussor, after the parish, but within a few years it was renamed Vasa in honour of the royal house. Vasa kept its name until 1855."
 swe_towns.3.a: "Found the town."
 swe_towns.3.a.entry: "A town is founded by Korsholm."
 swe_towns.3.b: "The harbour is enough."
 swe_towns.3.b.entry: "The harbour stays as it is."

 swe_towns.4.title: "A Town at Selånger"
 swe_towns.4.entry: "$swe_towns.4.title$"
 swe_towns.4.desc: "The trade of Medelpad passes through the hands of its peasants, out of the Crown's reach. The Crown can found a town on the land of [ShowLocationName('selanger')] parish, Sundsvall, where that trade must go. The neighbouring parishes are against it."
 swe_towns.4.historical_info: "Sundsvall was founded on the land of Selånger parish in 1621, one of the Norrland towns that Gustav II Adolf chartered in the 1620s to bring the trade of the north under royal control. The neighbouring parishes opposed it. The site proved poor as the land rose and the bay grew shallow, and by 1646 Axel Oxenstierna had the town's move closer to the sea investigated."
 swe_towns.4.a: "Found Sundsvall."
 swe_towns.4.a.entry: "Sundsvall is founded."
 swe_towns.4.b: "Leave Medelpad to its peasants."
 swe_towns.4.b.entry: "Medelpad stays without a town."

 swe_towns.5.title: "Bogesund Becomes Ulricehamn"
 swe_towns.5.entry: "$swe_towns.5.title$"
 swe_towns.5.desc: "The burghers of [ShowLocationName('bogesund')] have lost their right to the travelling cattle trade, and they hope to win the Crown's favour back. They ask to rename their town Ulricehamn, in honour of the Queen."
 swe_towns.5.historical_info: "Bogesund was an old town, mentioned in Erik's Chronicle in 1307. In 1741 it was renamed Ulricehamn in honour of Queen Ulrika Eleonora. The burghers hoped the gesture would help them win back the trade privileges they had lost a few years earlier."
 swe_towns.5.a: "The Queen will be honoured."
 swe_towns.5.a.entry: "Bogesund becomes Ulricehamn."
 swe_towns.5.b: "Bogesund keeps its old name."
 swe_towns.5.b.entry: "Bogesund keeps its name."

 swe_towns.6.title: "A Town on Storsjön"
 swe_towns.6.entry: "$swe_towns.6.title$"
 swe_towns.6.desc: "The Jämts trade over the mountains with Norway, as they always have, and the Crown sees little of it. A town on the mainland across the sound from [ShowLocationName('froso')], free of taxes and guilds for its first twenty years, could draw that trade to Sweden. The merchants of Frösön would be asked to move there."
 swe_towns.6.historical_info: "Gustav III signed the founding charter of Östersund on 23 October 1786, on land bought from the Odensala farmers across the sound from Frösön. The town was meant to bring Jämtland's lucrative trade under Swedish control, and was freed from taxes, trade rules and guilds for twenty years. Growth was slow: in 1820 it still had fewer than four hundred inhabitants."
 swe_towns.6.a: "Found Östersund."
 swe_towns.6.a.entry: "Östersund is founded."
 swe_towns.6.b: "Frösön is enough."
 swe_towns.6.b.entry: "Frösön stays the heart of Jämtland."
