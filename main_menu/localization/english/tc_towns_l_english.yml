 STATIC_MODIFIER_NAME_swe_ostersund_freedoms: "Östersund's Freedoms"
 STATIC_MODIFIER_DESC_swe_ostersund_freedoms: "For its first twenty years the new town pays no taxes and has no guilds or trade restrictions, and settlers are moving in."

 swe_towns.1.title: "The Founding of Helsingfors"
 swe_towns.1.entry: "$swe_towns.1.title$"
 swe_towns.1.desc: "The merchants of [ShowLocationName('tallinn')] grow rich on the trade of the Gulf of Finland, and our side of the gulf has no town that can compete. The Crown proposes to found one at the rapids where the Vanda river meets the sea, and to call it Helsingfors. So that the new town has [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] from the start, the merchants of Ekenäs, Borgå, Raumo and Ulvsby would be ordered to move there."
 swe_towns.1.historical_info: "On 12 June 1550 Gustav Vasa founded Helsingfors at the mouth of the Vanda river, to compete with Hanseatic Reval (Tallinn) across the Gulf of Finland. The burghers of Borgå, Ekenäs, Raumo and Ulvsby were ordered to move to the new town on pain of losing their trading rights. The harbour drew little trade, and Helsingfors remained a small and poor town until it was moved to the Estnäs peninsula in 1640."
 swe_towns.1.a: "A town to rival [ShowLocationNameWithNoTooltip('tallinn')]!"
 swe_towns.1.a.entry: "Helsingfors is founded."
 swe_towns.1.b: "Let the burghers stay where they are."
 swe_towns.1.b.entry: "The burghers stay in their towns."

 swe_towns.2.title: "A Town at Tingvalla"
 swe_towns.2.entry: "$swe_towns.2.title$"
 swe_towns.2.desc: "Where the Klarälven flows into Lake Vänern, the people of Värmland have long met at the thing of [ShowLocationName('tingvalla')] to settle disputes and to trade. The market there has grown large enough to be a town, and the Crown could grant it town privileges and a new name: Karlstad."
 swe_towns.2.historical_info: "In March 1584 Duke Charles, the youngest son of Gustav Vasa and later King Charles IX, granted town privileges to the old thing and market place of Tingvalla and named it Karlstad after himself. He also gave the town the whole of Tingvalla island. Two years earlier he had granted town rights to Bro, later Kristinehamn, but they were moved to Karlstad, which became the first lasting town in Värmland."
 swe_towns.2.a: "Let it be Karlstad."
 swe_towns.2.a.entry: "Tingvalla becomes Karlstad."
 swe_towns.2.b: "Tingvalla can stay a market."
 swe_towns.2.b.entry: "Tingvalla stays a market."

 swe_towns.3.title: "A Town by Korsholm"
 swe_towns.3.entry: "$swe_towns.3.title$"
 swe_towns.3.desc: "Near the castle of [ShowLocationName('korsholm')] there is an old harbour, where the peasants of Österbotten come to sell their [ShowGoodsName('tar')], [ShowGoodsName('fish')] and butter. With a town charter, it could become the Crown's trading town on this part of the Bothnian coast."
 swe_towns.3.historical_info: "On 2 October 1606 Charles IX founded a town by the old harbour near Korsholm castle and church. It was first called Mussor, after the parish, but within a few years it was renamed Vasa in honour of the royal house. It kept the name until 1855, when it was renamed Nikolaistad."
 swe_towns.3.a: "Found the town."
 swe_towns.3.a.entry: "A town is founded by Korsholm."
 swe_towns.3.b: "The harbour is enough."
 swe_towns.3.b.entry: "The harbour stays as it is."

 swe_towns.4.title: "A Town at Selånger"
 swe_towns.4.entry: "$swe_towns.4.title$"
 swe_towns.4.desc: "The peasants of Medelpad sell their goods themselves, and little of the profit reaches the Crown. A town on the land of [ShowLocationName('selanger')] parish, to be called Sundsvall, would give the region's trade a place where it must go and can be taxed. The neighbouring parishes are against it, since they would lose their own trade."
 swe_towns.4.historical_info: "Sundsvall was founded on the land of Selånger parish in 1621. It was one of several Norrland towns founded by Gustavus Adolphus to bring the trade of the north under royal control, against the wishes of the neighbouring parishes. The site was poor: the land rose and the bay grew shallow, and by 1646 Axel Oxenstierna was looking into moving the town closer to the sea."
 swe_towns.4.a: "Found Sundsvall."
 swe_towns.4.a.entry: "Sundsvall is founded."
 swe_towns.4.b: "Leave Medelpad to its peasants."
 swe_towns.4.b.entry: "Medelpad stays without a town."

 swe_towns.5.title: "Bogesund Becomes Ulricehamn"
 swe_towns.5.entry: "$swe_towns.5.title$"
 swe_towns.5.desc: "The burghers of [ShowLocationName('bogesund')] have lost their right to drive oxen and sell provisions from farm to farm, and the neighbouring town of Borås is taking their trade. They now hope to win back the Crown's favour by giving their town a royal name: Ulricehamn."
 swe_towns.5.historical_info: "Bogesund was an old town, mentioned in Erik's Chronicle in 1307. A few years before 1741 it lost its right to the travelling trade in oxen and provisions. At the Riksdag of 1741 its mayor asked to rename the town Ulricehamn in honour of Queen Ulrika Eleonora, and it got its trading rights back on the same terms as Borås. Trade stayed weak for many years all the same."
 swe_towns.5.a: "A royal name for a loyal town."
 swe_towns.5.a.entry: "Bogesund becomes Ulricehamn."
 swe_towns.5.b: "Bogesund keeps its old name."
 swe_towns.5.b.entry: "Bogesund keeps its name."

 swe_towns.6.title: "A Town on Storsjön"
 swe_towns.6.entry: "$swe_towns.6.title$"
 swe_towns.6.desc: "The people of Jämtland have always traded across the mountains with Norway, and little of that trade reaches the rest of [ROOT.GetCountry.GetName]. A new town on the mainland across the sound from [ShowLocationName('froso')] could draw it east, if it were free of taxes and guilds for its first twenty years. The merchants of [ShowLocationNameWithNoTooltip('froso')] would be asked to move there."
 swe_towns.6.historical_info: "Gustav III signed the founding charter of Östersund on 23 October 1786, on land bought from the Odensala farmers across the sound from Frösön. The town was meant to bring Jämtland's lucrative trade under Swedish control, and was freed from taxes, trade rules and guilds for twenty years. Growth was slow: in 1820 it still had fewer than four hundred inhabitants."
 swe_towns.6.a: "Found Östersund."
 swe_towns.6.a.entry: "Östersund is founded."
 swe_towns.6.b: "Jämtland can do without a town."
 swe_towns.6.b.entry: "[ShowLocationNameWithNoTooltip('froso')] stays the heart of Jämtland."

 swe_towns.7.title: "A Town at Koppö"
 swe_towns.7.entry: "$swe_towns.7.title$"
 swe_towns.7.desc: "Our governor-general in Finland has a passion for founding towns, and he now wants one on the peninsula of [ShowLocationName('koppo')]. His surveyor would lay it out with a straight grid of streets, in the modern fashion, and he proposes to name it after his wife. All he needs is the Crown's blessing and a little of its money."
 swe_towns.7.historical_info: "On 5 December 1649, at Åbo castle, Count Per Brahe the Younger, Governor-General of Finland, issued a letter of foundation for a new town on the peninsula of Koppö in Lappfjärd parish. The surveyor Claes Claesson drew its Renaissance grid plan in 1651, and from 1 March 1651 the town was called Christinestad, after Brahe's wife, Christina Catharina Stenbock."
 swe_towns.7.a: "Found Kristinestad."
 swe_towns.7.a.entry: "Kristinestad is founded."
 swe_towns.7.b: "The coast has towns enough."
 swe_towns.7.b.entry: "[ShowLocationNameWithNoTooltip('koppo')] stays as it is."
