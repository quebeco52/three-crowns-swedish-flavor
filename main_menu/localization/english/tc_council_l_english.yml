l_english:
 STATIC_MODIFIER_NAME_swe_tyska_radet: "The German Council"
 STATIC_MODIFIER_DESC_swe_tyska_radet: "By the town law, half the mayors and councillors here must be Germans. The merchants of Lübeck and the other Hanseatic towns trade freely through them, and they answer to their own countrymen as much as to the Crown."

 swe_svenska_radman_decision.title: "Swedes on the Council"
 swe_svenska_radman_decision.desc: "The town law still gives half the seats on the councils of [ShowLocationName('stockholm')] and [ShowLocationName('kalmar')] to Germans. In [ShowLocationNameWithNoTooltip('stockholm')] the Swedish [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] now outnumber them, and they ask why foreigners should hold half the town's offices. If we strike the clause from the law, the councils would be ours alone, but Lübeck would not forget it."
 swe_svenska_radman_decision.desc.entry: "The German half of the town councils could be abolished."
 swe_svenska_radman_decision.historical_info: "Magnus Eriksson's town law of around 1350 laid down that half the mayors and councillors of a Swedish town should be Germans, a sign of how many German merchants had settled in Stockholm, Kalmar and other towns since the 13th century. In 1471, after Sten Sture's victory over Christian I at Brunkeberg, the rule was struck out and the town councils were closed to the foreign-born. German merchants went on trading in Stockholm, but they no longer governed it."
 swe_svenska_radman_decision.a: "Only Swedes on the council."
 swe_svenska_radman_decision.majority_tt: "German [ShowEstateTypeName('burghers_estate')] are a minority in [ShowLocationName('stockholm')]"

 swe_council.1.title: "The Käpplinge Murders"
 swe_council.1.entry: "$swe_council.1.title$"
 swe_council.1.desc: "The Germans of [ShowLocationName('stockholm')] have taken matters into their own hands. Sure that their Swedish neighbours meant to open the gates to our enemies, the band they call the Hättebröder seized those they suspected, ferried them to Käpplingeholmen, locked them in a house and set it on fire. The German councillors say the dead were traitors. Across the realm, Swedes call it murder, and they are waiting to see whose side the Crown takes."
 swe_council.1.historical_info: "In February 1389 King Albrekt of Mecklenburg was defeated and captured at Åsle by the forces of Queen Margareta. Stockholm, where German burghers held half the council, stayed loyal to him. That June the Hättebröder, a party of German burghers, arrested Swedish burghers they suspected of siding with Margareta, and on 17 June burned them on Käpplingeholmen, today's Blasieholmen. The number of victims is uncertain, and some historians date the murders to 1392. The murders secured Stockholm for the German party, which held the town with the help of the Victual Brothers until the settlement at Lindholm in 1395. The Hanseatic towns then held Stockholm in pledge and handed it to Margareta in 1398."
 swe_council.1.a: "They were traitors. The council acted for the Crown."
 swe_council.1.a.entry: "The Crown stood by the German council."
 swe_council.1.b: "Hang the Hättebröder."
 swe_council.1.b.entry: "The Hättebröder were punished."

 STATIC_MODIFIER_NAME_swe_rafst: "The Räfst"
 STATIC_MODIFIER_DESC_swe_rafst: "The Crown's judges have sat here and ruled on who owns what. Half the titles in the district now rest on a letter with our seal on it, and everyone in the district knows it."

 swe_council.2.title: "A Reckoning of the Land"
 swe_council.2.entry: "$swe_council.2.title$"
 swe_council.2.desc: "Land in this realm passes by sale, gift, pledge and inheritance, and after enough years nobody can say with confidence who owns what. Two of our great officers could ride from [ShowLocationName('vaxjo')] to [ShowLocationName('linkoping')] with our full authority and hear every property case on the way, and each judgment would be given in our name. They would push the local courts aside as they went. Since they would be laymen judging the church's land as well, the cathedral chapters would call it an offence against church law. If we leave the cases where they are, the chapters keep their rights, and every doubtful title stays exactly as doubtful as it is."
 swe_council.2.historical_info: "In November 1453 Karl Knutsson sent his son-in-law and hovmästare Erik Eriksson (Gyllenstierna) and his chancellor Nicolaus Ryting on a räfst through the whole realm except Finland. By March 1454 they had sat at Växjö, Jönköping, Skara, Örebro, Västerås, Uppsala, Strängnäs and Linköping. About 40 of their judgments survive, covering every kind of property case. Only laymen sat as judges, even when a church institution was a party, and local authorities were sidelined. In January 1454 Archbishop Jöns Bengtsson and three of his bishops protested to the king that the procedure was against the church's law. Historians still dispute whether the räfst was meant to push back the church's gains. It did leave a date behind: the Västerås recess of 1527 used it as the time limit for nobles reclaiming land given to the church."
 swe_council.2.a: "Send the judges."
 swe_council.2.a.entry: "The Crown's judges rode through the realm."
 swe_council.2.a_tt: "[ShowLocationName('vaxjo')], [ShowLocationName('jonkoping')], [ShowLocationName('skara')], [ShowLocationName('orebro')], [ShowLocationName('vasteras')], [ShowLocationName('uppsala')], [ShowLocationName('strangnas')] and [ShowLocationName('linkoping')] gain [ShowModifier('swe_rafst')] for 20 years if we own them."
 swe_council.2.b: "Leave it to the local courts."
 swe_council.2.b.entry: "Land disputes were left to the local courts."

 STATIC_MODIFIER_NAME_swe_avelsgard: "The Avelsgård"
 STATIC_MODIFIER_DESC_swe_avelsgard: "The best land beside the castle is the Crown's own farm now, with a hundred cows in its byres. The tenants who held it were given land in other parishes, and those who remain owe it their days at ploughing, harvest and haymaking."

 swe_council.3.title: "Feeding the Castles"
 swe_council.3.entry: "$swe_council.3.title$"
 swe_council.3.desc: "Our castles live on what the bailiffs collect from the farms around them: rent, tithe and dues, paid in grain, butter and meat. That has always fed a garrison, and it will not feed the cavalry we now mean to keep. The Crown could farm for itself instead. Beside each castle we would take the best village land, give its tenants holdings in other parishes, and stock it with a hundred cows and the oxen to plough for them. The peasants who stay would owe the farm their days at ploughing, harvest and haymaking, in the same weeks that their own fields want them. Three provinces in the north have already offered to pay a third more in rent to be spared, so there is butter to be had without any of this."
 swe_council.3.historical_info: "From the 1540s Gustav Vasa wanted his royal manors to yield a surplus of grain, butter and cheese instead of eating what they grew. In the autumn of 1555 he ordered crown farms, avelsgårdar, set up across the realm: one in every parish in Finland and one in every second or third pastorate in Sweden, each to keep a hundred cows and feed twenty cavalry horses. Little came of it in Sweden. In Finland about fifty new estates took some 270 farms, and at Esbo fourteen households were moved to other parishes. Hälsingland, Medelpad and Ångermanland offered a third more rent to be left alone, and paid a tax in butter instead. In 1561 the Finnish farms were found to give little profit for their great cost in day-labour, and many were closed or let to tenants within a few years. Horn on Öland stayed in the Crown's hands until 1937."
 swe_council.3.a: "A farm beside every castle."
 swe_council.3.a.entry: "The Crown set up its own farms beside the castles."
 swe_council.3.a_tt: "Every [location|e] with a fort that we own in [ShowAreaName('svealand_area')], [ShowAreaName('gotaland_area')], [ShowAreaName('norrland_area')] and [ShowAreaName('finland_area')] gains [ShowModifier('swe_avelsgard')] for 15 years, and the peasant [pops|e] there lose 10% [pop_satisfaction|e]."
 swe_council.3.b: "Take the butter."
 swe_council.3.b.entry: "The peasants paid more in butter and kept their land."
 swe_council.4.title: "Stones and Forefathers"
 swe_council.4.entry: "$swe_council.4.title$"
 swe_council.4.desc: "Our scholars read in the old histories that the Goths who humbled Rome went out from this country, and that the kings of the Goths were the forefathers of ours. They point to the runestones along our roads and the great mounds outside [ShowLocationName('uppsala')] as the proof. One of them now asks that the Crown give the search an office of its own: an antiquary to travel the realm, draw the stones and collect the coins, chronicles and old law books that still lie in churches and manors. The nobility would gladly hear that their blood is older than Rome's. A realm that looks to its forefathers for every answer may, though, be slow to find new ones."
 swe_council.4.historical_info: "On 20 May 1630 Gustav II Adolf created the office of riksantikvarie, royal antiquary, and gave it to Johannes Bureus, the rune scholar who had been his tutor. Bureus travelled the realm drawing runestones and collecting old coins, chronicles and law books. The office served Gothicism (göticism), the belief that the Goths of antiquity had come from Sweden. Johannes Magnus's history of the Gothic and Swedish kings, printed in 1554, had made it the Vasa kings' own: its invented king-list began with Magog, grandson of Noah, and Erik XIV and Karl IX took their high numbers from it. In 1666 the regency council of the young Karl XI issued a placat on old monuments and antiquities, often called the first antiquities law in the world. The riksantikvarie still heads the Swedish National Heritage Board."
 swe_council.4.a: "Appoint a royal antiquary."
 swe_council.4.a.entry: "The Crown appointed a royal antiquary to search out the realm's past."
 swe_council.4.b: "Leave the stones to the scholars."
 swe_council.4.b.entry: "The Crown left the old stones to the scholars."


 swe_council.6.title: "The Bands of the Provinces"
 swe_council.6.entry: "$swe_council.6.title$"
 swe_council.6.desc: "The war is over, and the bands called out from the provinces are still under arms, waiting to be paid off and sent home. The captains would keep them on the rolls: one man in every ten or twenty taken for standing service, gathered province by province into companies of about five hundred, so that the next war finds them ready. The farms would be a man short every year. Or we can send them home to the harvest and hire companies again when war comes, out of the tax the farms already pay in place of service. Hired men cost more, and they serve whoever pays them."
 swe_council.6.historical_info: "At the Riksdag of Västerås in 1544 the king was allowed to keep on the rolls the peasant bands raised in the Dacke war, then just ended, and to recruit them from then on. The countryside was divided into groups of ten to twenty men, each of which gave one man as a standing soldier, and the men of each province formed companies, fänikor, of about five hundred. Until then the Crown had relied mostly on hired companies, paid for by a tax in place of service. The men of Uppland's companies fought at Halmstad and Mared in 1563, where one company lost 265 men, at Varberg in 1565 and at Narva in 1581. Under Gustav II Adolf the companies were merged into regiments."
 swe_council.6.a: "Keep them on the rolls."
 swe_council.6.a.entry: "The provincial bands were kept on the rolls."
 swe_council.6.b: "Send them home."
 swe_council.6.b.entry: "The provincial bands went home."
 STATIC_MODIFIER_NAME_swe_hired_companies: "Hired Companies"
 STATIC_MODIFIER_DESC_swe_hired_companies: "The provincial bands have gone home, and the Crown pays for companies of hired foot when it needs them."
