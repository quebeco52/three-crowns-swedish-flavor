l_english:
 swe_russia.1.title: "Novgorod and Moscow"
 swe_russia.1.entry: "$swe_russia.1.title$"
 swe_russia.1.desc: "[ShowLocationName('novgorod')] and [ShowLocationName('moscow')] both answer to [ROOT.GetCountry.GetName] now, the old merchant city on the Volkhov and the seat of the grand princes. The two great cities of the Rus have one master, and not a Russian one. The treasury in the Kremlin is ours to dispose of. Carried to [ShowLocationName('stockholm')], it would pay for a good part of the war, but the Orthodox priests would preach in every church from the Neva to the Oka that we had robbed the house of God. The merchants of Moscow offer instead to buy the city's safety, though they will find the sum harder to raise than to promise. Or we could leave the churches and their treasures alone. The faith is what keeps the Russian lands quiet, and quiet Russian lands are worth more to us than the Kremlin's plate."
 swe_russia.1.desc_subject: "[ShowLocationName('novgorod')] and [ShowLocationName('moscow')] both answer to [ROOT.GetCountry.GetName] now, the old merchant city on the Volkhov and the seat of the grand princes. The two great cities of the Rus have one master, and not a Russian one. [swe_moscow_holder.GetName] holds the Kremlin under our protection, and its treasury is ours for the asking. Carried to [ShowLocationName('stockholm')], it would pay for a good part of the war, but [swe_moscow_holder.GetName] would not soon forgive it, and the Orthodox priests would preach in every church from the Neva to the Oka that we had robbed the house of God. The merchants of Moscow offer instead to buy the city's safety, though they will find the sum harder to raise than to promise. Or we could leave the churches and their treasures alone. The faith is what keeps the Russian lands quiet, and quiet Russian lands are worth more to us than the Kremlin's plate."
 swe_russia.1.historical_info: "Swedish troops entered Moscow only once, and as allies. Under the Treaty of Viborg of 1609 Tsar Vasily Shuisky hired a corps of mostly foreign mercenaries from Karl IX, paid by Russia, at the price of Kexholm, and in March 1610 Jacob De la Gardie rode into Moscow beside the tsar's nephew Mikhail Skopin-Shuisky. At Klushino on 24 June 1610 the unpaid mercenaries went over to the Poles. De la Gardie stormed Novgorod in July 1611 and held it until 1617. A Swedish history of 1671 says he promised to keep the city's ancient Greek religion inviolate, and St Sophia kept its services throughout, though in 1616 he demanded 6,000 roubles of the metropolitan. He came home with sables and church bells, which he said he had only bought from soldiers who took them by right of war, and Novgorod's archives are in Riksarkivet still. In 1632 Gustav II Adolf promised Munich its safety and its religion for 300,000 riksdaler; the city raised about a third and gave hostages for the rest. Karl XII marched on Russia in 1707, meaning, in his minister Carl Piper's words, to make the peace in Moscow itself. In September 1708 at Tatarsk, forty Swedish miles short of the city, hunger and scorched earth turned him south into Ukraine, and his army was destroyed at Poltava the next summer."
 swe_russia.1.a: "Carry the treasury to [ShowLocationNameWithNoTooltip('stockholm')]."
 swe_russia.1.a.entry: "We carried the Kremlin's treasury home."
 swe_russia.1.b: "Let Moscow buy its safety."
 swe_russia.1.b.entry: "Moscow bought its safety from us."
 swe_russia.1.c: "Leave the churches their treasures."
 swe_russia.1.c.entry: "We left the Orthodox churches alone."
 swe_russia.1.novgorod_tt: "[ShowLocationName('novgorod')] is held by us or one of our subjects."
 swe_russia.1.moscow_tt: "[ShowLocationName('moscow')] is held by us or one of our subjects."
 swe_russia.1.a_tt: "The [ShowReligionAdjective('orthodox')] [pops|e] in every [location|e] we own in [ShowRegionName('russian_region')] lose 5% [pop_satisfaction|e]."
 swe_russia.1.a_prosperity_tt: "Every [location|e] in [ShowProvinceDefinitionName('moscow_province')] held by us or one of our subjects loses [prosperity|e]."
 swe_russia.1.b_tt: "The burgher [pops|e] of [ShowLocationName('moscow')] lose 10% [pop_satisfaction|e]."
 swe_russia.1.c_tt: "The [ShowReligionAdjective('orthodox')] [pops|e] in every [location|e] we own in [ShowRegionName('russian_region')] gain 5% [pop_satisfaction|e]."

 swe_russia.2.title: "The Governor in Novgorod"
 swe_russia.2.entry: "$swe_russia.2.title$"
 swe_russia.2.desc: "Our envoys to [swe_tsar.GetName] have got no further than the governor's hall in [ShowLocationName('novgorod')]. [swe_tsar.GetName] does not receive the envoys of a ruler it ranks below its own, and its governor has orders to deal with us in person. The governor will settle the border with us and swear a truce on the cross, which costs nothing but a point of rank and buys a quiet frontier for years. But a crown that accepts a governor in place of a prince will be sent governors from now on. We could answer instead that [ROOT.GetCountry.GetName] treats with princes, not with their servants, and see how [swe_tsar.GetName] takes it."
 swe_russia.2.historical_info: "Novgorod had long been where Sweden and Russia did their business, and Moscow kept it so after it took the city in 1478. Ivan IV would not treat with Gustav I, an elected king, as an equal, and in 1556 Gustav opened talks through the governor, Prince Mikhail Glinsky. In February 1557 Ivan made an exception and received a Swedish embassy in Moscow under Sten Eriksson Leijonhufvud and Archbishop Laurentius Petri; Mikael Agricola, Bishop of Åbo, died on the way home. The forty-year truce was sworn by kissing the cross in Novgorod on 2 April 1557, and Swedish envoys were referred to Novgorod from then on. In September 1569 Johan III's embassy of 57 men under Bishop Paul Juusten reached Novgorod, where the governor would deal with it only himself. After three months the envoys were taken to Moscow and held at Murom for more than a year, and they reached Viborg only on 1 February 1572. Johan demanded to treat with the tsar directly. Ivan answered in 1571 that he should be grateful to deal with the governor, and reminded him that his father came from a village in Småland. The war that broke out in 1570 lasted until the Peace of Teusina in 1595. Sweden had a resident of its own in Moscow from 1631. In 1639 the governor of Novgorod opened a letter addressed to the resident, to see, he said, whether the tsar's title had been written correctly."
 swe_russia.2.a: "Treat with the governor."
 swe_russia.2.a.entry: "We made a truce with the governor in Novgorod."
 swe_russia.2.b: "A crown treats with princes, not their servants."
 swe_russia.2.b.entry: "We would not treat with the governor in Novgorod."

 STATIC_MODIFIER_NAME_swe_dvina_closed: "The Dvina Closed"
 STATIC_MODIFIER_DESC_swe_dvina_closed: "The bar at the mouth of the Dvina is shut to foreign ships, and the cargoes of the Russian lands must go round by our harbours on the Baltic."
 STATIC_MODIFIER_NAME_swe_white_sea_cargo: "Cargo from the White Sea"
 STATIC_MODIFIER_DESC_swe_white_sea_cargo: "The furs, hemp and potash that once sailed from the White Sea now come to this harbour instead."

 swe_russia.3.title: "The Dvina Mouth"
 swe_russia.3.entry: "$swe_russia.3.title$"
 swe_russia.3.desc: "[ShowLocationName('arkhangelsk')] is ours, and with it the mouth of the Dvina, where the western ships load the furs, hemp, potash and hides of the Russian lands every summer. [swe_russian_hinterland.GetName] has no other way to the sea but this one and our harbours on the Gulf of Finland. If we close the bar, the whole of that trade must pass our customs houses on the Baltic, where we already toll it. We could instead take the licent here as we take it on the Baltic, and let the ships keep coming. Or we could leave the convoys alone, since a port that is ours earns more open than shut."
 swe_russia.3.historical_info: "English ships found the way up the Dvina to Moscow in 1553, and Archangel, founded in 1584, became Russia's gate to the West. Sweden wanted that trade to pass through its own ports instead. At Teusina in 1595 it had the foreigners' trade with Russia channelled through Viborg and Reval, and from 1643 to 1660 Philipp Crusius, later ennobled as von Krusenstjerna, urged the Crown in memorandum after memorandum to draw the Russian trade through Reval, Narva and Nyen. The customs of 1648 cut the duty on goods in transit there. Archangel stayed open all the same. In June 1701, early in the Great Northern War, seven ships under Commodore Carl Henrik von Löwe sailed from Göteborg to destroy the port. Their pilots ran two of them aground under a fort the Russians had built that spring, and the squadron was home by late August, having done little."
 swe_russia.3.a: "Close the bar."
 swe_russia.3.a.entry: "We closed the mouth of the Dvina to foreign ships."
 swe_russia.3.a_tt: "[ShowLocationName('narva')], [ShowLocationName('neva')] and [ShowLocationName('tallinn')] gain [ShowModifier('swe_white_sea_cargo')] for 20 years if we own them."
 swe_russia.3.b: "Toll the White Sea."
 swe_russia.3.b.entry: "We tolled the White Sea trade."
 swe_russia.3.c: "Let the convoys come."
 swe_russia.3.c.entry: "We left the White Sea trade alone."
