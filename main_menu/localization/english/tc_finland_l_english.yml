l_english:
 swe_finland.1.title: "Finland at Mora"
 swe_finland.1.entry: "$swe_finland.1.title$"
 swe_finland.1.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] has been chosen at the Stones of Mora by the lawmen and the men of the lands of the realm. Across the sea, [ShowLocationName('abo')] and the country around it pay their taxes and send their men to our wars like any other land, yet they had no voice in the choice. Their bishop and their lawman ask that Finland be counted as a land of the realm, with the right to send its own men to every election. The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] of the council would rather keep the election among the old lands, where their votes count for more."
 swe_finland.1.historical_info: "Finland had been ruled from Sweden since the crusades of the 12th and 13th centuries, with a bishop at Åbo and a lawman of its own. When Håkan Magnusson was elected at Mora in February 1362 to rule beside his father Magnus Eriksson, representatives of Finland took part in a royal election for the first time. From then on Finland had the same right to elect the king as the other lands of the realm, and the election of 1362 is often seen as the moment Finland became a full part of the kingdom rather than a conquered borderland. When the Hereditary Union of Västerås ended the royal elections in 1544, Finland's voice passed to its representatives in the Riksdag, where they sat until Finland was lost to Russia in 1809."
 swe_finland.1.a: "Finland shall have its voice at Mora."
 swe_finland.1.a.entry: "Finland gained a voice in the royal election."
 swe_finland.1.a_tt: "Every [location|e] in [ShowAreaName('finland_area')] gains a bonus from $swe_konungabalken$: less [unrest|e] and faster [integration|e], but less [estate_power|e] for the [ShowEstateTypeName('crown_estate')]."
 swe_finland.1.b: "The election belongs to the old lands."
 swe_finland.1.b.entry: "Finland was kept out of the royal election."

 swe_eriksgata_decision.title: "The Eriksgata"
 swe_eriksgata_decision.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] has been chosen at the Stones of Mora, but by the old law no new monarch is fully accepted until the Eriksgata has been ridden. From [ShowLocationName('uppsala')] the royal train must pass through [ShowLocationName('strangnas')], [ShowLocationName('linkoping')], [ShowLocationName('jonkoping')], [ShowLocationName('skara')], [ShowLocationName('orebro')] and [ShowLocationName('vasteras')]. At the border of each land its men meet the monarch with hostages for a safe journey, and at its thing the monarch swears to keep their law. Until it is done the lawmen grumble, the estates are restless, and some say the realm has a ruler in name only."
 swe_eriksgata_decision.desc.entry: "Our new monarch could ride the Eriksgata through the lands of the realm."
 swe_eriksgata_decision.historical_info: "By the provincial laws and Magnus Eriksson's national law of about 1350, a king elected at the Stones of Mora outside Uppsala had to ride the Eriksgata before he was accepted throughout the realm. The route ran from Uppland through Södermanland, Östergötland, Småland, Västergötland, Närke and Västmanland and back. At each border the men of the land met the king, gave him hostages for his safe conduct and escorted him to their thing, where he swore to keep the peace and their law. The Hereditary Union of Västerås ended the elective crown in 1544, though the custom outlived it: Karl IX still rode the Eriksgata in the early 1600s."
 swe_eriksgata_decision.a: "Ride through the lands of the realm."
 swe_eriksgata_decision.a_tt: "The Eriksgata penalty from $swe_konungabalken$ ends."
