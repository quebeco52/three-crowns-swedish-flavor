l_english:
 STATIC_MODIFIER_NAME_swe_finland_at_mora: "Finland at Mora"
 STATIC_MODIFIER_DESC_swe_finland_at_mora: "Finland's men have a voice at the Stones of Mora like those of any other land of the realm. Its peasants keep more of what the land earns, and the country sits easier under the Crown, though it holds the Crown to its law."
 swe_finland.1.title: "Finland at Mora"
 swe_finland.1.entry: "$swe_finland.1.title$"
 swe_finland.1.desc: "The lawmen and the men of the lands of the realm choose our monarchs at the Stones of Mora. Across the sea, [ShowLocationName('abo')] and the country around it pay their taxes and send their men to our wars like any other land, yet they have no voice in the choice. Their bishop and their lawman ask that Finland be counted as a land of the realm, with the right to send its own men to every election. The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] of the council would rather keep the election among the old lands, where their votes count for more."
 swe_finland.1.historical_info: "Finland had been ruled from Sweden since the crusades of the 12th and 13th centuries, with a bishop at Åbo and a lawman of its own. When Håkan Magnusson was elected at Mora in February 1362 to rule beside his father Magnus Eriksson, representatives of Finland took part in a royal election for the first time. From then on Finland had the same right to elect the king as the other lands of the realm, and the election of 1362 is often seen as the moment Finland became a full part of the kingdom rather than a conquered borderland. When the Hereditary Union of Västerås ended the royal elections in 1544, Finland's voice passed to its representatives in the Riksdag, where they sat until Finland was lost to Russia in 1809."
 swe_finland.1.a: "Finland shall have its voice at Mora."
 swe_finland.1.a.entry: "Finland gained a voice in the royal election."
 swe_finland.1.a_tt: "Every [location|e] we own in [ShowAreaName('finland_area')] gains $STATIC_MODIFIER_NAME_swe_finland_at_mora$ for 50 years."
 swe_finland.1.b: "The election belongs to the old lands."
 swe_finland.1.b.entry: "Finland was kept out of the royal election."
