l_english:
 STATIC_MODIFIER_NAME_swe_katarina_shrine: "The Shrine of St Katarina"
 STATIC_MODIFIER_DESC_swe_katarina_shrine: "Pilgrims come to the abbey church to pray at the shrine of Katarina Ulfsdotter, Birgitta's daughter, and the town is the quieter and the richer for it."

 swe_ostergotland.1.title: "A Shrine at Vadstena"
 swe_ostergotland.1.entry: "$swe_ostergotland.1.title$"
 swe_ostergotland.1.desc: "Rome has at last permitted the bones of Katarina Ulfsdotter, Birgitta's daughter, to be lifted into a shrine at [ShowLocationName('vadstena')], and the abbey has named the day. Her mother's name has made the house the foremost in the realm. Our presence at the feast would honour the abbey and the bishops who pressed her cause for years. But Rome has still not canonised her, and a feast at Vadstena costs money that could stay in our purse."
 swe_ostergotland.1.desc_holy_site: "$swe_ostergotland.1.desc$ Pilgrims already come to her mother's shrine here. A second would bring more."
 swe_ostergotland.1.historical_info: "Katarina Ulfsdotter, born about 1331, followed her mother Birgitta to Rome in 1350, brought her relics home to Vadstena in 1374, and led the community there, in effect its first abbess, until her death on 24 March 1381, three years before the convent was consecrated. The Swedish bishops appealed to Rome for her canonisation in 1474, and a commission gathered more than two hundred testimonies the next year. A bull of the 1480s beatified her and allowed her cult in Scandinavia, and in 1488 Innocent VIII extended it to every Birgittine house and permitted her relics to be shrined, which was done with great solemnity at Vadstena on 1 August 1489. No formal canonisation followed, as the Reformation ended the process, though she was entered as a saint in the Roman Martyrology. Rome keeps her feast on 24 March and Sweden on 2 August."
 swe_ostergotland.1.a: "We attend, and the Crown pays for the feast."
 swe_ostergotland.1.a.entry: "The Crown attended Katarina's shrining at Vadstena."
 swe_ostergotland.1.b: "The abbey can bear its own festivities."
 swe_ostergotland.1.b.entry: "The Crown stayed away from Vadstena."

 swe_ostergotland.2.title: "The Manor at Vadstena"
 swe_ostergotland.2.entry: "$swe_ostergotland.2.title$"
 swe_ostergotland.2.desc: "Rome has approved the rule Birgitta Birgersdotter wrote for a house of nuns and brothers under an abbess, and named [ShowLocationName('vadstena')] as its house. The Crown's manor there was promised to it in a royal will, and masons are already turning it into a cloister on the strength of that promise. The sisters would pray for the realm, and their founder's name already draws gifts. But the manor and its lands are still the Crown's, and a will binds those who made it more than those who come after them."
 swe_ostergotland.2.desc_order: "Rome has approved the rule Birgitta Birgersdotter wrote for a house of nuns and brothers under an abbess, and named [ShowLocationName('vadstena')] as its house. The Crown's manor there was promised to it in a royal will, but another order already holds a house on the estate and would have to leave it. The sisters would pray for the realm, and their founder's name already draws gifts. But the manor and its lands are still the Crown's, and a will binds those who made it more than those who come after them."
 swe_ostergotland.2.historical_info: "In their will of 1346 King Magnus Eriksson and Queen Blanka promised their manor at Vadstena to the monastery that Birgitta Birgersdotter, once the queen's lady-in-waiting, meant to found, and Magnus asked to be buried there. Birgitta lived in Rome from about 1350 until her death in 1373, and through the revolts against the royal couple the manor was still kept for the monastery. Rebuilding began at the end of the 1360s, and on 5 August 1370 Pope Urban V approved her rule at Montefiascone, noting that a monastery had already been begun at the manor. Urban VI confirmed it at the end of the 1370s. Her daughter Katarina brought her mother's relics home in 1374 and led the house until 1381. The bishop of Linköping consecrated it in 1384: a double house of sixty nuns, thirteen priests, four deacons and eight lay brothers, all under an abbess chosen by the sisters and brothers together. Birgitta's granddaughter Ingegerd Knutsdotter was consecrated its abbess in 1388, and the first Italian house followed in 1394. Birgitta was the first Swede to found a religious order. In 1399 a royal bailiff claimed the manor back as old crown land, and the council's court judged it to the abbey."
 swe_ostergotland.2.a: "Let the will stand."
 swe_ostergotland.2.a.entry: "The Crown gave its manor at Vadstena to Birgitta's order."
 swe_ostergotland.2.a_order_tt: "The [religious_order|e] now holding [ShowLocationName('vadstena')] gives it up and loses 5 [zeal|e]."
 swe_ostergotland.2.a_tt: "Birgitta's order is founded as a [religious_order|e] of contemplatives with [ShowLocationName('vadstena')] as its first [holding|e], at 50 [zeal|e], under its first abbess."
 swe_ostergotland.2.b: "The manor stays with the Crown."
 swe_ostergotland.2.b.entry: "The Crown kept its manor at Vadstena."

 STATIC_MODIFIER_NAME_swe_krigsmanshus: "The Soldiers' House at Vadstena"
 STATIC_MODIFIER_DESC_swe_krigsmanshus: "Crippled officers and soldiers live out their days with their families in the house at Vadstena, and the regiments know the Crown has not forgotten them."

 swe_ostergotland.3.title: "The Soldiers' House"
 swe_ostergotland.3.entry: "$swe_ostergotland.3.title$"
 swe_ostergotland.3.desc: "The convent at [ShowLocationName('vadstena')] has stood empty since the last sisters left, and its ranges want new brick. $swe_ostergotland.3.desc_body$"
 swe_ostergotland.3.desc_manor: "The Crown's old manor at [ShowLocationName('vadstena')], which we once kept back from Birgitta's order, has little use now, and its ranges want new brick. $swe_ostergotland.3.desc_body$"
 swe_ostergotland.3.desc_body: "Our wars send home men too maimed to serve or to work a farm. Housed there with their families and a chaplain of their own, they would show every regiment that the Crown keeps those it has crippled. But the ranges would hold a few dozen families at most, and most such men would rather stay in their home parishes, among their kin, on a yearly allowance of grain. Either way, the Crown pays."
 swe_ostergotland.3.historical_info: "Gustav II Adolf ordered a house for crippled soldiers in the empty convent at Vadstena in 1622 and gave 2,000 daler towards it, but his wars held it back. The regency proclaimed its founding on 3 August 1637, and the first men moved into the nuns' ranges in the winter of 1640–41. In 1644 it housed 11 officers and 15 soldiers with their wives and 27 children. Kristina endowed it with farms in 1646, and from 1661 one per cent of salaries went to it. It was the only such house in Sweden: a Finnish one was proposed for decades and never built. Most crippled men preferred to stay in their parishes on grain from its fund, and since money could help more men than the house could hold, it was decided in 1778 to close it as its residents died, and it was abolished in 1783."
 swe_ostergotland.3.a: "House them at Vadstena."
 swe_ostergotland.3.a.entry: "The Crown opened a house for crippled soldiers at Vadstena."
 swe_ostergotland.3.b: "Let them draw grain at home."
 swe_ostergotland.3.b.entry: "The Crown gave its crippled soldiers grain in their home parishes."
