l_english:
 STATIC_MODIFIER_NAME_swe_olofsborg_line: "Holding the Line at Olofsborg"
 STATIC_MODIFIER_DESC_swe_olofsborg_line: "The Crown has paid to strengthen the garrison here, and among these lakes and waterways no army from the east will find the going easy. The border posts stay where we put them, whatever the old treaty says."
 STATIC_MODIFIER_NAME_swe_olofsborg_quiet_border: "A Quiet Border"
 STATIC_MODIFIER_DESC_swe_olofsborg_quiet_border: "The quarrel over the border posts has been left to sleep, and traders cross the lakes with little trouble."
 STATIC_MODIFIER_NAME_swe_viborg_lady: "The Lady of Viborg's Terms"
 STATIC_MODIFIER_DESC_swe_viborg_lady: "The family has kept its hold on the castle on terms of its own, and the Crown's officers come here as guests."
 STATIC_MODIFIER_NAME_swe_viborg_gates_forced: "The Gates Forced"
 STATIC_MODIFIER_DESC_swe_viborg_gates_forced: "The castle was opened by force in the Crown's name. Its new master is obeyed, but the people here have not forgotten how he came."
 STATIC_MODIFIER_NAME_swe_viborg_royal_governor: "A Royal Governor at Viborg"
 STATIC_MODIFIER_DESC_swe_viborg_royal_governor: "The old privileges are gone. The castle's revenues now come to the Crown, and its governor answers to us."
 STATIC_MODIFIER_NAME_swe_viborg_margraves: "The Margraves of Viborg"
 STATIC_MODIFIER_DESC_swe_viborg_margraves: "The lords of Viborg keep the Crown's revenues in their own name and spend them on the border's defence. They are all but kings in the east."
 STATIC_MODIFIER_NAME_swe_crown_wilderness: "The Crown's Wilderness"
 STATIC_MODIFIER_DESC_swe_crown_wilderness: "This wilderness now belongs to the Crown, and anyone who clears a farm here goes free of tax for some years. Settlers are arriving with their axes and fire."
 STATIC_MODIFIER_NAME_swe_kajana_border_trade: "The Karelian Traders"
 STATIC_MODIFIER_DESC_swe_kajana_border_trade: "The merchants from across the border got their cloth back, and they still bring their goods to market here."
 STATIC_MODIFIER_NAME_swe_viborg_see: "The See of Viborg"
 STATIC_MODIFIER_DESC_swe_viborg_see: "The east has a bishop of its own at Viborg, and his priests are carrying the reformed church out to the border parishes."
 STATIC_MODIFIER_NAME_swe_abo_one_see: "One Bishop for Finland"
 STATIC_MODIFIER_DESC_swe_abo_one_see: "The Bishop of Åbo still answers for every parish in Finland, and his chapter carries the weight that goes with it."
 STATIC_MODIFIER_NAME_swe_gymnasium_wiburgense: "Gymnasium Wiburgense"
 STATIC_MODIFIER_DESC_swe_gymnasium_wiburgense: "Viborg's gymnasium has lecturers in theology, Latin, Greek and mathematics, and its pupils no longer need to go west for their learning."

 swe_finland_east.1.title: "Olofsborg on the Wrong Side"
 swe_finland_east.1.entry: "$swe_finland_east.1.title$"
 swe_finland_east.1.desc: "[ShowLocationName('olofsborg')] stands among the lakes of Savolax, but by the old treaty it lies on the far side of the border. Men from the east have come to move the boundary posts back where they say they belong, and they claim the castle as their own. Our commander wants money to strengthen the garrison and hold the ground. Or the matter could be left to rest: trade across the lakes is worth more than a quarrel over posts in the forest."
 swe_finland_east.1.historical_info: "Erik Axelsson Tott, lord of Viborg, founded Olofsborg in 1475, hoping to profit from the turmoil after Ivan III conquered Novgorod. It was sited to claim the Russian side of the border set by the Treaty of Nöteborg, among lakes and waterways that would hinder any offensive. The keep was finished in 1485 and the outer walls in 1495. In 1499 about 1,000 Russians, who held that the castle was Russian, tried to move the border posts to include it, and Erik Bielke's forces drove them back. A 20-year truce followed on 14 September 1504. The castle was never taken by force, though its garrison surrendered on terms in 1714 and 1743, and the Treaty of Åbo then ceded it to Russia."
 swe_finland_east.1.a: "Hold the line."
 swe_finland_east.1.a.entry: "The Crown strengthened Olofsborg and held the border."
 swe_finland_east.1.b: "Keep the border quiet."
 swe_finland_east.1.b.entry: "The quarrel over the border posts at Olofsborg was left to rest."

 swe_finland_east.2.title: "The Widow Keeps the Keys"
 swe_finland_east.2.entry: "$swe_finland_east.2.title$"
 swe_finland_east.2.desc: "The lord of [ShowLocationName('vyborg')] is dead, and his widow has taken up the running of the castle herself: its accounts, its garrison and its dealings across the border. The council has named a new lord and offered her another fief in exchange. She finds the fief poor. She has told them that nobody will enter the town or castle without her consent, and that she will not leave until she gets what she wants. The eastern border is no place for a quarrel, but a castle of the realm cannot be held against the realm's own council."
 swe_finland_east.2.historical_info: "Gunilla Johansdotter (Bese) married the knight Erik Turesson (Bielke) in 1490, and he became lord of Viborg and Olofsborg in 1499. When he died in 1511 she ran Viborg alone, handling its finances and its diplomacy along the eastern border. The privy council expected her to hand the castle to a new lord, Nils Bosson (Grip), in exchange for another fief. Dissatisfied with the offer, she refused to let him in, and allied herself with the regent Sten Sture the Younger. The council was wary of open conflict with someone who held two castles on an unstable border. After negotiations she was guaranteed a better fief, and her son-in-law Tönne Eriksson (Tott) became lord of Viborg, with her daughter Karin as lady of the castle. Gunilla moved to Stora Benhamra in Uppland, where she lived until about 1553."
 swe_finland_east.2.a: "Give her better terms."
 swe_finland_east.2.a.entry: "The widow of Viborg was given better terms."
 swe_finland_east.2.a_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('vyborg_province')] gains [ShowModifier('swe_viborg_lady')] for 15 years."
 swe_finland_east.2.b: "Send men to open the gates."
 swe_finland_east.2.b.entry: "The gates of Viborg were forced in the Crown's name."
 swe_finland_east.2.b_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('vyborg_province')] gains [ShowModifier('swe_viborg_gates_forced')] for 10 years."

 swe_finland_east.3.title: "The Margrave's Fief"
 swe_finland_east.3.entry: "$swe_finland_east.3.title$"
 swe_finland_east.3.desc: "For two centuries the lords of [ShowLocationName('vyborg')] have kept the Crown's revenues in their own name and paid for the defence of the border themselves. They have been all but kings in the east. The present holder has fallen out with the Crown over money and left the realm, and his men still hold the castle. Our councillors see a chance to install a royal governor, paid by us and answerable to us. The old arrangement has guarded the border cheaply and well, and every noble with a fief will be watching what we do next."
 swe_finland_east.3.historical_info: "From about 1320 the holders of Viborg had privileges that made it almost an independent fief, described as the start of a veritable margraviate. They collected the Crown's revenues in their own name, paid mercenaries and kept the fortress in repair, and nearly all of them came from related families. In 1525 the German count Johan of Hoya married Margareta, the sister of Gustav Vasa, and was granted Viborg and Nyslott. The two fell out, possibly over a sum agreed with Lübeck in 1529 that Gustav would not approve, and in June 1534 Hoya fled to Germany. Nils Grabbe took the castle by force on the king's behalf and became royal governor, without the old privileges. Hoya joined the Count's Feud and fell at Öxnebjerg on Fyn on 11 June 1535."
 swe_finland_east.3.a: "Take the castle."
 swe_finland_east.3.a.entry: "A royal governor replaced the margraves of Viborg."
 swe_finland_east.3.a_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('vyborg_province')] gains [ShowModifier('swe_viborg_royal_governor')] for 50 years."
 swe_finland_east.3.b: "Leave the fief as it is."
 swe_finland_east.3.b.entry: "The fief of Viborg kept its old privileges."
 swe_finland_east.3.b_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('vyborg_province')] gains [ShowModifier('swe_viborg_margraves')] for 50 years."

 swe_finland_east.4.title: "The Crown's Wilderness"
 swe_finland_east.4.entry: "$swe_finland_east.4.title$"
 swe_finland_east.4.desc: "Beyond the last farms of [ShowLocationName('tavastehus')] the forest runs on for days, and the families who hunt and fish there say it has always been theirs. Courts have argued over where one district's wilderness ends and the next begins, and nobody pays the Crown a penny for any of it. There is a simple answer: declare land where nobody lives the Crown's, and let anyone who clears a farm on it go free of tax for some years before paying us. It will cost us money at first. The old hunting families will call it theft."
 swe_finland_east.4.historical_info: "The wilderness of inland Finland served as hunting grounds and fishing waters for families who claimed it by custom. The Åbo land court ruled on the boundary between Tavastland and Savolax in 1415, with further judgments in 1446 and 1452. In 1542 Gustav Vasa declared uninhabited wilderness the property of God, the King and the Crown, though peasants kept a right to use it, and he offered tax freedom to those who cleared new farms. Settlers from Savolax moved north to Ule träsk and into Kajanaland from the 1530s or 1550s, on land that the Treaty of Nöteborg of 1323 had given to Russia. Russian raids tried to wipe out their villages, until the Treaty of Teusina made Kajanaland Swedish in 1595."
 swe_finland_east.4.a: "Claim it for the Crown."
 swe_finland_east.4.a.entry: "The Crown claimed the wilderness of inland Finland."
 swe_finland_east.4.a_tt: "Every [location|e] in [ShowProvinceDefinitionName('savolax_province')] and [ShowProvinceDefinitionName('kajanaland_province')], and [ShowLocationName('jyvaskyla')], [ShowLocationName('laukas')], [ShowLocationName('saarijarvi')] and [ShowLocationName('viitasaari')] in the north of [ShowProvinceDefinitionName('tavastland_province')], gains [ShowModifier('swe_crown_wilderness')] for 25 years unless a foreign country holds it."
 swe_finland_east.4.a_peasants_tt: "The peasant [pops|e] in each of these [locations|e] that we own lose 10% [pop_satisfaction|e]."
 swe_finland_east.4.b: "Leave the old rights alone."
 swe_finland_east.4.b.entry: "The old wilderness rights were left alone."
 swe_finland_east.4.b_tt: "The peasant [pops|e] in every [location|e] we own in [ShowProvinceDefinitionName('savolax_province')] and [ShowProvinceDefinitionName('kajanaland_province')], and in [ShowLocationName('jyvaskyla')], [ShowLocationName('laukas')], [ShowLocationName('saarijarvi')] and [ShowLocationName('viitasaari')] if we own them, gain 5% [pop_satisfaction|e]."

 swe_scondia_illustrata: "Scondia Illustrata"
 swe_scondia_illustrata_desc: "Johannes Messenius's history of Sweden, from the Flood to his own day, written in his cell at Kajaneborg."
 swe_finland_east.5.title: "The Professor's Sentence"
 swe_finland_east.5.entry: "$swe_finland_east.5.title$"
 swe_finland_east.5.desc: "A professor of Uppsala stands convicted of plotting with the Jesuits and our enemies abroad, and the court has sentenced him to death. He is also the finest historian in the realm. The half-built castle at [ShowLocationName('kajana')] is about as far from anywhere as the realm goes, and the clergy would be glad to see him there. A pardon would give him back to his books, and to his friends among the Jesuits, if he has any."
 swe_finland_east.5.historical_info: "Johannes Messenius, a miller's son educated at the Jesuit school in Braunsberg, became a historian, dramatist and professor at Uppsala. In 1616 he was accused of conspiring with King Sigismund and the Jesuits, and was found guilty when he could not find twelve men to swear to his innocence. He was sentenced to death in July, but the king changed this to prison, probably for life. In October he was sent to Kajaneborg, a castle begun in 1604 and never finished, where its commander Erik Hara treated him harshly. There he wrote Scondia Illustrata, a history of Sweden from the Flood to his own day. He was moved to Uleåborg in 1635 and died there in 1636. His widow left the kingdom with the manuscripts, and the work was not published until 1700-05."
 swe_finland_east.5.a: "Lock him away in Kajaneborg."
 swe_finland_east.5.a.entry: "The historian was imprisoned at Kajaneborg."
 swe_finland_east.5.b: "Pardon him."
 swe_finland_east.5.b.entry: "The historian was pardoned and went back to his books."

 swe_finland_east.6.title: "The Hidden Cloth"
 swe_finland_east.6.entry: "$swe_finland_east.6.title$"
 swe_finland_east.6.desc: "Our customs men have seized a great store of cloth hidden on an island near [ShowLocationName('kajana')]. It belongs to Karelian merchants from across the border, who left it with a local farmer. A merchant from the coast, who failed to buy it from them, told our men where to look, and now he offers a good price for the lot. By law it can be confiscated. The Karelians say they will take justice for themselves, and one local man has been told he will be burned alive if he talks. These are not idle threats."
 swe_finland_east.6.historical_info: "The merchants came from White Karelia, and the man who informed on them was Jaakko Estlander of Uleåborg. Customs men seized the cloth in August 1711, and in February 1712 a court confiscated all 3,000 ells, about 1,782 m, which Estlander then bought for 1,125 dalers in copper money. On 13 March 1712 a force of Russians and Karelians, more than a hundred men and perhaps nearly 340, reached Kajana while the town slept and burned its southern part. Another group plundered the parsonage and church at Paldamo. They left with livestock, captives and over a thousand silver dalers of tax money. In 1718 Finnish partisans raided White Karelia in return."
 swe_finland_east.6.a: "Confiscate the cloth."
 swe_finland_east.6.a.entry: "The Karelian cloth was confiscated, and raiders burned Kajana for it."
 swe_finland_east.6.b: "Give it back."
 swe_finland_east.6.b.entry: "The Karelian merchants got their cloth back."

 swe_finland_east.7.title: "The Eastern Parishes"
 swe_finland_east.7.entry: "$swe_finland_east.7.title$"
 swe_finland_east.7.desc: "The Bishop of [ShowLocationName('abo')] answers for every parish in Finland, from the Bothnian coast to the eastern border, and the new teaching travels slowly over that distance. Our councillors propose a second see at [ShowLocationName('vyborg')], with a bishop and chapter of its own, to carry the reformed church out to the border parishes. A chapter has to be paid for, and [ShowLocationNameWithNoTooltip('abo')] has served the whole of Finland for as long as it has had a bishop."
 swe_finland_east.7.historical_info: "Until 1554 the diocese of Åbo covered the whole of Finland. That year Gustav Vasa divided it, and Paulus Juusten, consecrated by Botvid Sunesson of Strängnäs, became the first Bishop of Viborg, over 33 parishes in the east. The see was founded so that the Reformation would take root in eastern Finland as well. The division did not hold at first: Juusten moved to Åbo in 1563, and Finland had a single bishop again in 1564-68 and from 1578. Viborg had its own bishop again from 1618, after the Treaty of Stolbovo brought Kexholm into the realm. The chapter was dissolved when Russia took Viborg in 1710, and in 1723 the see moved to Borgå."
 swe_finland_east.7.a: "Found a see at [ShowLocationNameWithNoTooltip('vyborg')]."
 swe_finland_east.7.a.entry: "A second Finnish see was founded at Viborg."
 swe_finland_east.7.a_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('vyborg_province')] gains [ShowModifier('swe_viborg_see')] for 20 years."
 swe_finland_east.7.b: "Keep one bishop for Finland."
 swe_finland_east.7.b.entry: "Finland kept a single bishop at Åbo."

 swe_finland_east.8.title: "The Town School"
 swe_finland_east.8.entry: "$swe_finland_east.8.title$"
 swe_finland_east.8.desc: "At [ShowLocationName('vyborg')] the town school teaches boys to read and write and gives them the first rules of Latin. Anyone who wants more must go west to [ShowLocationName('abo')]. Our councillors propose a gymnasium here, with lecturers in theology, Latin, Greek and mathematics, so that the eastern parishes can train their priests at home. The lecturers would be paid by us. The burghers, who keep a German school of their own, already complain about the town school, and would complain more of one paid for by us."
 swe_finland_east.8.historical_info: "Finland's first gymnasium opened at Åbo in 1630, and its second at Viborg, the eastern diocesan town, in 1641. Per Brahe, as Governor-General of Finland, had pressed for it, and it was inaugurated on 10 August 1641 to the guns of the castle. Viborg then had about 3,500 inhabitants, the fifth town of Sweden and Finland, after Stockholm, Göteborg, Norrköping and Åbo. Its lecturers taught theology, Latin, Greek, eloquence and mathematics, and Queen Kristina confirmed its privileges and its own jurisdiction in 1650. The town's German burghers, who kept a private German school, often complained to the governor about the town's school, and in 1670 the lecturer Bartholdus Lacmannus nearly killed the German schoolmaster with a knife. The gymnasium stayed until the Russian conquest of 1710, and in 1723 Fredrik I moved it, with the see, to Borgå."
 swe_finland_east.8.a: "Found the gymnasium."
 swe_finland_east.8.a.entry: "A gymnasium was founded at Viborg."
 swe_finland_east.8.a_tt: "The burgher [pops|e] of [ShowLocationName('vyborg')] lose 5% [pop_satisfaction|e]."
 swe_finland_east.8.b: "The town school will do."
 swe_finland_east.8.b.entry: "Viborg made do with its town school."
 swe_finland_east.8.b_tt: "The burgher [pops|e] of [ShowLocationName('vyborg')] gain 5% [pop_satisfaction|e]."
