l_english:
 STATIC_MODIFIER_NAME_swe_olofsborg_line: "Holding the Line at Olofsborg"
 STATIC_MODIFIER_DESC_swe_olofsborg_line: "The Crown has paid to strengthen the garrison here, and among these lakes and waterways no army from the east will find the going easy. The border posts stay where we put them, whatever the old treaty says."
 STATIC_MODIFIER_NAME_swe_olofsborg_quiet_border: "A Quiet Border"
 STATIC_MODIFIER_DESC_swe_olofsborg_quiet_border: "The quarrel over the border posts has been left to sleep, and traders cross the lakes with little trouble."
 STATIC_MODIFIER_NAME_swe_viborg_lady: "The Lady of Viborg's Terms"
 STATIC_MODIFIER_DESC_swe_viborg_lady: "The family has kept its hold on the castle on terms of its own, and the Crown's officers come here as guests."
 STATIC_MODIFIER_NAME_swe_viborg_gates_forced: "The Gates Forced"
 STATIC_MODIFIER_DESC_swe_viborg_gates_forced: "The castle was opened by force in the Crown's name. Its new master is obeyed, but the people here have not forgotten how he came."
 STATIC_MODIFIER_NAME_swe_viborg_royal_governor: "A Royal Governor at Viborg"
 STATIC_MODIFIER_DESC_swe_viborg_royal_governor: "The old privileges are gone. The castle's revenues now come to the Crown, and its governor answers to us."
 STATIC_MODIFIER_NAME_swe_viborg_margraves: "The Margraves of Viborg"
 STATIC_MODIFIER_DESC_swe_viborg_margraves: "The lords of Viborg keep the Crown's revenues in their own name and spend them on the border's defence. They are all but kings in the east."
 STATIC_MODIFIER_NAME_swe_crown_wilderness: "The Crown's Wilderness"
 STATIC_MODIFIER_DESC_swe_crown_wilderness: "This wilderness now belongs to the Crown, and anyone who clears a farm here goes free of tax for some years. Settlers are arriving with their axes and fire."
 STATIC_MODIFIER_NAME_swe_kajana_border_trade: "The Karelian Traders"
 STATIC_MODIFIER_DESC_swe_kajana_border_trade: "The merchants from across the border got their cloth back, and they still bring their goods to market here."

 swe_finland_east.1.title: "Olofsborg on the Wrong Side"
 swe_finland_east.1.entry: "$swe_finland_east.1.title$"
 swe_finland_east.1.desc: "[ShowLocationName('olofsborg')] stands among the lakes of Savolax, but by the old treaty it lies on the far side of the border. Men from the east have come to move the boundary posts back where they say they belong, and they claim the castle as their own. Our commander wants money to strengthen the garrison and hold the ground. Or the matter could be left to rest: trade across the lakes is worth more than a quarrel over posts in the forest."
 swe_finland_east.1.historical_info: "Erik Axelsson Tott, lord of Viborg, founded Sankt Olofsborg in 1475, hoping to profit from the turmoil after Ivan III conquered Novgorod. It was sited to claim the Russian side of the border set by the Treaty of Nöteborg, among lakes and waterways that would hinder any offensive. The keep was finished in 1485 and the outer walls in 1495. In 1499 about 1,000 Russians, who held that the castle was Russian, tried to move the border posts to include it, and Erik Bielke's forces drove them back. A 20-year truce followed on 14 September 1504. The castle was never taken by force, though its garrison surrendered on terms in 1714 and 1743, and the Treaty of Åbo then ceded it to Russia."
 swe_finland_east.1.a: "Hold the line."
 swe_finland_east.1.a.entry: "The Crown strengthened Olofsborg and held the border."
 swe_finland_east.1.b: "Keep the border quiet."
 swe_finland_east.1.b.entry: "The quarrel over the border posts at Olofsborg was left to rest."

 swe_finland_east.2.title: "The Widow Keeps the Keys"
 swe_finland_east.2.entry: "$swe_finland_east.2.title$"
 swe_finland_east.2.desc: "The lord of [ShowLocationName('vyborg')] is dead, and his widow has taken up the running of the castle herself: its accounts, its garrison and its dealings across the border. The council has named a new lord and offered her another fief in exchange. She finds the fief poor. She has told them that nobody will enter the town or castle without her consent, and that she will not leave until she gets what she wants. The eastern border is no place for a quarrel, but a castle of the realm cannot be held against the realm's own council."
 swe_finland_east.2.historical_info: "Gunilla Johansdotter (Bese) married the knight Erik Turesson (Bielke) in 1490, and he became lord of Viborg and Sankt Olofsborg in 1499. When he died in 1511 she ran Viborg alone, handling its finances and its diplomacy along the eastern border. The privy council expected her to hand the castle to a new lord, Nils Bosson (Grip), in exchange for another fief. Dissatisfied with the offer, she refused to let him in, and allied herself with the regent Sten Sture the Younger. The council was wary of open conflict with someone who held two castles on an unstable border. After negotiations she was guaranteed a better fief, and her son-in-law Tönne Eriksson (Tott) became lord of Viborg, with her daughter Karin as lady of the castle. Gunilla moved to Stora Benhamra in Uppland, where she lived until about 1553."
 swe_finland_east.2.a: "Give her better terms."
 swe_finland_east.2.a.entry: "The widow of Viborg was given better terms."
 swe_finland_east.2.a_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('vyborg_province')] gains [ShowModifier('swe_viborg_lady')] for 15 years."
 swe_finland_east.2.b: "Send men to open the gates."
 swe_finland_east.2.b.entry: "The gates of Viborg were forced in the Crown's name."
 swe_finland_east.2.b_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('vyborg_province')] gains [ShowModifier('swe_viborg_gates_forced')] for 10 years."

 swe_finland_east.3.title: "The Margrave's Fief"
 swe_finland_east.3.entry: "$swe_finland_east.3.title$"
 swe_finland_east.3.desc: "For two centuries the lords of [ShowLocationName('vyborg')] have kept the Crown's revenues in their own name and paid for the defence of the border themselves. They have been all but kings in the east. The present holder has fallen out with the Crown over money and left the realm, and his men still hold the castle. Our councillors see a chance to install a royal governor, paid by us and answerable to us. The old arrangement has guarded the border cheaply and well, and every noble with a fief will be watching what we do next."
 swe_finland_east.3.historical_info: "From about 1320 the holders of Viborg had privileges that made it almost an independent fief, described as the start of a veritable margraviate. They collected the Crown's revenues in their own name, paid mercenaries and kept the fortress in repair, and nearly all of them came from related families. In 1525 the German count Johan of Hoya married Margareta, the sister of Gustav Vasa, and was granted Viborg and Nyslott. The two fell out, possibly over a sum agreed with Lübeck in 1529 that Gustav would not approve, and in June 1534 Hoya fled to Germany. Nils Grabbe took the castle by force on the king's behalf and became royal governor, without the old privileges. Hoya joined the Count's Feud and fell at Öxnebjerg on Fyn on 11 June 1535."
 swe_finland_east.3.a: "Take the castle."
 swe_finland_east.3.a.entry: "A royal governor replaced the margraves of Viborg."
 swe_finland_east.3.a_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('vyborg_province')] gains [ShowModifier('swe_viborg_royal_governor')] for 50 years."
 swe_finland_east.3.b: "Leave the fief as it is."
 swe_finland_east.3.b.entry: "The fief of Viborg kept its old privileges."
 swe_finland_east.3.b_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('vyborg_province')] gains [ShowModifier('swe_viborg_margraves')] for 50 years."

 swe_finland_east.4.title: "The Crown's Wilderness"
 swe_finland_east.4.entry: "$swe_finland_east.4.title$"
 swe_finland_east.4.desc: "Beyond the last farms of [ShowLocationName('tavastehus')] the forest runs on for days, and the families who hunt and fish there say it has always been theirs. Courts have argued over where one district's wilderness ends and the next begins, and nobody pays the Crown a penny for any of it. There is a simple answer: declare land where nobody lives the Crown's, and let anyone who clears a farm on it go free of tax for some years before paying us. It will cost us money at first. The old hunting families will call it theft."
 swe_finland_east.4.historical_info: "The wilderness of inland Finland served as hunting grounds and fishing waters for families who claimed it by custom. The Åbo land court ruled on the boundary between Häme and Savo in 1415, with further judgments in 1446 and 1452. In 1542 Gustav Vasa declared uninhabited wilderness the property of God, the King and the Crown, though peasants kept a right to use it, and he offered tax freedom to those who cleared new farms. Savo settlers moved north to Ule träsk and into Kainuu from the 1530s or 1550s, on land that the Treaty of Nöteborg of 1323 had given to Russia. Russian raids tried to wipe out their villages, until the Treaty of Teusina made Kainuu Swedish in 1595."
 swe_finland_east.4.a: "Claim it for the Crown."
 swe_finland_east.4.a.entry: "The Crown claimed the wilderness of inland Finland."
 swe_finland_east.4.a_tt: "Every [location|e] in [ShowProvinceDefinitionName('savolax_province')] and [ShowProvinceDefinitionName('kajanaland_province')], and [ShowLocationName('jyvaskyla')], [ShowLocationName('laukas')], [ShowLocationName('saarijarvi')] and [ShowLocationName('viitasaari')] in the north of [ShowProvinceDefinitionName('tavastland_province')], gains [ShowModifier('swe_crown_wilderness')] for 25 years unless a foreign country holds it."
 swe_finland_east.4.b: "Leave the old rights alone."
 swe_finland_east.4.b.entry: "The old wilderness rights were left alone."

 swe_scondia_illustrata: "Scondia Illustrata"
 swe_scondia_illustrata_desc: "Johannes Messenius wrote this history of Sweden, from the Flood to his own day, as a prisoner at Kajaneborg. His widow left the kingdom with the manuscripts, and the work was not published until 1700-05."
 swe_finland_east.5.title: "The Professor's Sentence"
 swe_finland_east.5.entry: "$swe_finland_east.5.title$"
 swe_finland_east.5.desc: "A professor of Uppsala stands convicted of plotting with the Jesuits and our enemies abroad, and the court has sentenced him to death. He is also the finest historian in the realm. The half-built castle at [ShowLocationName('kajana')] is about as far from anywhere as the realm goes, and the clergy would be glad to see him there. A pardon would give him back to his books, and to his friends among the Jesuits, if he has any."
 swe_finland_east.5.historical_info: "Johannes Messenius, a miller's son educated at the Jesuit school in Braunsberg, became a historian, dramatist and professor at Uppsala. In 1616 he was accused of conspiring with King Sigismund and the Jesuits, and was found guilty when he could not find twelve men to swear to his innocence. He was sentenced to death in July, but the king changed this to prison, probably for life. In October he was sent to Kajaneborg, a castle begun in 1604 and never finished, where its commander Erik Hara treated him harshly. There he wrote Scondia Illustrata, a history of Sweden from the Flood to his own day. He was moved to Oulu in 1635 and died there in 1636. His widow left the kingdom with the manuscripts, and the work was not published until 1700-05."
 swe_finland_east.5.a: "Lock him away in Kajaneborg."
 swe_finland_east.5.a.entry: "The historian was imprisoned at Kajaneborg."
 swe_finland_east.5.b: "Pardon him."
 swe_finland_east.5.b.entry: "The historian was pardoned and went back to his books."

 swe_finland_east.6.title: "The Hidden Cloth"
 swe_finland_east.6.entry: "$swe_finland_east.6.title$"
 swe_finland_east.6.desc: "Our customs men have seized a great store of cloth hidden on an island near [ShowLocationName('kajana')]. It belongs to Karelian merchants from across the border, who left it with a local farmer. A merchant from the coast, who failed to buy it from them, told our men where to look, and now he offers a good price for the lot. The court says it can be confiscated. The Karelians say they will take justice for themselves, and one local man has been told he will be burned alive if he talks. Border folk warn that these are not idle threats."
 swe_finland_east.6.historical_info: "The merchants came from White Karelia, and the man who informed on them was Jaakko Estlander of Oulu. Customs men seized the cloth in August 1711, and in February 1712 a court confiscated all 3,000 ells, about 1,782 m, which Estlander then bought for 1,125 dalers in copper money. On 13 March 1712 a force of Russians and Karelians, more than a hundred men and perhaps nearly 340, reached Kajana while the town slept and burned its southern part. Another group plundered the parsonage and church at Paldamo. They left with livestock, captives and over a thousand silver dalers of tax money. In 1718 Finnish partisans raided White Karelia in return."
 swe_finland_east.6.a: "Confiscate the cloth."
 swe_finland_east.6.a.entry: "The Karelian cloth was confiscated, and raiders burned Kajana for it."
 swe_finland_east.6.b: "Give it back."
 swe_finland_east.6.b.entry: "The Karelian merchants got their cloth back."
