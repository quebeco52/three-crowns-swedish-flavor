l_english:
 swe_nor_own_king_granted: "Gave Us a King of Our Own"
 swe_nor_own_king_refused: "Refused Us a King of Our Own"

 swe_union.1.title: "A King for Norway"
 swe_union.1.entry: "$swe_union.1.title$"
 swe_union.1.desc: "Envoys from the council of [swe_norway.GetName] have come to court. They say that their realm is ruled by a king who lives in [ROOT.GetCountry.GetName] and spends its revenues on [ROOT.GetCountry.GetName]'s wars. They ask that [swe_nor_prince.GetName], a son of [ROOT.GetCountry.GetGovernment.GetRuler.GetName], be made king of [swe_norway.GetName] in his own right. If we agree, the two crowns will go their separate ways, though the new king will be of our own blood. If we refuse, the Norwegian lords will remember it."
 swe_union.1.historical_info: "Magnus Eriksson inherited the crown of Norway and was elected king of Sweden in 1319, at the age of three. Once he came of age, the Norwegian nobility rose against him twice in the 1330s, the second time over a foreign policy that they saw as serving Sweden. At Varberg in August 1343, Magnus and the Norwegian council agreed that his younger son Haakon, then about three years old, would become king of Norway, while his elder son Erik would succeed him in Sweden. Erik was chosen as his successor at the Stones of Mora in 1344. Magnus governed Norway for Haakon until 1355, when the young king took over."
 swe_union.1.a: "Norway shall have its own king."
 swe_union.1.a.entry: "Norway was given a king of its own."
 swe_union.1.a_tt: "[swe_norway.GetName] leaves the [union|e]. Since we grant the crown willingly, no one gains a [casus_belli|e] against us."
 swe_union.1.b: "One king for both realms."
 swe_union.1.b.entry: "Norway was refused a king of its own."
