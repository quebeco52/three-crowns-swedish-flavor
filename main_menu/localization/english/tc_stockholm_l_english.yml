l_english:
 swe_tre_kronor: "Tre Kronor"
 swe_tre_kronor_maintenance: "$swe_tre_kronor$"
 swe_tre_kronor_desc: "The royal castle of Stockholm guards the outlet of Lake Mälaren. It grew from a stone tower built in the 13th century and takes its name from the three crowns on the spire of its great tower. It is a fortress, the king's residence and the seat of government all at once, and the Crown keeps its archives and its library inside its walls."
 swe_stockholm_palace: "Stockholms slott"
 swe_stockholm_palace_desc: "Nicodemus Tessin the Younger's palace stands on the site of Tre Kronor, a great square block in the Roman manner around an open courtyard. It houses the royal family, the court and the offices of state, and shows Europe that the Swedish Crown can build as grandly as any."
 swe_riddarholmskyrkan: "Riddarholmskyrkan"
 swe_riddarholmskyrkan_desc: "The old church of the Greyfriars on Riddarholmen in Stockholm has become the burial church of Sweden's monarchs. Their tombs and grave chapels fill the church around the high altar."
 swe_order_of_the_seraphim: "Serafimerorden"
 swe_order_of_the_seraphim_desc: "Serafimerorden, the Royal Order of the Seraphim, is the highest honour the Crown can give. Its knights wear a light blue riband with the cross of the seraphim, the highest of the angels, and are chosen by the monarch alone. Each knight's arms are painted on a shield and hung in $swe_riddarholmskyrkan$, and on the day a knight is buried its bells ring for an hour."

 swe_stockholm_palace_decision.title: "$swe_stockholm_palace$"
 swe_stockholm_palace_decision.desc: "[ShowLocationName('stockholm')] needs a royal palace worthy of the realm. Whether Tre Kronor still stands or lies in ruins, our architects would build a palace in the new style on its site, fit for the court and the offices of state. The work would take years and cost a fortune, and what is left of the old castle would have to come down."
 swe_stockholm_palace_decision.desc.entry: "$swe_stockholm_palace$ could be built on the site of Tre Kronor."
 swe_stockholm_palace_decision.historical_info: "In the 1690s Nicodemus Tessin the Younger began turning Tre Kronor into a Baroque palace, starting with its north wing. After the fire of 1697 he designed a new palace instead: a great square block around a courtyard that reused the walls of his north wing. The Great Northern War halted the work from 1709 until 1727. Tessin died in 1728 and Carl Hårleman finished the palace, and Adolf Fredrik and Lovisa Ulrika moved in in 1754. Its formal name is Stockholms slott; most Swedes call it Kungliga slottet, the Royal Palace."
 swe_stockholm_palace_decision.a: "Build the palace."

 swe_stockholm.1.title: "Tre Kronor Burns"
 swe_stockholm.1.entry: "$swe_stockholm.1.title$"
 swe_stockholm.1.desc: "[swe_dead_ruler.GetName] was lying in state in the great hall of Tre Kronor when the cry of fire went up from under the roof. The flames spread through the old castle faster than the guards could fight them. The coffin was carried out through the smoke and the courtiers saved what they could, but the royal castle that has stood over [ShowLocationName('stockholm')] for centuries is a burnt-out shell. Most of the royal library and the archives of the chancery have burned with it. Our architects say the ruins could carry a palace worthy of the realm, if the Crown will pay for it."
 swe_stockholm.1.historical_info: "Tre Kronor grew from a defensive tower built in the 13th century where Lake Mälaren drains into the Baltic, and took its name from the three crowns on the spire of its great tower. Johan III turned it into a Renaissance palace, and in the 1690s Nicodemus Tessin the Younger rebuilt its north wing in the Baroque style. On 7 May 1697, while the body of Karl XI lay in state in the castle, a fire broke out under the roof and destroyed most of the building, along with much of the Royal Library and the state archives. The court moved to the Wrangel Palace on Riddarholmen, and Tessin began a new palace on the ruins."
 swe_stockholm.1.a: "Build a new palace on the ruins."
 swe_stockholm.1.a.entry: "A new palace rose on the ruins of Tre Kronor."
 swe_stockholm.1.b: "The court will lodge on Riddarholmen for now."
 swe_stockholm.1.b.entry: "The court moved out of the ruins of Tre Kronor."
 swe_stockholm.1.b_tt: "The palace can be built later through the decision $swe_stockholm_palace_decision.title$."

 swe_stockholm.2.title: "The Royal Funeral"
 swe_stockholm.2.entry: "$swe_stockholm.2.title$"
 swe_stockholm.2.desc: "[swe_dead_ruler.GetName] has lain in state for weeks while the court prepared the funeral. Now the procession must be ordered, and the realm must know where [swe_dead_ruler.GetSheHe] will rest. The Greyfriars' church on Riddarholmen in [ShowLocationName('stockholm')] already holds the tombs of kings, close to the castle and the government. The archbishop would rather see a royal grave in the cathedral at [ShowLocationName('uppsala')], the old heart of the realm. A simpler burial would spare the treasury, but people would talk."
 swe_stockholm.2.historical_info: "Swedish kings were buried in several churches during the Middle Ages and the early Vasa era. Magnus Ladulås (died 1290), a patron of the Franciscans, and Karl Knutsson (died 1470) lie in the Greyfriars' church in Stockholm, today Riddarholmskyrkan. Gustav Vasa and Johan III were buried in Uppsala Cathedral, Erik XIV in Västerås and Karl IX in Strängnäs. After Gustav II Adolf, killed at Lützen, was buried on Riddarholmen in 1634, the church became the burial place of Sweden's monarchs. Nearly all of them lie there; Kristina, who died in Rome, is the best-known exception. The island, once Gråbrödraholmen, took the name Riddarholmen from the noble palaces built there in the 17th century."
 swe_stockholm.2.a: "Lay [swe_dead_ruler.GetHerHim] to rest on Riddarholmen."
 swe_stockholm.2.a.entry: "The monarch was buried on Riddarholmen."
 swe_stockholm.2.b: "Bury [swe_dead_ruler.GetHerHim] in Uppsala Cathedral."
 swe_stockholm.2.b.entry: "The monarch was buried in Uppsala Cathedral."
 swe_stockholm.2.c: "A simple burial will do."
 swe_stockholm.2.c.entry: "The monarch was given a simple burial."

 swe_stockholm.3.title: "[ShowChivalricOrderNameWithNoTooltip('swe_order_of_the_seraphim')]"
 swe_stockholm.3.entry: "$swe_order_of_the_seraphim$"
 swe_stockholm.3.desc: "Our monarchs are now laid to rest in $swe_riddarholmskyrkan$, and the heralds of the court have a proposal: an order of knighthood with the church as its home. Its knights would be the first men of the realm, chosen by the monarch alone. Their arms would hang in the church, and when one of them was buried its bells would ring for him. They would call it Serafimerorden, the Order of the Seraphim, after the highest of the angels. The [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] are eager for the honour, though they know the riband will go to those who serve the Crown best, not to those of the oldest blood."
 swe_stockholm.3.historical_info: "Fredrik I founded the Royal Order of the Seraphim (Kungliga Serafimerorden) on 23 February 1748, together with the Order of the Sword and the Order of the North Star. The Seraphim was kept for the royal family, the highest officers of state and foreign princes, and its knights wore a light blue riband. Riddarholmskyrkan became the order's church: the coat of arms of every knight is painted on a shield and hung on its walls, and on the day of a knight's funeral its bells ring from noon until one, the Seraphim ringing. The order also gave its name to Stockholm's first general hospital, the Serafimerlasarettet, opened in 1752."
 swe_stockholm.3.a: "Found the order."
 swe_stockholm.3.a.entry: "Serafimerorden was founded."
 swe_stockholm.3.b: "The realm has no need of ribands."
 swe_stockholm.3.b.entry: "The Crown declined to found an order of knighthood."

 swe_st_goran: "S:t Göran och draken"
 swe_st_goran_desc: "A great carved group of Saint George and the dragon in Storkyrkan, Stockholm, with the princess he has rescued at his side."

 swe_stockholm.4.title: "An Altar for Saint George"
 swe_stockholm.4.entry: "$swe_stockholm.4.title$"
 swe_stockholm.4.desc: "There is a proposal to give Saint George an altar of his own in the great church of [ShowLocationName('stockholm')], with the saint on horseback above it, the dragon under his lance and the whole group carved larger than life. The carvers would have to come from the German towns, and they know what such work is worth. Every burgher and foreign envoy in [ShowLocationName('stockholm')] would see whose realm this is, and whom its rulers thank for it. The same money would keep a garrison for a season, which a wooden saint will not do."
 swe_stockholm.4.historical_info: "Sten Sture the Elder placed himself and his army under Saint George's protection at the Battle of Brunkeberg in 1471, and afterwards ordered a group of the saint and the dragon for a Saint George altar in Storkyrkan in Stockholm. A papal nuncio consecrated it on New Year's Eve 1489. It carries the arms of Sture and his wife, and it is usually attributed to the Lübeck master Bernt Notke, although many attributions to him are disputed. A bronze copy from 1912 stands at Köpmantorget, a short walk from the original."
 swe_stockholm.4.a: "Send for the carvers."
 swe_stockholm.4.a.entry: "An altar to Saint George was raised in Stockholm."
 swe_stockholm.4.b: "A wooden saint pays no garrison."
 swe_stockholm.4.b.entry: "The altar to Saint George was not built."

 swe_vadersolstavlan: "Vädersolstavlan"
 swe_vadersolstavlan_desc: "A painted panel in Storkyrkan, Stockholm, showing the ring of false suns that stood over the town one April morning, with the town itself small beneath them."

 swe_stockholm.5.title: "The Sky over Stockholm"
 swe_stockholm.5.entry: "$swe_stockholm.5.title$"
 swe_stockholm.5.desc: "For three hours one April morning, a ring of false suns stood around the true sun in the sky over [ShowLocationName('stockholm')]. The preachers of the great church have told their congregations what it means: a warning from God of rebellion, and of rulers cast down. One of them now wants the sky painted on a panel and hung in the church, so that every congregation after this one sees the sign too. The [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] would count it a fitting witness to God's works. A sermon is forgotten by the next Sunday, however, and a panel on the wall would go on preaching this one for as long as the wood lasts."
 swe_stockholm.5.historical_info: "On 20 April 1535, from six until nine in the morning, sun dogs and rings of light were seen in the sky over Stockholm. The reformer Olaus Petri read them as omens of rebellion and violent overthrow, and had them painted on a panel that he hung in Storkyrkan. By 1539 Gustav Vasa was complaining that Olaus had attacked him from the pulpit for years. At Örebro that winter Olaus was sentenced to death for keeping quiet about a plot against the king, and the city of Stockholm paid his ransom. The panel in Storkyrkan today was painted in 1636 or a little before, as a copy of a lost original, and is one of the oldest known pictures of the city. Some historians doubt that the original had anything to do with Olaus."
 swe_stockholm.5.a: "Let it hang in the great church."
 swe_stockholm.5.a.entry: "The panel of the false suns was hung in Stockholm's great church."
 swe_stockholm.5.b: "The sky has cleared. So can the wall."
 swe_stockholm.5.b.entry: "The panel of the false suns was not hung."
