l_english:
 swe_konungabalken: "Konungabalken"
 swe_konungabalken_desc: "First codified in the Law of Uppland of 1296, the 'Konungabalken' (Chapter of the King) establishes the constitutional foundation of our realm. It dictates that the Crown of Sweden is not merely inherited by blood, but bestowed by the consent of the governed. While the King's eldest son is the presumptive heir, he must still be formally elected at the Stones of Mora. This code preserves the ancient rights of the aristocracy, ensuring that our provincial Lawspeakers hold the final say in the succession, and the power to check a tyrant."
 swe_birkarl_rights: "Birkarlarätt"
 swe_birkarl_rights_desc: "The Birkarlar, peasant traders of the Torne, Lule and Pite valleys, hold the trade with the Sámi of the Lappmarks and collect their tax. Each winter they travel inland with grain, salt and iron, and return with [ShowGoodsName('fur')] and dried fish for the markets of the south. The Crown receives its share, but the Birkarlar keep the trade and the power that comes with it."