l_english:
 swe_konungabalken: "Konungabalken"
 swe_konungabalken_desc: "'The Swedes have the right to take a king, and to cast him out.' So say the old laws of the provinces. The king's sons have the first right to be chosen, but no one is king until the lawmen and the men of the provinces have elected him at the Stones of Mora. Every new king must swear to uphold the law, and the [ShowEstateTypeName('nobles_estate')] of the council expect to be rewarded for their votes."
 swe_birkarl_rights: "Birkarlarätt"
 swe_birkarl_rights_desc: "The Birkarlar are [ShowPopTypeName('peasants')] of the Torne, Lule and Pite valleys who hold the trade with the [ShowCultureName('sapmi')] of the lappmarks and collect their tax. Each winter they travel inland with grain, salt and iron, and come back with [ShowGoodsName('fur')] and [ShowGoodsName('wild_game')] to sell in the south. The Crown gets its share of the tax, but the trade stays in their hands."
 swe_bottniska_handelstvanget: "Bottniska handelstvånget"
 swe_bottniska_handelstvanget_desc: "The towns of East and West Bothnia may not trade with foreign ports. Their [ShowGoodsName('tar')], [ShowGoodsName('fur')] and [ShowGoodsName('fish')] must be shipped to [ShowLocationName('stockholm')], where the [ShowEstateTypeName('burghers_estate')] buy them and the Crown takes its toll. Royal bailiffs, not the Birkarlar, now collect the tax of the [ShowCultureName('sapmi')]. The merchants of the north complain that they must sell cheap and buy dear."
 swe_tjarkompaniet: "Tjärkompaniet"
 swe_tjarkompaniet_desc: "Through the Tar Company, the [ShowEstateTypeName('burghers_estate')] of [ShowLocationName('stockholm')] hold the sole right to buy the [ShowGoodsName('tar')] of Österbotten and sell it abroad. Every navy in Europe needs it for its ships. The company alone decides what the [ShowPopTypeName('peasants')] who burn it are paid."
 swe_tjarkompaniet_location_bonus: "Every [location|e] in [ShowProvinceDefinitionName('norra_osterbotten_province')] and [ShowProvinceDefinitionName('sodra_osterbotten_province')] gains:"
 swe_bottniska_birkarl_lands_bonus: "Every [location|e] in [ShowProvinceDefinitionName('vasterbotten_province')], [ShowProvinceDefinitionName('pite_lappmark_province')], [ShowProvinceDefinitionName('lule_lappmark_province')], [ShowProvinceDefinitionName('torne_lappmark_province')] and [ShowProvinceDefinitionName('kemi_lappmark_province')] gains:"
 swe_uppsala_mote: "Uppsala mötes beslut"
 swe_uppsala_mote_desc: "At [ShowLocationName('uppsala')] the clergy and the estates have bound the realm to the Augsburg Confession. The [ShowEstateTypeName('clergy_estate')] teach one faith from every pulpit, the Catholic ceremonies of the old liturgy are gone, and no ruler may be crowned without first swearing to uphold the decision."
