l_english:
 swe_prussia.1.title: "The Prussian Ports"
 swe_prussia.1.entry: "$swe_prussia.1.title$"
 swe_prussia.1.desc: "The harbours of Prussia now answer to [ROOT.GetCountry.GetName]. Through them pass the grain of the Vistula, the timber and hemp of the Lithuanian forests and the amber of the Samland shore, and every ship that carries it out pays its dues to whoever holds the quays. Our treasurers would have the Crown's officers take a toll on every cargo, and they reckon it could pay for an army. The councils of the Prussian towns, which have governed themselves under Lübeck and Kulm law for generations, ask to keep their freedoms, and point out that the grain ships can as easily sail from a harbour that asks less of them."
 swe_prussia.1.historical_info: "Gustav II Adolf landed at Pillau in the summer of 1626, during his war with Poland, and took Braunsberg, Frauenburg and Elbing within weeks. Axel Oxenstierna governed Swedish Prussia from Elbing until 1631 and ran the tolls of its harbours. At the Truce of Altmark in 1629 Sweden kept Elbing, Braunsberg, Pillau and Memel, with a share of the tolls on the shipping of the Prussian ports, Danzig's among them. The regency gave the ports back at Stuhmsdorf in 1635 and kept Livonia. Karl X Gustav returned in 1655. At Königsberg in January 1656 he made the Elector of Brandenburg hold Ducal Prussia as a fief of the Swedish crown and hand over half its port duties. Before the year was out, at Labiau, he needed Brandenburg as an ally more than as a vassal: he recognised the Elector's full sovereignty, gave up the tolls and settled for a payment of 120,000 riksdaler."
 swe_prussia.1.a: "Toll the Prussian trade."
 swe_prussia.1.a.entry: "The Crown took a licent on the trade of the Prussian ports."
 swe_prussia.1.a_tt: "Each of [ShowLocationName('fischhausen')], [ShowLocationName('memel')], [ShowLocationName('elblag')], [ShowLocationName('gdansk')] and [ShowLocationName('konigsberg')] that we own gains [ShowModifier('swe_riga_licent')] for 50 years."
 swe_prussia.1.b: "Leave the ports to their councils."
 swe_prussia.1.b.entry: "The Prussian ports kept their councils and their freedoms."
 swe_prussia.1.b_tt: "Each of [ShowLocationName('fischhausen')], [ShowLocationName('memel')], [ShowLocationName('elblag')], [ShowLocationName('gdansk')] and [ShowLocationName('konigsberg')] that we own gains [ShowModifier('swe_baltic_town_privileges')] for 50 years."
