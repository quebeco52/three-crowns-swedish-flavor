l_english:
 STATIC_MODIFIER_NAME_swe_enkoping_ice_ban: "The Ice Trade Banned"
 STATIC_MODIFIER_DESC_swe_enkoping_ice_ban: "The town's privileges are confirmed and bargaining on the ice is forbidden. The burghers are pleased, whether or not anyone on the ice has noticed."
 STATIC_MODIFIER_NAME_swe_enkoping_ice_market: "The Market on the Ice"
 STATIC_MODIFIER_DESC_swe_enkoping_ice_market: "Twenty days after Christmas the ice fills with traders, and anyone may bargain with the iron men from the mining country."
 STATIC_MODIFIER_NAME_swe_sodertalje_cut: "The Södertälje Cut"
 STATIC_MODIFIER_DESC_swe_sodertalje_cut: "A channel dug through the neck of land lets boats pass between the lake and the sea, for as long as anyone keeps it up."
 STATIC_MODIFIER_NAME_swe_rademacher_forges: "The Fine Smiths"
 STATIC_MODIFIER_DESC_swe_rademacher_forges: "A royal manufactory draws foreign smiths here to make knives, scissors, needles, locks and nails under a monopoly on fine work."

 swe_svealand.1.title: "The Market on the Ice"
 swe_svealand.1.entry: "$swe_svealand.1.title$"
 swe_svealand.1.desc: "Twenty days after Christmas, the ice below [ShowLocationName('enkoping')] fills with traders. The mining men come down from the iron country to sell, and anyone at all may bargain with them, burgher or not. The burghers of the town have asked us to confirm their privileges and to put an end to this trade on the ice. A ban may change very little. But the burghers are the ones paying the town's taxes, and they are the ones asking."
 swe_svealand.1.historical_info: "Enköping's Twentieth-Day Market, held twenty days after Christmas, was probably the second-largest market in Sweden at first. Iron dominated it, with sellers from Bergslagen and Västmanland, and the final deals with the mining men were struck at a smaller market in the town. It began as a free market where anyone could bargain. Historians disagree on where it stood: Sven Ljung placed it on the ice by Klosterön, while Nils Sundquist put the marketplace on the slope below the Church of Our Lady. Gustav Vasa confirmed Enköping's privileges in 1521 but forbade bargaining on the ice, which supports Ljung, and the ban probably changed little. The market was held for the last time in 1865."
 swe_svealand.1.a: "Confirm the privileges and ban it."
 swe_svealand.1.a.entry: "Bargaining on the ice at Enköping was banned."
 swe_svealand.1.b: "Let them trade on the ice."
 swe_svealand.1.b.entry: "The market on the ice at Enköping was left alone."

 swe_svealand.2.title: "High Water on Mälaren"
 swe_svealand.2.entry: "$swe_svealand.2.title$"
 swe_svealand.2.desc: "Lake Mälaren has risen over its shores, and the water stands in the streets of the towns around it. At [ShowLocationName('sodertalje')], only a narrow neck of land keeps the lake from the sea. If we send enough men to dig through it, the water will drain away, and boats may pass between the lake and the sea besides. The work has been started before and left unfinished. It will cost money and thousands of men. If we do nothing, the water will go down in its own time, and the towns will count the damage."
 swe_svealand.2.historical_info: "The old waterway between Mälaren and the sea at Södertälje had long been closed. Engelbrekt tried to dig a canal past the town in the spring of 1435, but he was murdered a year later and the work stopped. Duke Karl proposed a channel in the 1590s, and a royal letter of 8 November 1610 ordered 100 men at a time to dig in fourteen-day shifts, though nobody knows whether any of it was dug. Troops were sent in 1640 and 1641, and a Dutch lock builder was called for, but the project faded. In the spring of 1661 Mälaren rose so high that nearly 3,000 men, led among others by Erik Dahlberg, dug through, and on 20 May Dahlberg went by boat from the lake to the sea. The channel was poorly maintained and fell into disrepair. Gustav IV Adolf signed the canal company's privileges in 1806, and soldiers and prisoners of war dug the canal that opened in 1819."
 swe_svealand.2.a: "Dig through."
 swe_svealand.2.a.entry: "Thousands of men dug through at Södertälje."
 swe_svealand.2.a_tt: "The peasant [pops|e] in every [location|e] we own in [ShowProvinceDefinitionName('uppland_province')], [ShowProvinceDefinitionName('sodermanland_province')] and [ShowProvinceDefinitionName('vastmanland_province')] lose 10% [pop_satisfaction|e]."
 swe_svealand.2.b: "Wait for the water to fall."
 swe_svealand.2.b.entry: "The water was left to fall in its own time."
 swe_svealand.2.b_tt: "[ShowLocationName('stockholm')], [ShowLocationName('enkoping')], [ShowLocationName('strangnas')], [ShowLocationName('vasteras')] and [ShowLocationName('sodertalje')] lose [prosperity|e] if we own them."

 swe_svealand.3.title: "The Smith from Riga"
 swe_svealand.3.entry: "$swe_svealand.3.title$"
 swe_svealand.3.desc: "A merchant of [ShowLocationName('riga')] who runs a fine-smithing works at Kirkholm, up the river, has told our envoys that it lies too close to the Russians for comfort. He is ready to move. Give him generous privileges and a monopoly on fine smithing, he says, and he will bring his smiths to [ShowLocationName('strangnas')] and make knives, scissors, needles, locks and nails. Our architects have drawn up a plan for more than a hundred forges in white brick. It will be expensive, and the smiths we already have will not thank us for it."
 swe_svealand.3.historical_info: "Karl X Gustav persuaded Reinhold Rademacher (1609-1668), a merchant of Riga with a fine-smithing works at Kirkholm, to move it to Eskilstuna, and his privileges are dated 21 July 1654. Jean de la Vallée drew up the plan for 120 forges. The first was finished in 1659, the year Eskilstuna received town privileges as Carl Gustafs stad. Most of the workers were immigrants, mainly German smiths, who owned neither their forges nor their tools nor what they made. Funding largely stopped when the king died in 1660, and only 20 forges were ever built, of wood. Rademacher's widow, Maria Wittmacher, ran the works after his death. In 1771 the Riksdag founded a free town on roughly the same land, where small metalworkers could operate without tax or customs duties."
 swe_svealand.3.a: "Bring him here."
 swe_svealand.3.a.entry: "The smith from Riga was invited to build his forges."
 swe_svealand.3.b: "Our own smiths will do."
 swe_svealand.3.b.entry: "The smith from Riga stayed where he was."

 swe_uppsala_domkyrka: "Uppsala domkyrka"
 swe_uppsala_domkyrka_desc: "The cathedral of Saint Lars and Saint Erik at Uppsala, a century and a half in the building."

 swe_svealand.4.title: "The Cathedral at Uppsala"
 swe_svealand.4.entry: "$swe_svealand.4.title$"
 swe_svealand.4.desc: "The cathedral of [ShowLocationName('uppsala')] has been a century and a half in the building. Mass has been sung in its choir for generations, the nave is roofed at last, and the chapter has begun on the west front. The archbishop now means to consecrate the church as it stands, without its towers. Silver from us would raise them in our time and not our grandchildren's. King Magnus once helped by asking the province for a third of its tithe, which cost him nothing, and the Church has gone on building for a hundred years since."
 swe_svealand.4.historical_info: "Work on the present cathedral began in the 1270s, and in 1287 the master mason Étienne de Bonneuil was engaged in Paris to lead it. The choir was in use from the 1310s, the nave was begun in the 1360s and the body of the church was roofed by about 1400. In 1331 Magnus Eriksson asked Uppland and Gästrikland for a third of their church tithe for three years towards the building, and in 1338 he ruled that its builders and masons should answer in court only to his bailiff at Stockholm. Archbishop Olof Larsson, whom the chapter had elected against the wishes of Erik of Pomerania, consecrated the church in June 1435 while it still had no towers. Work on the west front and the towers went on into the early 16th century. For nearly three centuries most Swedish monarchs were crowned there."
 swe_svealand.4.a: "Give the chapter the silver."
 swe_svealand.4.a.entry: "The Crown paid towards the towers of Uppsala Cathedral."
 swe_svealand.4.b: "The Church has managed this far."
 swe_svealand.4.b.entry: "Uppsala Cathedral was consecrated without the Crown's money."
