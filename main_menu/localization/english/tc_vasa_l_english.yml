l_english:
 swe_vasa.1.title: "The Young Lord of Rydboholm"
 swe_vasa.1.entry: "$swe_vasa.1.title$"
 swe_vasa.1.desc: "[swe_gustav_vasa.GetName], a young lord of the Vasa family from Uppland, has come to court. He is quick to anger but a gifted speaker, and he never seems to tire. The older lords have begun to take notice of him, and a few of them already say that [ROOT.GetCountry.GetName] would be better off with him in charge."
 swe_vasa.1.historical_info: "Gustav Eriksson was born in 1496 into the Vasa family, one of the great houses of the Swedish council aristocracy. His father, Erik Johansson, sat on the Council of the Realm. In 1518 the young Gustav carried the Swedish banner at the Battle of Brännkyrka against the Danish king Christian II. Shortly afterwards he was one of six hostages whom Christian took with him to Denmark. He escaped in 1519 and was back in Sweden the following year, and in November 1520 his father was among those executed in the Stockholm Bloodbath."
 swe_vasa.1.a: "Keep him close."
 swe_vasa.1.a.entry: "The young Vasa stays at court."

 swe_vasa.2.title: "A Crown for the House of Vasa"
 swe_vasa.2.entry: "$swe_vasa.2.title$"
 swe_vasa.2.desc: "The estates have gathered, and many of them want a change. They have put forward [swe_vasa_candidate.GetName] of the House of Vasa, who has the support of the [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] and of several great families. They ask that he be crowned in place of [swe_old_ruler.GetName]. The lords who back him will not take a refusal lightly."
 swe_vasa.2.historical_info: "After the Stockholm Bloodbath, Gustav Eriksson Vasa raised the men of Dalarna against Christian II. Within two years the rebels had driven the Danes from most of Sweden, and on 6 June 1523 the Riksdag at Strängnäs elected Gustav king, ending the Kalmar Union for good. He reigned until his death in 1560. In that time he broke the power of the Church and made the crown hereditary at Västerås in 1544, and his house held the throne until Queen Kristina abdicated in 1654."
 swe_vasa.2.a: "Long live King [swe_vasa_candidate.GetName]!"
 swe_vasa.2.a.entry: "A Vasa takes the crown."
 swe_vasa.2.a.union_tt: "[ROOT.GetCountry.GetName] leaves the [union|e], since its partners no longer share its ruler. Each of them gains the [ShowCasusBelliName('cb_claim_throne')] [casus_belli|e] against [ROOT.GetCountry.GetName]."
 swe_vasa.2.a.religion_tt: "He takes the faith of the realm, and his family with him."
 swe_vasa.2.a.lawful_tt: "He is lawfully elected under [ShowEstatePrivilegeName('swe_konungabalken')], so his reign begins without any loss of [legitimacy|e]."
 swe_vasa.2.b: "[swe_old_ruler.GetName] remains our [ROOT.GetCountry.GetGovernment.GetRulerTitle]."
 swe_vasa.2.b.entry: "The old ruler remains."

 swe_vasa.3.title: "The Riksdag at Västerås"
 swe_vasa.3.entry: "$swe_vasa.3.title$"
 swe_vasa.3.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] has called the Riksdag to [ShowLocationName('vasteras')]. Under $swe_konungabalken$ every new monarch must be elected, and the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] have always made the Crown pay for their votes. Now the Crown asks the estates to make the throne hereditary, so that it passes by blood and not by election. The [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] and [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] are ready to agree. The lords of the council are not, since they would lose their strongest hold over the Crown."
 swe_vasa.3.historical_info: "At the Riksdag of Västerås in January 1544, the estates accepted the Hereditary Union, which made the Swedish crown hereditary in the male line of Gustav Vasa's house. This ended the elective kingship of medieval Swedish law, and with it the council aristocracy's power to choose each new king and bargain with him. The same Riksdag declared Sweden an evangelical kingdom."
 swe_vasa.3.a: "Let the crown pass by blood."
 swe_vasa.3.a.entry: "The crown becomes hereditary."
 swe_vasa.3.b: "The old law stands."
 swe_vasa.3.b.entry: "The crown stays elective."
