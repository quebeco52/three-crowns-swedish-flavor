l_english:
 swe_novgorod.1.title: "Lord Novgorod the Great"
 swe_novgorod.1.entry: "$swe_novgorod.1.title$"
 swe_novgorod.1.desc: "The great city of [ShowLocationName('novgorod')] is in our hands, but no foreign master has ever ruled it for long. Its merchants trade across the Baltic, its archbishop answers to the [ShowReligionAdjective('orthodox')] Church, and its people remember the days when the city chose its own princes. Now its leading men come to us with an offer: let Novgorod have a prince of its own under our protection, and it will guard our eastern border against all comers. Our councillors would rather keep the city, as a pledge for the lands we want on the Neva and around Lake Ladoga."
 swe_novgorod.1.desc_troubles: "With the [ShowDisasterName('time_of_troubles')] tearing the lands beyond our border apart, the great city of [ShowLocationName('novgorod')] is in our hands, and its leading men see no help coming from anywhere else. Its merchants trade across the Baltic, its archbishop answers to the [ShowReligionAdjective('orthodox')] Church, and its people remember the days when the city chose its own princes. Now they come to us with an offer: let Novgorod have a prince of its own under our protection, and it will guard our eastern border against all comers. Our councillors would rather keep the city, as a pledge for the lands we want on the Neva and around Lake Ladoga."
 swe_novgorod.1.historical_info: "Novgorod was the centre of a merchant republic until Moscow annexed it in 1478. During the Time of Troubles, after Russia failed to keep the Treaty of Vyborg, Jacob De la Gardie took the city in July 1611. Its leaders made a treaty with him: Novgorod accepted Swedish protection and asked for one of Karl IX's sons as its prince, and as Tsar of all Russia. The younger son, Karl Filip, came as far as Vyborg in 1613, but by then Moscow had elected Mikhail Romanov. Sweden held Novgorod as a bargaining chip until the Treaty of Stolbovo in 1617, when it gave the city back in return for Ingria and Kexholm."
 swe_novgorod.1.a: "Novgorod shall have a prince of its own."
 swe_novgorod.1.a.entry: "Novgorod became a state under our protection."
 swe_novgorod.1.a_tt: "Every [location|e] we own in [ShowAreaName('east_novgorod_area')], [ShowProvinceDefinitionName('knyazhaya_province')] and [ShowProvinceDefinitionName('luzhkaya_province')] where [ShowReligionName('orthodox')] is the dominant [religion|e] passes to the new state, our [ShowSubjectTypeName('march')]. It takes the culture and faith of [ShowLocationName('novgorod')], and the name and arms of $NOV$ if that country no longer exists. We keep [ShowProvinceDefinitionName('korela_province')], [ShowProvinceDefinitionName('lopskaya_province')] and [ShowProvinceDefinitionName('vodskaya_province')]."
 swe_novgorod.1.b: "Keep the city as a pledge."
 swe_novgorod.1.b.entry: "We kept Novgorod as a pledge."
 swe_novgorod.1.b_tt: "[ShowLocationName('novgorod')] stays under our direct rule, as a pledge for whatever parts of [ShowProvinceDefinitionName('korela_province')], [ShowProvinceDefinitionName('lopskaya_province')] and [ShowProvinceDefinitionName('vodskaya_province')] others still hold."
