l_english:
 STATIC_MODIFIER_NAME_swe_satakunta_relieved: "The Fortress Pulled Down"
 STATIC_MODIFIER_DESC_swe_satakunta_relieved: "The old fortress is gone, and the people of the district no longer have to carry its burden."
 STATIC_MODIFIER_NAME_swe_korsholm_coast_watch: "The Watch on the Coast"
 STATIC_MODIFIER_DESC_swe_korsholm_coast_watch: "A royal fortress now stands beside the market here, and its bailiff watches who comes and goes along the Gulf of Bothnia."
 STATIC_MODIFIER_NAME_swe_kumo_castle_burden: "The Burden of the Fortress"
 STATIC_MODIFIER_DESC_swe_kumo_castle_burden: "The fortress stays, and the people of the district go on paying for it, year after year."
 STATIC_MODIFIER_NAME_swe_pirate_bailiff: "The Pirate Bailiff"
 STATIC_MODIFIER_DESC_swe_pirate_bailiff: "A former pirate captain now keeps the castle in the Crown's name. He collects the taxes with a practised hand, and not all of them reach us."
 STATIC_MODIFIER_NAME_swe_lempaala_pledge: "The Pledge of Lempäälä"
 STATIC_MODIFIER_DESC_swe_lempaala_pledge: "The peasants have sworn never to rise again, with twelve men from each parish as guarantors, and in return the Crown's officers tread more lightly."
 STATIC_MODIFIER_NAME_swe_satakunta_bailiffs: "The Hanging Bailiffs"
 STATIC_MODIFIER_DESC_swe_satakunta_bailiffs: "The rising was broken by force, and the Crown's men are feared in every parish. Fear is not the same as peace."
 STATIC_MODIFIER_NAME_swe_free_osterbotten: "The Free Peasants of Österbotten"
 STATIC_MODIFIER_DESC_swe_free_osterbotten: "The nobles have been kept out of Österbotten, and its farmers still own their land, pay their own taxes and answer to no lord."
 STATIC_MODIFIER_NAME_swe_osterbotten_fiefs: "The Österbotten Fiefs"
 STATIC_MODIFIER_DESC_swe_osterbotten_fiefs: "Whole parishes have been granted away as fiefs. The farmers who once paid the Crown now pay a count, and fear they will end up as his tenants."
 STATIC_MODIFIER_NAME_swe_skipper_ban: "The Skipper Ban"
 STATIC_MODIFIER_DESC_swe_skipper_ban: "The bailiffs are enforcing the law against peasant sailing. Ships lie idle, and what the farmers have to sell must now go through the towns."
 STATIC_MODIFIER_NAME_swe_peasant_skippers: "The Peasant Skippers"
 STATIC_MODIFIER_DESC_swe_peasant_skippers: "On paper the law forbids it, but farmers here own ships in shares and carry their goods wherever the price is good."
 STATIC_MODIFIER_NAME_swe_nyland_forests: "The Timber of Nyland"
 STATIC_MODIFIER_DESC_swe_nyland_forests: "The forests of Nyland were kept for timber and tar rather than burned for charcoal, and the sawyers and tar burners have plenty of work."

 swe_finland_west.1.title: "The Castle in the Wrong Place"
 swe_finland_west.1.entry: "$swe_finland_west.1.title$"
 swe_finland_west.1.desc: "The people of Satakunta complain that the fortress near [ShowLocationName('bjorneborg')] is too heavy a burden on them, and it guards little that matters. Meanwhile, merchants from the White Sea walk out to the Gulf of Bothnia and sail down the coast, trading where they please beyond our control. We could pull the fortress down and build a new one further north, beside the market at [ShowLocationName('korsholm')], where a bailiff could watch the whole coast. That would mean paying to move a castle we already have."
 swe_finland_west.1.historical_info: "Albrekt of Mecklenburg came to Finland in 1365 and besieged Åbo castle. Even then he wanted to stop the White Sea Karelian merchants who walked out to the Gulf of Bothnia and sailed south along the coast, beyond the king's control. In a letter of 12 July 1367 he ordered a fortress in 'Satagundia' taken down because it had become too burdensome for the inhabitants, and a new one built in a better place. Many historians take this to mean Kumo castle, near today's Björneborg, and connect it with the building of Korsholm. But several fortresses were being built at this time, so the letter may not mean Korsholm at all. Korsholm is first named, as 'Crysseborgh', in Bo Jonsson's will of 1384."
 swe_finland_west.1.a: "Pull it down and build in the north."
 swe_finland_west.1.a.entry: "The fortress in Satakunta was pulled down, and a new one watched the Bothnian coast."
 swe_finland_west.1.b: "The castle stays where it is."
 swe_finland_west.1.b.entry: "The fortress in Satakunta stayed, burden and all."

 swe_finland_west.2.title: "Pirates at Korsholm"
 swe_finland_west.2.entry: "$swe_finland_west.2.title$"
 swe_finland_west.2.desc: "A fleet of the Victual Brothers has sailed up the Gulf of Bothnia and taken [ShowLocationName('korsholm')]. Nobody can say quite how. Our bailiff may have been besieged, or may simply have decided that it was no use fighting. Now the pirates sit behind its palisades, in the castle that governs the whole of the north. But they are running out of friends and are willing to hand it back. One of their captains offers to stay on and keep it as our own bailiff. The rest of them want a great deal of silver before they will sail away."
 swe_finland_west.2.historical_info: "The Victual Brothers were privateers who fought for King Albrekt against Queen Margareta, and soon began seizing any ship they could. In 1396, with their side already losing, a part of their fleet sailed north under Arned Styke and took Korsholm from its bailiff, Filip Karlsson. No record says how. The wooden fortress was one of their bases for three years. In 1398 they agreed to hand it over 'with Norrabotten and all the fiefs that lie by it', and it was the last fortress they surrendered, by 20 April 1399. Margareta gave several of their leaders work instead of driving them out, and made one of them, Otte Peccatel, bailiff of Korsholm. He died a knight and a rich man."
 swe_finland_west.2.a: "Make the pirate our bailiff."
 swe_finland_west.2.a.entry: "A former pirate was made bailiff of Korsholm."
 swe_finland_west.2.b: "Pay them to leave."
 swe_finland_west.2.b.entry: "The Victual Brothers were paid to leave Korsholm."

 swe_finland_west.3.title: "The Peasant King of Ania"
 swe_finland_west.3.entry: "$swe_finland_west.3.title$"
 swe_finland_west.3.desc: "Upper Satakunta is in arms. A rich farmer named David has raised the parishes around [ShowLocationName('birkala')], and his followers are calling him their king. They say that the taxes keep rising, that the goods they pay with are valued below their worth, and that the nobles have taken the fishing waters and mill sites that once served them all. Four soldiers have already been killed at a manor. The Bishop of [ShowLocationName('abo')] suggests inviting them to talk about their taxes. The nobles want to see them hanged."
 swe_finland_west.3.historical_info: "In the autumn of 1438 David of Ania, a wealthy peasant from Vesilahti in Upper Satakunta, led the rising, and one at Lammi may have been coordinated with it. The soldiers died at Viikki manor in Nokia. Bishop Maunu Tavast and Hans Kröpelin, the chief of Åbo castle, invited the rebels to Lempäälä. The terms were mild: the peasants were pardoned, gave some of their meadows to the manor, and on 9 January 1439 promised never to rise against the Crown again, with twelve men from each parish as guarantors. David escaped from custody to Tallinn, and his family kept their farm at Ania."
 swe_finland_west.3.a: "Talk to them at Lempäälä."
 swe_finland_west.3.a.entry: "The rising in Upper Satakunta ended in talks at Lempäälä."
 swe_finland_west.3.a_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('satakunta_province')] gains $STATIC_MODIFIER_NAME_swe_lempaala_pledge$ for 15 years."
 swe_finland_west.3.b: "Hang the ringleaders."
 swe_finland_west.3.b.entry: "The rising in Upper Satakunta was put down by force."
 swe_finland_west.3.b_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('satakunta_province')] gains $STATIC_MODIFIER_NAME_swe_satakunta_bailiffs$ for 10 years, and the peasant [pops|e] there lose 15% [pop_satisfaction|e]."

 swe_finland_west.4.title: "The Last Free Peasants"
 swe_finland_west.4.entry: "$swe_finland_west.4.title$"
 swe_finland_west.4.desc: "Soldiers billeted on the farms of Österbotten take what they want, and the squires who equip them collect their dues even in peacetime. Around [ShowLocationName('korsholm')] the peasants have taken up clubs against them. Now the whole region has sent us a joint complaint. The nobles, it says, want to settle in Österbotten and make tenants of its people, who are the only peasants in Finland still free. They ask us to keep the nobles out of the land for good. The nobles remind us that fiefs are the usual reward for serving the Crown, and that they have served it well."
 swe_finland_west.4.historical_info: "These grievances grew out of the long war with Russia and the billeting known as the 'castle camp'. On 25 November 1596 Ostrobothnian peasants rose at Kyrö, in what became the Club War. Duke Karl had encouraged them against his rival Klaus Fleming, the king's marshal in Finland, though historians disagree over how far he drove it. Jaakko Ilkka was executed in January 1597, and the last peasant army was destroyed at Santavuori on 24 February, with over 1,000 killed. On 27 December 1599 Österbotten made its joint complaint to Duke Karl. Fiefs came all the same, from 1608 and above all in the 1650s, until Karl XI reclaimed them in 1674."
 swe_finland_west.4.a: "Keep the nobles out of Österbotten."
 swe_finland_west.4.a.entry: "Österbotten's peasants stayed free of noble landlords."
 swe_finland_west.4.a_tt: "Every [location|e] we own in Österbotten gains $STATIC_MODIFIER_NAME_swe_free_osterbotten$ for 25 years."
 swe_finland_west.4.b: "Grant the fiefs."
 swe_finland_west.4.b.entry: "Österbotten's parishes were granted out as fiefs."
 swe_finland_west.4.b_tt: "Every [location|e] we own in Österbotten gains $STATIC_MODIFIER_NAME_swe_osterbotten_fiefs$ for 50 years, and the peasant [pops|e] there lose 15% [pop_satisfaction|e]."

 swe_finland_west.5.title: "The Peasant Skippers"
 swe_finland_west.5.entry: "$swe_finland_west.5.title$"
 swe_finland_west.5.desc: "The burghers have complained again. By law a peasant may sail only for his own household's needs, and the new trade ordinance tightens the rules further. Yet the farmers of [ShowLocationName('kastelholm')] and the Nyland coast own ships in shares and carry their goods wherever the price is good, and our bailiffs have little appetite for chasing them through the skerries. The towns want the law enforced. The skippers say this is how they have always lived."
 swe_finland_west.5.historical_info: "The town law of Magnus Eriksson, around 1350, limited free farmers to sailing for their own household's needs, in effect to protect the burghers from competition. The trade ordinance of 1614 went further, cutting ports north of Gefle and Åbo off from shipping with the south. In 1617 Gustav II Adolf chartered Nystad at the old market of Nykyrko, as part of the effort to separate rural and urban trades. Enforcement was probably never strict. A royal decree of 3 December 1765 lifted nearly all the limits. By about 1800, Åland had 276 peasant shipowners and part-owners and the coast from Rimito to Sjundeå had 141, with only scattered ones elsewhere."
 swe_finland_west.5.a: "Enforce the law."
 swe_finland_west.5.a.entry: "The Crown enforced the ban on peasant sailing."
 swe_finland_west.5.b: "Look the other way."
 swe_finland_west.5.b.entry: "The peasant skippers kept sailing, whatever the law said."

 swe_finland_west.6.title: "Finland's Bergslag"
 swe_finland_west.6.entry: "$swe_finland_west.6.title$"
 swe_finland_west.6.desc: "Our officials fear for the forests of Sweden, which the charcoal burners of the mining country are eating faster than they can grow. A merchant of [ShowLocationName('abo')] proposes an answer: ship the ore across the sea and smelt it near [ShowLocationName('sjundea')], where the forests of Nyland still stand. He asks for a charter and for leave to bring in skilled men from Sweden, Germany and the Netherlands. The same forests already pay us well in timber and tar."
 swe_finland_west.6.historical_info: "The Swedish government backed an iron industry in Finland out of concern for the threatened forests at home, and gave the works privileges that made them pay even on imported ore. Erik Fleming had worked the ore at Ojamo by Lake Lojo under Gustav Vasa, but Finnish ore was poor and soon ran short. In the 1640s the Dutch-born merchant Peter Thorwöste of Åbo was allowed to hire skilled workers from abroad, and in 1649 he won permission for a blast furnace and bar hammer at Fiskars, using ore shipped from Utö in the Stockholm archipelago. Antskog, Billnäs and Fagervik also grew up in western Nyland. The Great Northern War almost totally destroyed the Finnish works in 1713-21, and of the 13 rebuilt afterwards, seven were restored by Stockholm merchants."
 swe_finland_west.6.a: "Grant the charter."
 swe_finland_west.6.a.entry: "Ironworks were chartered in western Nyland."
 swe_finland_west.6.b: "Keep the forests for timber and tar."
 swe_finland_west.6.b.entry: "The forests of Nyland were kept for timber and tar."
 swe_finland_west.6.b_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('nyland_province')] gains $STATIC_MODIFIER_NAME_swe_nyland_forests$ for 25 years."
