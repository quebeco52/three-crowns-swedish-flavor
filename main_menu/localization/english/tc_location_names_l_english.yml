l_english:
 # Swedish names for the Baltic and Pomeranian towns. The Swedish administration there used the
 # German names (as vanilla already does for Reval, Dorpat and Pernau). swedish_dialect has no
 # fallback, so without these a Swedish owner sees the modern Estonian, Latvian or Polish name.
 # Estonia and Ösel
