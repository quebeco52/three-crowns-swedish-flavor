 # Province names, and names with no Swedish source. A province name may be a town in it, a period region or a colony on
 # the province holding its capital. Compass words are ours. Further sources:
 # Silverstolpe = Geographi och Statistik öfver Sverige och Norrige 1819, runeberg.org/svnogestat. Oedman = Chorographia Bahusiensis 1746, runeberg.org/chorbahus.
 # Holmberg = Bohusläns historia 1867, runeberg.org/aehbhob. Radloff = Beskrifning öfver Åland 1795, runeberg.org/rfwaland.
 # Troil = Bref rörande en resa til Island 1777, archive.org/details/BREFrorandeenres000397249v0TroiReyk.
 # Gezelius = Försök til et biographiskt lexicon 1778-87, runeberg.org/gezbiolex. Biogr. lexicon = Biographiskt lexicon öfver namnkunnige svenska män 1835-57, runeberg.org/biosvman.
 # Arkiv = Arkiv till upplysning om svenska krigens historia 1854-61, runeberg.org/arkivkir. Karl XII bref = Konung Karl XII:s egenhändiga bref, ed. 1893, runeberg.org/karl12bref.
 # Agneta Horn = Agneta Horns lefverne, written 1657, sv.wikisource.org. Olaus Petri = Svenska Krönika, Klemming ed. 1860, sv.wikisource.org. Traventhal = the 1700 peace, sv.wikisource.org.
 # Handlingar = Handlingar rörande Skandinaviens historia, runeberg.org/hrsh. Fryxell = Berättelser ur svenska historien 1823-72, runeberg.org/svhistfry.
 # Carlbom = Karl X Gustafs polska krig 1905, runeberg.org/cjlpolska. Lundqvist = Sveriges krig med staden Bremen 1893, runeberg.org/bremen.
 # Akiander = Bidrag till kännedom om Ingermanlands stift 1865, runeberg.org/aminkeri. Ahlén = Bidrag till det ryska krigets historia under Johan III 1869-73, runeberg.org/aaryska.
 # Rein = Kejsaredömet Rysslands statistik 1838, runeberg.org/rgryss. Modeen = Lärobok i Rysslands och Polens geografi 1867, runeberg.org/rypogeo.
 # Djurberg = Geografie för ungdom 1800, archive.org/details/geografiefrungd00djurgoog. Carlsson = Coleridge, transl. Carlsson, Sex månader i Westindien 1835, archive.org/details/sexmnaderinwest00carlgoog.
 # Campanius = Campanius Holm, Kort beskrifning om provincien Nya Swerige 1702, archive.org/details/kortbeskrifningo00holm. Acrelius = Beskrifning om de swenska församlingars tilstånd 1759, archive.org/details/beskrifningomdes00acre.
 # Loskiel = Historiske beskrifning, Swedish ed. 1792, archive.org/details/georghinrichlosk00losk. Gosselman = Resa i Norra Amerika 1835, archive.org/details/resainorraamerik00goss. Kalm III = vol. 3, 1761, archive.org/details/cihm_35371.
