 # Arkiv = Arkiv till upplysning om svenska krigens historia 1854-61, runeberg.org/arkivkir. Karl XII bref = Konung Karl XII:s egenhändiga bref, ed. 1893, runeberg.org/karl12bref.
 # Agneta Horn = Agneta Horns lefverne, written 1657, sv.wikisource.org. Olaus Petri = Svenska Krönika, Klemming ed. 1860, sv.wikisource.org. Traventhal = the 1700 peace, sv.wikisource.org.
