 # Attested names, except those marked #adapted:, #translated: or #founded:, which are ours. A place Swedes never named keeps its base name, since period
 # Swedish mostly kept local names. Trailing comments give the source:
 # NF = Nordisk familjebok, runeberg.org/<page>.html. Nystad = the 1721 treaty, histdoc.net/nystad/nystad_sv.html.
 # OPT = Ordinari Post Tijdender 1645. PT = Stockholm Post-Tijdender from 1700. PoIT = Post- och Inrikes Tidningar 1821-36.
 # Hermes = Hermes Gothicus 1624. VS = von Schantz, Canton voyage 1746-49. All five on sv.wikisource.org.
 # Kalm = En resa til Norra America 1753, archive.org/details/enresatilnorraam02kalm. sv.wp = Swedish Wikipedia.
 # Topelius = Finland framstäldt i teckningar 1845, runeberg.org/ztfinland. SOF = Svenska ortnamn i Finland 1963, runeberg.org/sveortfin.
 # Fellman = notes printed 1844, runeberg.org/fjlappmark. Laestadius = L. L. Laestadius 1824, runeberg.org/omlappmark.
 # Dalin = Svea rikes historia 1747, runeberg.org/svearikehi. Rosenberg = gazetteer 1882, runeberg.org/rosenberg.
