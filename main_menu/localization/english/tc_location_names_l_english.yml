 # Holmberg = Bohusläns historia 1867, runeberg.org/aehbhob. Radloff = Beskrifning öfver Åland 1795, runeberg.org/rfwaland.
 # Troil = Bref rörande en resa til Island 1777, archive.org/details/BREFrorandeenres000397249v0TroiReyk.
