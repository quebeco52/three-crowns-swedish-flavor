l_english:
 carlsburg: "Carlsburg"

 STATIC_MODIFIER_NAME_swe_bremen_homage: "The City's Oath"
 STATIC_MODIFIER_DESC_swe_bremen_homage: "The city has sworn to be true and loyal to us as its lords. Its council still sits and its law still holds, but its dues now come to us, and it complains of it to anyone who will listen."
 STATIC_MODIFIER_NAME_swe_carlsburg: "A Free Town"
 STATIC_MODIFIER_DESC_swe_carlsburg: "Settlers of any Christian nation may live here free of land tax, tolls and billeting, and the harbour takes the largest ships. The streets are laid out; the houses are still to come."
 STATIC_MODIFIER_NAME_swe_franconian_duchy: "The Duchy of Franconia"
 STATIC_MODIFIER_DESC_swe_franconian_duchy: "A duke of our making holds this land of our crown, and the duke's officers collect its taxes for themselves, taking what they can while the war lasts."
 STATIC_MODIFIER_NAME_swe_franconian_government: "Our Own Officials"
 STATIC_MODIFIER_DESC_swe_franconian_government: "Our governor and councillors sit in the bishop's chancery, and the revenues of the see come to us."

 swe_germany.1.title: "The Council of Bremen"
 swe_germany.1.entry: "$swe_germany.1.title$"
 swe_germany.1.desc: "[ShowLocationName('bremen')] is ours, but its council does not see it that way: it holds that the city answers to no lord but the Emperor. Its burghers swore to the archbishops as their lords, and they could swear the same to us and pay what lords are owed. But Bremen has kept its own council and its own law under every lord this coast has had."
 swe_germany.1.historical_info: "In 1646 the Emperor made Bremen a free city of the Empire, and two years later the Peace of Westphalia gave Sweden the archbishopric as the duchy of Bremen without saying whether the city went with it. After a first war the city swore on 6 December 1654 to be true and loyal to the king as Duke of Bremen, as it had been to the last archbishop. After Karl X Gustav's death it did homage to the Emperor instead. The regency went to war in 1665, but Wrangel failed to take the city. At Habenhausen in November 1666 Bremen gave up its seat at the Imperial Diet until the end of the century, and it was never brought into the Swedish duchy."
 swe_germany.1.a: "Take the city's oath."
 swe_germany.1.a.entry: "Bremen swore to be true and loyal to us as its lords."
 swe_germany.1.a_tt: "The burgher [pops|e] of [ShowLocationName('bremen')] lose 5% [pop_satisfaction|e]."
 swe_germany.1.b: "Leave the city its freedoms."
 swe_germany.1.b.entry: "Bremen kept its council and its freedoms."
 swe_germany.1.b_tt: "The burgher [pops|e] of [ShowLocationName('bremen')] gain 5% [pop_satisfaction|e]."

 swe_germany.2.title: "The Franconian Sees"
 swe_germany.2.entry: "$swe_germany.2.title$"
 swe_germany.2.desc: "The lands of the sees of [ShowLocationName('wurzburg')] and [ShowLocationName('bamberg')] are ours, and the bishops' officials have fled. Our army has gone unpaid for months, and its colonels propose that one of our generals hold the two sees as a duchy of our crown, with leave for the officers to take their arrears from the land. The army would be paid now, and the land squeezed for as long as they held it. Or our own officials could sit in the bishop's chancery and send its revenues to us, and the colonels could be paid some other way, eventually."
 swe_germany.2.historical_info: "After Breitenfeld, Gustav II Adolf marched into Franconia. His army stormed the Marienberg above Würzburg on 18 October 1631, and on the 26th a royal mandate to the officials of the bishopric of Würzburg and the Duchy of Franconia was posted in the city. After the king fell at Lützen the army mutinied for its arrears in the spring of 1633, and Axel Oxenstierna paid it largely in land: officers were given the right to levy contributions and taxes in occupied territory, held of the Swedish crown, and squeezed it while they could. In June 1633 he granted Bernhard of Saxe-Weimar the sees of Würzburg and Bamberg as the Duchy of Franconia, a fief of the Swedish crown, keeping back the fortresses of Würzburg and Königshofen. After the defeat at Nördlingen in September 1634 the duchy could not be held."
 swe_germany.2.a: "Grant the sees as a duchy."
 swe_germany.2.a.entry: "The Franconian sees were granted as a duchy held of our crown."
 swe_germany.2.a_tt: "Every [location|e] we own in the sees of [ShowLocationName('wurzburg')] and [ShowLocationName('bamberg')] gains [ShowModifier('swe_war_contributions')] for 10 years, and all but [ShowLocationName('konigshofen')], whose fortress we keep, gain [ShowModifier('swe_franconian_duchy')] for 20 years."
 swe_germany.2.b: "Govern them ourselves."
 swe_germany.2.b.entry: "Our own officials governed the Franconian sees."
 swe_germany.2.b_tt: "Every [location|e] we own in the sees of [ShowLocationName('wurzburg')] and [ShowLocationName('bamberg')] gains [ShowModifier('swe_franconian_government')] for 20 years."

 swe_germany.3.title: "The Mouth of the Geeste"
 swe_germany.3.entry: "$swe_germany.3.title$"
 swe_germany.3.desc: "Our land now reaches the Weser below [ShowLocationName('bremen')], where the Geeste runs into it at [ShowLocationName('gestenthorpe')]. Every ship bound up the river for Bremen passes here, and a town with a deep harbour and freedoms for anyone who settles in it could take their cargoes first. The ground is marsh, though. The water is foul, the river floods, and walls and quays would cost us a great deal before the first merchant came."
 swe_germany.3.historical_info: "Sweden held the duchy of Bremen from 1648, but never the city, which had held out against Wrangel's army in 1666. So the Crown tried to win the quarrel with trade. On 11 June 1672 Henrik Horn broke ground for a new town at the mouth of the Geeste, named Carlsburg after Karl XI. Its privileges of 1674 opened it to settlers of every Christian nation, free of land tax, tolls and billeting, with a church for the Reformed, and Tessin the Elder drew some three to four hundred house plots. The walls were finished with 72 guns, but the settlers never came. Sick and short of food, the garrison surrendered in the winter of 1675-76. The land came back to Sweden in 1680, and from 1683 Karl XI's economies had the works pulled down."
 swe_germany.3.a: "Build a free town on the Geeste."
 swe_germany.3.a.entry: "A free town was laid out at the mouth of the Geeste."
 swe_germany.3.b: "Leave the marsh alone."
 swe_germany.3.b.entry: "The mouth of the Geeste was left to its villages."
