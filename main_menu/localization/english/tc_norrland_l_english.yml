l_english:
 STATIC_MODIFIER_NAME_swe_torne_salmon_fishery: "The Torne Salmon Fisheries"
 STATIC_MODIFIER_DESC_swe_torne_salmon_fishery: "Every summer the salmon swim up the Torne river, and the fishermen catch them in weirs built across the rapids. Salted Torne salmon is one of the most valuable exports of the north."

 swe_norrland.1.title: "The Bothnian Trade"
 swe_norrland.1.entry: "$swe_norrland.1.title$"
 swe_norrland.1.desc: "The [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] of [ShowLocationName('stockholm')] have sent a petition to the Crown. For centuries the Birkarlar have controlled the trade with the [ShowCultureName('sapmi')], collecting their furs and their tax and selling wherever they please. The burghers ask that all trade from the Bothnian coast go through [ShowLocationName('stockholm')], where the Crown can take its toll, and that royal bailiffs collect the Sámi tax instead. In the north, the [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] say the Crown means to take away their old rights."
 swe_norrland.1.historical_info: "From the Middle Ages, the Birkarlar, peasant traders of the Torne, Lule and Pite valleys, controlled the trade with the Sámi and collected their tax. Gustav Vasa took over the tax collection in 1553, and the Crown slowly took over their trade as well. The trade ordinances of 1614 and 1617 then forbade the towns of East and West Bothnia to trade with foreign ports: their goods had to go to Stockholm or Åbo. This Bothnian trade restriction (Bottniska handelstvånget) lasted until 1765."
 swe_norrland.1.a: "The trade of the north belongs to the Crown."
 swe_norrland.1.a.entry: "The Bothnian trade goes through Stockholm."
 swe_norrland.1.b: "Leave the north to the Birkarlar."
 swe_norrland.1.b.entry: "The Birkarlar keep their trade."
 swe_norrland.1.b_tt: "We can still revoke $swe_birkarl_rights$ and grant $swe_bottniska_handelstvanget$ later."

 swe_norrland.2.title: "The Tar Company"
 swe_norrland.2.entry: "$swe_norrland.2.title$"
 swe_norrland.2.desc: "Every summer the [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] of Österbotten burn pine in their tar pits and float the barrels downriver to the coast. Every navy in Europe needs [ShowGoodsName('tar')] for its ships, and much of it comes from our forests. The merchants of [ShowLocationName('stockholm')] now ask for a company with the sole right to buy it and sell it abroad. They promise the Crown a steady income, but the company would also decide what it pays the peasants."
 swe_norrland.2.historical_info: "Finland, and above all Ostrobothnia, was Europe's largest source of tar in the 17th and 18th centuries. Production grew quickly during the Thirty Years' War, and by the 1640s tar was one of Finland's main exports. In 1648 a tar company in Stockholm was given the sole right to buy and export tar, and with it control over prices and production. The company was re-founded several times, lost its monopoly between 1682 and 1689, and was abolished for good in 1715. The tar trade itself went on, and in the 18th century it made the towns of Ostrobothnia rich."
 swe_norrland.2.a: "Charter the company."
 swe_norrland.2.a.entry: "The Tar Company is chartered."
 swe_norrland.2.a_tt: "$swe_bottniska_handelstvanget$ gains a bonus to [ShowGoodsName('tar')] production in [ShowProvinceDefinitionName('norra_osterbotten_province')] and [ShowProvinceDefinitionName('sodra_osterbotten_province')]."
 swe_norrland.2.b: "Let the peasants sell their own tar."
 swe_norrland.2.b.entry: "The tar trade stays free."
 swe_tar_company_location_bonus: "The following bonus comes from the Tar Company and affects [ShowProvinceDefinitionName('norra_osterbotten_province')] and [ShowProvinceDefinitionName('sodra_osterbotten_province')]:"
