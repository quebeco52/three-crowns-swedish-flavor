l_english:
 STATIC_MODIFIER_NAME_swe_northern_salmon_fishery: "Northern Salmon Fisheries"
 STATIC_MODIFIER_DESC_swe_northern_salmon_fishery: "Every summer the salmon swim up the great rivers of the north, and the fishermen catch them in weirs built across the rapids. Salted salmon from the Torne, the Kemi and the Ule is one of the most valuable exports of the Bothnian coast."
 STATIC_MODIFIER_NAME_swe_alvkarleby_salmon_fishery: "The Älvkarleby Salmon Fishery"
 STATIC_MODIFIER_DESC_swe_alvkarleby_salmon_fishery: "Where the Dalälven falls into the sea at Älvkarleby, the salmon gather below the rapids every summer. The fishery there is one of the richest in the realm."
 STATIC_MODIFIER_NAME_swe_lappmark_settlers: "Lappmark Settlers"
 STATIC_MODIFIER_DESC_swe_lappmark_settlers: "Under the Lappmark Edict, settlers who clear new farms here pay no taxes and are free from military service for fifteen years."
 STATIC_MODIFIER_NAME_swe_faxeholm_ruins: "The Ruins of Faxeholm"
 STATIC_MODIFIER_DESC_swe_faxeholm_ruins: "No castle watches over this coast any more. The peasants settle their own affairs, and the Crown's officials tread carefully here."
 STATIC_MODIFIER_NAME_swe_norrland_bailiff: "The Crown's Bailiff"
 STATIC_MODIFIER_DESC_swe_norrland_bailiff: "A new castle and a new bailiff hold this coast for the Crown. The taxes come in, and so do the complaints."
 STATIC_MODIFIER_NAME_swe_gavle_fishermen: "The Gefle Fishermen"
 STATIC_MODIFIER_DESC_swe_gavle_fishermen: "The fishermen of Gefle hold the sole right to the herring of the Norrland coast, and every tenth barrel goes to the Crown."
 STATIC_MODIFIER_NAME_swe_gavle_fishing_grounds: "Gefle's Fishing Grounds"
 STATIC_MODIFIER_DESC_swe_gavle_fishing_grounds: "Every spring the boats from Gefle arrive to fish these waters, and they carry the salted herring south with them."
 STATIC_MODIFIER_NAME_swe_ragunda_crown_land: "The Crown's Lakebed"
 STATIC_MODIFIER_DESC_swe_ragunda_crown_land: "The land left behind when Ragundasjön drained belongs to the Crown, and the farmers who work it pay rent to the Crown's bailiff."
 STATIC_MODIFIER_NAME_swe_flor_manufactory: "The Flor Manufactory"
 STATIC_MODIFIER_DESC_swe_flor_manufactory: "The weavers at Flor make damask tablecloths and napkins for the courts of Europe, and sailcloth and canvas for everyone else."

 swe_bottniska_handelstvanget_decision.title: "The Bothnian Trade"
 swe_bottniska_handelstvanget_decision.desc: "The [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] of [ShowLocationName('stockholm')] want all trade from the Bothnian coast to pass through [ShowLocationNameWithNoTooltip('stockholm')], where the Crown can take its toll. The northern towns would lose the right to trade with foreign ports, and royal bailiffs would collect the tax of the [ShowCultureName('sapmi')] instead of the Birkarlar. In the north, the [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] say the Crown means to take away their old rights."
 swe_bottniska_handelstvanget_decision.desc.entry: "The trade of the Bothnian coast could be bound to Stockholm."
 swe_bottniska_handelstvanget_decision.historical_info: "From the Middle Ages, the Birkarlar, peasant traders of the Torne, Lule and Pite valleys, controlled the trade with the Sámi and collected their tax. Gustav Vasa took over the tax collection in 1553, and the Crown slowly took over their trade as well. The trade ordinances of 1614 and 1617 then forbade the towns of East and West Bothnia to trade with foreign ports: their goods had to go to Stockholm or Åbo. This Bothnian trade restriction (Bottniska handelstvånget) lasted until 1765."
 swe_bottniska_handelstvanget_decision.a: "The trade of the north belongs to the Crown."

 swe_tar_company_decision.title: "The Tar Company"
 swe_tar_company_decision.desc: "Every summer the [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] of Österbotten burn pine in their tar pits and float the barrels downriver to the coast. Every navy in Europe needs [ShowGoodsName('tar')] for its ships, and much of it comes from our forests. The merchants of [ShowLocationName('stockholm')] ask for a company with the sole right to buy it and sell it abroad. They promise the Crown a steady income, but the company would also decide what it pays the peasants."
 swe_tar_company_decision.desc.entry: "A company could buy up all the tar of Österbotten."
 swe_tar_company_decision.historical_info: "Finland, and above all Ostrobothnia, was Europe's largest source of tar in the 17th and 18th centuries. Production grew quickly during the Thirty Years' War, and by the 1640s tar was one of Finland's main exports. In 1648 a tar company in Stockholm was given the sole right to buy and export tar, and with it control over prices and production. The company was re-founded several times, lost its monopoly between 1682 and 1689, and was abolished for good in 1715. The tar trade itself went on, and in the 18th century it made the towns of Ostrobothnia rich."
 swe_tar_company_decision.a: "Charter the company."
 swe_tar_company_decision.a_tt: "[ShowEstatePrivilegeName('swe_bottniska_handelstvanget')] gains a bonus to [ShowGoodsName('tar')] production in [ShowProvinceDefinitionName('norra_osterbotten_province')] and [ShowProvinceDefinitionName('sodra_osterbotten_province')]."
 swe_tar_company_location_bonus: "Once we charter the Tar Company, every [location|e] in [ShowProvinceDefinitionName('norra_osterbotten_province')] and [ShowProvinceDefinitionName('sodra_osterbotten_province')] gains:"

 swe_lappmarksplakatet_decision.title: "The Lappmark Edict"
 swe_lappmarksplakatet_decision.desc: "The lappmarks are vast, and apart from the [ShowCultureName('sapmi')] and a few traders hardly anyone lives there. The Crown gets little from them. If settlers who clear new farms there were freed from taxes and military service for fifteen years, the [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] of the coast might be tempted to move inland."
 swe_lappmarksplakatet_decision.desc.entry: "Fifteen years of freedoms could draw settlers into the lappmarks."
 swe_lappmarksplakatet_decision.historical_info: "In 1673 the government of Karl XI issued the Lappmark Edict (Lappmarksplakatet) to settle the interior of northern Sweden. Settlers in the lappmarks were promised fifteen years free of taxes and exemption from military service. The edict was renewed in 1695, and over the following century farms spread up the river valleys into land the Sámi used for reindeer herding, which led to repeated conflicts between settlers and Sámi."
 swe_lappmarksplakatet_decision.a: "Open the lappmarks to settlers."

 swe_norrland.1.title: "Faxeholm Burns"
 swe_norrland.1.entry: "$swe_norrland.1.title$"
 swe_norrland.1.desc: "The [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] of [ShowProvinceDefinitionName('halsingland_province')] have had enough of the bailiff at Faxeholm, the castle by [ShowLocationName('soderala')]. They stormed it, drove out his men and burned it to the ground. Our councillors want it rebuilt and a new bailiff in place before the rest of the coast learns the lesson. Yet the taxes come in well enough when nobody is burning anything, and a new castle only gives them something to burn."
 swe_norrland.1.historical_info: "During the war for the Swedish throne in the 1390s, the Victual Brothers held castles along the Bothnian coast. They built Faxeholm in 1395 or 1396, on what was then an island at today's Söderhamn, and by 1398 it was in the Crown's hands. For decades it was the centre of Hälsingland's administration. During Engelbrekt's rising in 1434 the people of Hälsingland stormed and burned it, led according to tradition by Elof Djäkn. A ballad written down in the 1600s still told of the bailiff's cruelty. The castle was never rebuilt."
 swe_norrland.1.a: "Let the ruin lie."
 swe_norrland.1.a.entry: "Faxeholm was left in ruins."
 swe_norrland.1.a_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('halsingland_province')] and [ShowProvinceDefinitionName('angermanland_province')] gains [ShowModifier('swe_faxeholm_ruins')] for 25 years."
 swe_norrland.1.b: "Rebuild it, and send a new bailiff."
 swe_norrland.1.b.entry: "Faxeholm was rebuilt."
 swe_norrland.1.b_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('halsingland_province')] and [ShowProvinceDefinitionName('angermanland_province')] gains [ShowModifier('swe_norrland_bailiff')] for 10 years."

 swe_norrland.2.title: "The Gefle Fishermen"
 swe_norrland.2.entry: "$swe_norrland.2.title$"
 swe_norrland.2.desc: "Every spring the fishermen of [ShowLocationName('gefle')] sail north to the herring grounds of [ShowProvinceDefinitionName('halsingland_province')] and [ShowProvinceDefinitionName('angermanland_province')]. Now they ask for the sole right to fish that coast, and they offer the Crown every tenth barrel of salted herring in return. The towns and farmers of the north say those waters are theirs, and that the men of [ShowLocationNameWithNoTooltip('gefle')] would leave them nothing."
 swe_norrland.2.historical_info: "Gustav Vasa granted the monopoly in 1557, and the men of Gefle came to use some 87 fishing villages, about 43 of them in Hälsingland. The newer towns to the north fought them for the grounds: Sundsvall won the Medelpad waters in 1623, and the men of Gefle then had to pay rent to use the harbours there. The monopoly ended in 1766, when the king gave fishing rights back to the landowners, but Gefle's boats kept sailing north for about another century."
 swe_norrland.2.a: "Grant them the coast."
 swe_norrland.2.a.entry: "Gefle's fishermen were granted the Norrland coast."
 swe_norrland.2.b: "The waters belong to those who live by them."
 swe_norrland.2.b.entry: "The northern coast kept its own fishing."

 swe_norrland.3.title: "Döda fallet"
 swe_norrland.3.entry: "$swe_norrland.3.title$"
 swe_norrland.3.desc: "The great lake above [ShowLocationName('ragunda')] is gone. For years the farmers there have been digging a channel past the falls so that timber could float down the Indalsälven. Last night the river broke through. The whole lake poured away in about four hours, and the flood carried off sawmills and fishing works all the way to the sea. Where the water lay there is now a wide plain of silt, and the farmers who dug the channel have already claimed it. The people downriver want them to pay for everything."
 swe_norrland.3.historical_info: "In July 1779 Gustav III gave permission for a channel to float timber past the great falls at Ragunda. The work dragged on for years. A former merchant, Magnus Huss, known as Vildhussen, joined in 1793, though his part in the story has been overstated. The river broke through on the night of 6-7 June 1796. The farmers of Ragunda and Stugun were held responsible, but a settlement let them pay just 2,000 riksdaler to the parishes of Fors, Liden and Indal, and they kept the new land on the old lakebed. The dry falls are still called Döda fallet, the Dead Falls."
 swe_norrland.3.a: "Let the diggers keep their new land."
 swe_norrland.3.a.entry: "The diggers kept the lakebed."
 swe_norrland.3.b: "The lakebed goes to the Crown, and the Crown pays the valley."
 swe_norrland.3.b.entry: "The Crown took the lakebed and paid for the flood."

 swe_norrland.6.title: "The Flax of Hälsingland"
 swe_norrland.6.entry: "$swe_norrland.6.title$"
 swe_norrland.6.desc: "Flax grows well in the valleys of [ShowProvinceDefinitionName('halsingland_province')], but breaking and combing it by hand is the heaviest work of the year. The vicar of [ShowLocationName('hudiksvall')] says waterwheels could do it instead. If he is right, every stream could have its flax barn, and the [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] would have linen to sell. Some merchants have a different plan: a single manufactory near [ShowLocationName('soderala')], with skilled weavers making fine cloth for the courts of Europe."
 swe_norrland.6.historical_info: "Around 1700 Olof Johan Broman, a vicar in Hudiksvall, proposed using waterwheels for the two heaviest flax tasks, scutching and heckling. At its peak Hälsingland had about 1,000 flax barns and scutching mills, and linen brought its farmers an income that helped make them prosperous. In the 1700s a manufactory was also founded at Flor in Mo, just outside Söderhamn. It made damask tablecloths and napkins for most of Europe's courts, as well as sailcloth and canvas, and it ran for over 100 years."
 swe_norrland.6.a: "Let the peasants build their mills."
 swe_norrland.6.a.entry: "Flax barns spread across Hälsingland."
 swe_norrland.6.b: "Back the manufactory."
 swe_norrland.6.b.entry: "The Crown backed a linen manufactory at Flor."
