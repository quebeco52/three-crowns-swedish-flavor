l_english:
 swe_denmark.1.title: "The Fate of Zealand"
 swe_denmark.1.entry: "$swe_denmark.1.title$"
 swe_denmark.1.desc: "[ShowLocationName('kobenhavn')] and the towns of [ShowProvinceDefinitionName('zealand_province')] now answer to [ROOT.GetCountry.GetName], and what the island is to become is ours to decide. We could make it a Swedish province like any other, with Swedish law in its courts and Swedish priests in its pulpits, until its people forget they were ever anything else. Or we could treat it as what it is for the moment, an occupied country, and have its towns and farms pay for our armies. Zealand is rich enough to pay, though it will be a good deal poorer by the time it has finished."
 swe_denmark.1.historical_info: "The Treaty of Roskilde in February 1658 gave Sweden Skåne, Halland, Blekinge, Bohuslän, Bornholm and Trondhjems len, but at a council at Gottorp in July Karl X Gustav resolved to finish the work and conquer the whole of Denmark. He landed at Korsør in August and laid siege to Copenhagen, and his camp at Brønshøj, built from the timber of the villages around it, grew into a town of its own, called Carlstad. Kronborg fell in September, and the Sound toll was taken at Helsingør on Sweden's account. The rest of Zealand paid for the siege. Køge alone was charged a brandskat of 8,000 daler in August 1658, the price of not being burnt, and about 45,000 more in monthly deliveries by the summer of 1660. Frederiksborg was plundered in 1659. Copenhagen held out, and the night assault of February 1659 failed. Karl X Gustav died a year later, and the Treaty of Copenhagen of 1660 returned Bornholm and Trondhjems len to Denmark-Norway, though Skåne stayed Swedish."
 swe_denmark.1.a: "Zealand will be a Swedish province."
 swe_denmark.1.a.entry: "Zealand was brought under Swedish law."
 swe_denmark.1.a_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('zealand_province')] where [ShowCultureName('danish')] culture dominates gains [ShowModifier('swe_forsvenskning')] for 20 years."
 swe_denmark.1.b: "Zealand will pay for the war."
 swe_denmark.1.b.entry: "Zealand paid for our armies."
 swe_denmark.1.b_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('zealand_province')] gains [ShowModifier('swe_war_contributions')] for 10 years."

 swe_denmark.2.title: "The Three Crowns"
 swe_denmark.2.entry: "$swe_denmark.2.title$"
 swe_denmark.2.desc: "There is no longer a king in [ShowLocationName('kobenhavn')]. Three crowns stand in our arms, and for as long as there have been kings in Copenhagen they have reached for what was ours. None of them will reach again. The chancery would like the Danes to know it, in a little book printed in their own tongue, with their old arms on the title page and a fool's cap where each crown used to be. The army would rather lead the Danish prisoners through [ShowLocationName('stockholm')] two by two and hang their colours in Storkyrkan, which will cost us the arches and the fireworks. Either will be sung in our taverns for years and remembered in every Danish parish for longer, and the Danes are our people now. The quarrel is won, and more spite would only stir up old enmities."
 swe_denmark.2.desc_subject: "The crown of Denmark now answers to [ROOT.GetCountry.GetName], and so does [ShowLocationName('kobenhavn')]. Three crowns stand in our arms, and for as long as there have been kings in Copenhagen they have reached for what was ours. The one who is left will reach for nothing without our leave. The chancery would like the Danes to know it, in a little book printed in their own tongue, with their arms on the title page and a fool's cap where each crown used to be. The army would rather lead the Danish prisoners through [ShowLocationName('stockholm')] two by two and hang their colours in Storkyrkan, which will cost us the arches and the fireworks. Either will be sung in our taverns for years and remembered in every Danish parish for longer, and [swe_danish_crown.GetName] will take it personally. The quarrel is won, and more spite would only stir up old enmities."
 swe_denmark.2.historical_info: "The three crowns were a Swedish mark before they were anyone else's. They stand for Sweden on a frieze at Avignon in 1336, and Magnus Eriksson and Albrekt bore them. The union kings carried them in the Danish arms as well, and when Christian III took them up again in 1546, Gustav Vasa read it as proof that the Danes' thirst for his realm could never be quenched. Erik XIV answered by putting the lions of Denmark and Norway into the Swedish arms. A rhymed libel on Frederik II, dated 1563 and printed in Stockholm under a false Copenhagen imprint, twisted the Danish arms into a caricature and renamed the king Fredbrech, the peace-breaker, and in 1564 Erik rode in triumph through Stockholm behind Danish prisoners bound two by two and captured Danish colours. The quarrel helped start the war of 1563–70. The Peace of Stettin left both kings the crowns for the time being and banned the libels, and at Knäred in 1613 both were allowed to bear them with no claim on the other's realm. In 1558 Göran Gylta had objected to Gustav Vasa's rhymed answer to a Danish chronicle that it served only to revive old enmities. Denmark took the three crowns out of its royal arms by a resolution made public on 1 January 2025."
 swe_denmark.2.a: "Print the fool's caps."
 swe_denmark.2.a.entry: "We mocked the Danish arms in print."
 swe_denmark.2.b: "Lead the prisoners through [ShowLocationNameWithNoTooltip('stockholm')]."
 swe_denmark.2.b.entry: "We held a triumph over the Danes."
 swe_denmark.2.c: "Let the crowns rest."
 swe_denmark.2.c.entry: "We let the quarrel over the crowns rest."
 swe_denmark.2.kobenhavn_tt: "[ShowLocationName('kobenhavn')] is held by us or one of our subjects."
 swe_denmark.2.no_danish_crown_tt: "Denmark no longer exists, or it answers to us."
 swe_denmark.2.danes_angry_tt: "The Danish [pops|e] in every [location|e] we own where [ShowCultureName('danish')] culture dominates lose 5% [pop_satisfaction|e]."
 swe_denmark.2.c_tt: "The Danish [pops|e] in every [location|e] we own where [ShowCultureName('danish')] culture dominates gain 5% [pop_satisfaction|e]."
