l_english:
 STATIC_MODIFIER_NAME_swe_uppsala_mission: "Uppsala's Northern Mission"
 STATIC_MODIFIER_DESC_swe_uppsala_mission: "Priests from Uppsala travel the northern coast and river valleys, baptising whoever will come. Not everyone is glad to see them."
 STATIC_MODIFIER_NAME_swe_abo_diocese_north: "Åbo's Northern Parishes"
 STATIC_MODIFIER_DESC_swe_abo_diocese_north: "The Bishop of Åbo holds the churches of the far north as well as his own, and his chapter grows richer and more independent for it."
 STATIC_MODIFIER_NAME_swe_gratrask_fishing_rights: "The Gråträsk Fishing Rights"
 STATIC_MODIFIER_DESC_swe_gratrask_fishing_rights: "Farmers from the coast hold the sole right to fish these waters. First they came only for the summer, but now some are clearing land and staying."
 STATIC_MODIFIER_NAME_swe_sami_fishing_waters: "The Old Fishing Waters"
 STATIC_MODIFIER_DESC_swe_sami_fishing_waters: "The Crown has left the inland lakes to those who have always fished them, and the valleys are quieter for it."
 STATIC_MODIFIER_NAME_swe_reindeer_tax: "The Reindeer Tax"
 STATIC_MODIFIER_DESC_swe_reindeer_tax: "The bailiffs count the herds and tax them. A family that loses its reindeer in a hard winter still owes what the register says."
 STATIC_MODIFIER_NAME_swe_reindeer_herding: "Reindeer Herds"
 STATIC_MODIFIER_DESC_swe_reindeer_herding: "The families of the high country now follow their reindeer rather than the hunt. There is more meat in the camps, and more hides and pelts to sell."
 STATIC_MODIFIER_NAME_swe_sami_schools: "Sámi Schools"
 STATIC_MODIFIER_DESC_swe_sami_schools: "Boys chosen from the lappbyar are taught their letters and catechism in their own language, and go home as priests and catechists."
 STATIC_MODIFIER_NAME_swe_silver_road: "The Silver Road"
 STATIC_MODIFIER_DESC_swe_silver_road: "The Sámi here are made to haul ore and supplies with their reindeer between the mine and the coast. A family that is hauling cannot follow its herd, and many have slipped away over the border."
 STATIC_MODIFIER_NAME_swe_tornea_crown_town: "A Crown Town at Torneå"
 STATIC_MODIFIER_DESC_swe_tornea_crown_town: "The town stands where the Crown ordered it built, and its bailiffs watch the trade of the river closely. The traders still prefer the old landing place."
 STATIC_MODIFIER_NAME_swe_tornea_trade_district: "The Torneå Trading District"
 STATIC_MODIFIER_DESC_swe_tornea_trade_district: "The merchants of Torneå hold the trade of the Torne valley, Kainuu and the Lapplands of Torne and Kemi, the largest trading district in the realm."

 swe_birkarl_ting_location_bonus: "Once we confirm the rules of the Piteå ting, every [location|e] in the Birkarl lands gains:"

 swe_lappmark.1.title: "The Archbishop Sails North"
 swe_lappmark.1.entry: "$swe_lappmark.1.title$"
 swe_lappmark.1.desc: "The Archbishop of [ShowLocationName('uppsala')] means to sail north to [ShowLocationName('tornea')]. The Bishop of [ShowLocationName('abo')] has been confirming the faithful and blessing churchyards up there, and the archbishop wants it known whose diocese this is. He will meet the bishop, mark the boundary between them and baptise any [ShowCultureName('sapmi')] and Karelians who will come. He asks the Crown to pay for it. The treasury's view is that the bishop is welcome to that cold coast and all its troubles."
 swe_lappmark.1.historical_info: "In the mid-1340s Archbishop Hemming of Uppsala sailed north to Torneå. He met Bishop Hemming of Åbo at a harbour called Kompanasund to negotiate their boundary, and the bishop admitted that what he had done at Torneå he had done in the archbishop's name. At Torneå the archbishop baptised about 20 people, Sámi and Karelians from Ule, Kemi and Simo, in a great vat carried into the chapel while the crowd stood outside. Torsten Styrbjörnsson, the bailiff of Hälsingland, renewed the boundary mark, a heap of stones on an island in the Ule river. We know this from an inquest of 1374, where the archbishop's skipper, Johan Lång, gave his testimony."
 swe_lappmark.1.a: "Send the archbishop north."
 swe_lappmark.1.a.entry: "The archbishop sailed to Torneå."
 swe_lappmark.1.a_tt: "Every [location|e] we own in Västerbotten and the Lappmarks with [pops|e] of another faith gains $STATIC_MODIFIER_NAME_swe_uppsala_mission$ for 20 years, and one in twenty of those people is baptised at once."
 swe_lappmark.1.b: "Leave the north to Åbo."
 swe_lappmark.1.b.entry: "The far north was left to the Bishop of Åbo."

 swe_lappmark.2.title: "The Ting at Piteå"
 swe_lappmark.2.entry: "$swe_lappmark.2.title$"
 swe_lappmark.2.desc: "The Birkarlar have brought their quarrels before the lawman's ting at [ShowLocationName('pitea')]. Each claims the same [ShowCultureName('sapmi')] as his own customers and taxpayers, and the [ShowCultureName('sapmi')] say they are being robbed from every side. The lawman proposes to confirm the Birkarlar's old rights, but with rules set down: every one of the [ShowCultureName('sapmi')] is to answer to one birkarl, and no birkarl may harm or overtax them. The Birkarlar say their trade has always run on custom, and that it runs well enough."
 swe_lappmark.2.historical_info: "The Birkarlar held a recognised monopoly on trade and tax collection among the Sámi of the Torne, Lule and Pite lappmarks. A letter of 1390 still treats Sámi as something that passes with an estate, like land or fishing waters. On 6 July 1424 the lawman Nils Gustafsson settled a dispute among the Birkarlar at Piteå. He confirmed their old rights and assigned each Sámi to one birkarl. A birkarl who saved a Sámi's life with food or tools won three years' sole trade with that person, and the Birkarlar were forbidden to harm or overtax the poor Sámi."
 swe_lappmark.2.a: "Set the rules down."
 swe_lappmark.2.a.entry: "The Piteå ting set rules for the Birkarlar."
 swe_lappmark.2.a_tt: "$swe_birkarl_rights$ now also lowers unrest and fur output in the Birkarl lands."
 swe_lappmark.2.b: "Leave the Birkarlar to their customs."
 swe_lappmark.2.b.entry: "The Birkarlar kept their old customs."

 swe_lappmark.3.title: "The Fishing Rights at Gråträsk"
 swe_lappmark.3.entry: "$swe_lappmark.3.title$"
 swe_lappmark.3.desc: "Farmers from the coast have offered to pay for the sole right to fish at [ShowLocationName('gratesk')], far up the valley. The lake is rich and the land around it is better than it looks. But the [ShowCultureName('sapmi')] have fished and hunted there longer than anyone can remember, and they make their offerings at a lake close by. Selling the water would bring in money, and settlers would surely follow the fishermen."
 swe_lappmark.3.historical_info: "In the 14th century, farmers from the coast paid the Swedish government for exclusive rights to the fishing grounds at Gråträsk in Piteå's hinterland, and soon saw that the land could be farmed too. A village grew up in the late Middle Ages. In 1897 two farmers on their way to haymaking found more than 1,300 metal objects at Lake Tjautjer just to the south, dated to about 700-1300. It is one of the largest metal finds in Sweden, and the archaeologist Gustav Hallström concluded that the place was an ancient Sámi sacrificial site."
 swe_lappmark.3.a: "Sell them the rights."
 swe_lappmark.3.a.entry: "Coastal farmers bought the fishing rights at Gråträsk."
 swe_lappmark.3.b: "Leave the lake to those who fish it."
 swe_lappmark.3.b.entry: "The Crown left the lake at Gråträsk alone."

 swe_lappmark.4.title: "The Herds of the High Country"
 swe_lappmark.4.entry: "$swe_lappmark.4.title$"
 swe_lappmark.4.desc: "Something has changed in the north. In the high country the [ShowCultureName('sapmi')] now follow ever larger herds of reindeer, moving with the grazing, and live less by hunting and fishing than their fathers did. The forest families still keep to the old mixed living. Our bailiffs ask whether the tax should now be counted by the herd. It would bring in far more, but a family that loses its animals in a hard winter would still owe it."
 swe_lappmark.4.historical_info: "Sámi in the Lule valley moved gradually toward reindeer herding as their main livelihood, perhaps starting around the 11th century. By the 1600s and 1700s many had switched entirely, though fishing and hunting stayed important. In 1602 the lappfogde Karl Unesson recorded each taxpaying household and its reindeer in Ume Lappmark. State taxes in the 1600s and 1700s are thought to have hit the herding economy hard, especially in winters of poor grazing. Reindeer nomadism reached its peak in the mid to late 1700s."
 swe_lappmark.4.a: "Tax the herds."
 swe_lappmark.4.a.entry: "The bailiffs began to count the reindeer."
 swe_lappmark.4.herds_tt: "The high country turns to herding, except where a foreign realm holds it: [ShowLocationName('sorsele')], [ShowLocationName('silbojock')], [ShowLocationName('kvikkjock')], [ShowLocationName('sarek')], [ShowLocationName('nikkaluokta')], [ShowLocationName('kasivarren')], [ShowLocationName('abisko')] and [ShowLocationName('raunala')] gain $STATIC_MODIFIER_NAME_swe_reindeer_herding$."
 swe_lappmark.4.a_tt: "Every [location|e] we own in Västerbotten and the Lappmarks with [ShowCultureName('sapmi')] [pops|e] gains $STATIC_MODIFIER_NAME_swe_reindeer_tax$ for 20 years."
 swe_lappmark.4.b: "Keep the old rates."
 swe_lappmark.4.b.entry: "The old tax rates stayed in force."

 swe_lappmark.5.title: "A School for the Sámi"
 swe_lappmark.5.entry: "$swe_lappmark.5.title$"
 swe_lappmark.5.desc: "One of our vicars in the north has offered to teach [ShowCultureName('sapmi')] boys and send them back as priests to their own people. He already has a primer and a liturgy ready for the printer, in their own language. The bishop's men say that a priest who cannot speak Swedish is no use to the Crown, and that the boys should be taught in Swedish from the first day."
 swe_lappmark.5.historical_info: "In 1606 Karl IX's envoy Daniel Thordsson Hjort chose 16 Sámi boys for school in Uppsala, and seven arrived. In 1617 Nicolaus Andreæ, the vicar of Piteå, offered to found a school for the Sámi, and in 1619 he published a liturgy book and a primer, the first books printed in Sámi. After his death in 1628 his last pupils moved to Lycksele, where Johan Skytte backed a new school that opened in 1632 to train Sámi boys for the priesthood. A Sámi catechist post was created in 1633, and after that most of the teaching was in Swedish."
 swe_lappmark.5.a: "Teach them in their own language."
 swe_lappmark.5.a.entry: "Sámi schools taught in Sámi."
 swe_lappmark.5.a_tt: "Every [location|e] we own in Västerbotten and the Lappmarks with [ShowCultureName('sapmi')] [pops|e] gains $STATIC_MODIFIER_NAME_swe_sami_schools$ for 25 years and a few [ShowCultureName('sapmi')] priests."
 swe_lappmark.5.b: "Teach them in Swedish."
 swe_lappmark.5.b.entry: "Sámi schools taught in Swedish."
 swe_lappmark.5.b_tt: "Every [location|e] we own in Västerbotten and the Lappmarks with [ShowCultureName('sapmi')] [pops|e] gains $STATIC_MODIFIER_NAME_swe_forsvenskning$ for 20 years."

 swe_lappmark.6.title: "The Silver Road"
 swe_lappmark.6.entry: "$swe_lappmark.6.title$"
 swe_lappmark.6.desc: "The silver in the mountains above [ShowLocationName('silbojock')] is worth nothing until it reaches the coast, and there is no road. The bailiffs have an answer: the [ShowCultureName('sapmi')] have reindeer and sledges, and they know the country. Draft them, whole lappbyar if need be, and the silver will cost us next to nothing. But a family hauling ore cannot follow its herd, and many will slip away over the border. The alternative is to hire carriers and pay what they ask."
 swe_lappmark.6.historical_info: "Mining at Nasafjäll began in 1635, with a smelter at Silbojokk about 40 km away. The Sámi were forced to haul ore and supplies to and from the mine with their reindeer. A decree of 1640 moved the Lais, Gran and Tuorpon lappbyar to Arjeplog to provide more carriers. Since they could not herd at the same time, many grew poor, and many fled to Norway or the coast. From 1635 to 1659 the mines yielded 981 kg of silver and 255,000 kg of lead. In 1659 Norwegian soldiers attacked and burned the churches and most of the buildings. The Lais and Gran Sámi asked to return to Lycksele only in 1777."
 swe_lappmark.6.a: "Draft the lappbyar."
 swe_lappmark.6.a.entry: "The Sámi were drafted to haul the silver."
 swe_lappmark.6.a_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('pite_lappmark_province')] gains $STATIC_MODIFIER_NAME_swe_silver_road$ for 20 years."
 swe_lappmark.6.b: "Hire carriers."
 swe_lappmark.6.b.entry: "The Crown hired carriers for the silver."
 swe_lappmark.6.c: "Leave the silver in the mountain."
 swe_lappmark.6.c.entry: "The silver above Silbojokk stayed in the mountain."

 swe_lappmark.7.title: "A Town at Torneå"
 swe_lappmark.7.entry: "$swe_lappmark.7.title$"
 swe_lappmark.7.desc: "The Crown wants a proper town at the mouth of the Torne, and our officials have chosen a site on the island of Seittenkari. The people here refuse to build there. If there must be a town, they say, it should stand on Suensaari, where the old trading place has always been. And they want the trade of the whole north to go with it."
 swe_lappmark.7.historical_info: "In 1585 Johan III planned a town at the mouth of the Torne River, but the land traders and above all the Birkarlar brought the plan down. In 1620 Gustav II Adolf ordered a town on the island of Seittenkari, as part of founding Umeå, Piteå and Luleå. The locals thought the site unsuitable, and it was never built. The charter of 12 May 1621 put the town on Suensaari instead, and gave its merchants the largest trading district in the realm: Kainuu, the Torne valley, the Lapplands of Torne and Kemi, and a large part of northern Norway."
 swe_lappmark.7.a: "Build it where the Crown says."
 swe_lappmark.7.a.entry: "Torneå was built on the Crown's chosen site."
 swe_lappmark.7.b: "Suensaari it is, and give them the trade."
 swe_lappmark.7.b.entry: "Torneå was founded on Suensaari."
