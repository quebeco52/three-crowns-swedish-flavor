l_english:
 STATIC_MODIFIER_NAME_swe_uppsala_mission: "Uppsala's Northern Mission"
 STATIC_MODIFIER_DESC_swe_uppsala_mission: "Priests from Uppsala travel the northern coast and river valleys, baptising whoever will come. Not everyone is glad to see them."
 STATIC_MODIFIER_NAME_swe_abo_diocese_north: "Åbo's Northern Parishes"
 STATIC_MODIFIER_DESC_swe_abo_diocese_north: "The Bishop of Åbo holds the churches of the far north as well as his own, and his chapter grows richer and more independent for it."
 STATIC_MODIFIER_NAME_swe_gratrask_fishing_rights: "The Gråträsk Fishing Rights"
 STATIC_MODIFIER_DESC_swe_gratrask_fishing_rights: "Farmers from the coast hold the sole right to fish these waters. First they came only for the summer, but now some are clearing land and staying."
 STATIC_MODIFIER_NAME_swe_sami_fishing_waters: "The Old Fishing Waters"
 STATIC_MODIFIER_DESC_swe_sami_fishing_waters: "The Crown has left the inland lakes to those who have always fished them, and the valleys are quieter for it."
 STATIC_MODIFIER_NAME_swe_reindeer_tax: "The Reindeer Tax"
 STATIC_MODIFIER_DESC_swe_reindeer_tax: "The bailiffs count the herds and tax them. A family that loses its reindeer in a hard winter still owes what the register says."
 STATIC_MODIFIER_NAME_swe_reindeer_herding: "Reindeer Herds"
 STATIC_MODIFIER_DESC_swe_reindeer_herding: "The high country now lives by its herds of reindeer rather than by the hunt. There is more meat to eat, and more hides and pelts to sell."
 STATIC_MODIFIER_NAME_swe_sami_schools: "Sámi Schools"
 STATIC_MODIFIER_DESC_swe_sami_schools: "Boys chosen from the lappbyar are taught their letters and catechism in their own language, and go home as priests and catechists."
 STATIC_MODIFIER_NAME_swe_silver_road: "The Silver Road"
 STATIC_MODIFIER_DESC_swe_silver_road: "Whoever has reindeer and a sledge here is drafted to haul ore and supplies between the mine and the coast. Many slip away rather than serve, over the border or down to the coast."
 STATIC_MODIFIER_NAME_swe_tornea_crown_town: "A Crown Town at Torneå"
 STATIC_MODIFIER_DESC_swe_tornea_crown_town: "The town stands where the Crown ordered it built, and its bailiffs watch the trade of the river closely. The traders still prefer the old landing place."
 STATIC_MODIFIER_NAME_swe_tornea_trade_district: "The Torneå Trading District"
 STATIC_MODIFIER_DESC_swe_tornea_trade_district: "The merchants of Torneå hold the trade of the Torne valley, Kajanaland and the Lapplands of Torne and Kemi, the largest trading district in the realm."

 swe_lappmark.1.title: "The Archbishop Sails North"
 swe_lappmark.1.entry: "$swe_lappmark.1.title$"
 swe_lappmark.1.desc: "The Archbishop of [ShowLocationName('uppsala')] means to sail north to [ShowLocationName('tornea')]. The Bishop of [ShowLocationName('abo')] has been confirming the faithful and blessing churchyards up there, and the archbishop wants it known whose diocese this is. He will meet the bishop, mark the boundary between them and baptise any [ShowCultureName('sapmi')] and Karelians who will come. He asks the Crown to pay for it. The treasury's view is that the bishop is welcome to that cold coast and all its troubles."
 swe_lappmark.1.historical_info: "In the mid-1340s Archbishop Hemming of Uppsala sailed north to Torneå. He met Bishop Hemming of Åbo at a harbour called Kompanasund to negotiate their boundary, and the bishop admitted that what he had done at Torneå he had done in the archbishop's name. At Torneå the archbishop baptised about 20 people, Sámi and Karelians from Ule, Kemi and Simo, in a great vat carried into the chapel while the crowd stood outside. Torsten Styrbjörnsson, the bailiff of Hälsingland, renewed the boundary mark, a heap of stones on an island in the Ule river. We know this from an inquest of 1374, where the archbishop's skipper, Johan Lång, gave his testimony."
 swe_lappmark.1.a: "Send the archbishop north."
 swe_lappmark.1.a.entry: "The archbishop sailed to Torneå."
 swe_lappmark.1.a_tt: "Every [location|e] we own in Västerbotten and the Lappmarks with [pops|e] of another faith gains [ShowModifier('swe_uppsala_mission')] for 20 years, and one in twenty of those people is baptised at once."
 swe_lappmark.1.b: "Leave the north to Åbo."
 swe_lappmark.1.b.entry: "The far north was left to the Bishop of Åbo."

 swe_lappmark.3.title: "The Fishing Rights at Gråträsk"
 swe_lappmark.3.entry: "$swe_lappmark.3.title$"
 swe_lappmark.3.desc: "Farmers from the coast have offered to pay for the sole right to fish at [ShowLocationName('gratesk')], far up the valley. The lake is rich and the land around it is better than it looks. But the [ShowCultureName('sapmi')] have fished and hunted there longer than anyone can remember, and they make their offerings at a lake close by. Selling the water would bring in money, and settlers would surely follow the fishermen."
 swe_lappmark.3.historical_info: "In the 14th century, farmers from the coast paid the Swedish government for exclusive rights to the fishing grounds at Gråträsk in Piteå's hinterland, and soon saw that the land could be farmed too. A village grew up in the late Middle Ages. In 1897 two farmers on their way to haymaking found more than 1,300 metal objects at Lake Tjautjer just to the south, dated to about 700-1300. It is one of the largest metal finds in Sweden, and the archaeologist Gustav Hallström concluded that the place was an ancient Sámi sacrificial site."
 swe_lappmark.3.a: "Sell them the rights."
 swe_lappmark.3.a.entry: "Coastal farmers bought the fishing rights at Gråträsk."
 swe_lappmark.3.a_tt: "The [ShowCultureName('sapmi')] [pops|e] in every [location|e] we own in [ShowProvinceDefinitionName('vasterbotten_province')] lose 10% [pop_satisfaction|e]."
 swe_lappmark.3.b: "Leave the lake to those who fish it."
 swe_lappmark.3.b.entry: "The Crown left the lake at Gråträsk alone."

 swe_lappmark.4.title: "The Herds of the High Country"
 swe_lappmark.4.entry: "$swe_lappmark.4.title$"
 swe_lappmark.4.desc: "Something has changed in the north. In the high country the [ShowCultureName('sapmi')] now follow ever larger herds of reindeer, moving with the grazing, and live less by hunting and fishing than their fathers did. The forest families still keep to the old mixed living. The tax could now be counted by the herd. It would bring in far more, but a family that loses its animals in a hard winter would still owe it."
 swe_lappmark.4.historical_info: "Sámi in the Lule valley moved gradually towards reindeer herding as their main livelihood, perhaps starting around the 11th century. By the 1600s and 1700s many had switched entirely, though fishing and hunting stayed important. In 1602 the lappfogde Karl Unesson recorded each taxpaying household and its reindeer in Ume Lappmark. State taxes in the 1600s and 1700s are thought to have hit the herding economy hard, especially in winters of poor grazing. Reindeer nomadism reached its peak in the mid to late 1700s."
 swe_lappmark.4.a: "Tax the herds."
 swe_lappmark.4.a.entry: "The bailiffs began to count the reindeer."
 swe_lappmark.4.herds_tt: "The high country turns to herding, except where a foreign realm holds it: [ShowLocationName('sorsele')], [ShowLocationName('silbojock')], [ShowLocationName('kvikkjock')], [ShowLocationName('sarek')], [ShowLocationName('nikkaluokta')], [ShowLocationName('kasivarren')], [ShowLocationName('abisko')] and [ShowLocationName('raunala')] gain [ShowModifier('swe_reindeer_herding')]."
 swe_lappmark.4.a_tt: "Every [location|e] we own in Västerbotten and the Lappmarks with [ShowCultureName('sapmi')] [pops|e] gains [ShowModifier('swe_reindeer_tax')] for 20 years."
 swe_lappmark.4.b: "Keep the old rates."
 swe_lappmark.4.b.entry: "The old tax rates stayed in force."

 swe_lappmark.5.title: "A School for the Sámi"
 swe_lappmark.5.entry: "$swe_lappmark.5.title$"
 swe_lappmark.5.desc: "One of our vicars in the north has offered to teach [ShowCultureName('sapmi')] boys and send them back as priests to their own people. He already has a primer and a liturgy ready for the printer, in their own language. A priest who cannot speak Swedish is of little use to the Crown, and the boys could as well be taught in Swedish from the first day."
 swe_lappmark.5.historical_info: "In 1606 Karl IX's envoy Daniel Thordsson Hjort chose 16 Sámi boys for school in Uppsala, and seven arrived. In 1617 Nicolaus Andreæ, the vicar of Piteå, offered to found a school for the Sámi, and in 1619 he published a liturgy book and a primer, the first books printed in Sámi. After his death in 1628 his last pupils moved to Lycksele, where Johan Skytte backed a new school that opened in 1632 to train Sámi boys for the priesthood. A Sámi catechist post was created in 1633, and after that most of the teaching was in Swedish."
 swe_lappmark.5.a: "Teach them in their own language."
 swe_lappmark.5.a.entry: "Sámi schools taught in Sámi."
 swe_lappmark.5.a_tt: "Every [location|e] we own in Västerbotten and the Lappmarks with [ShowCultureName('sapmi')] [pops|e] gains [ShowModifier('swe_sami_schools')] for 25 years and a few [ShowCultureName('sapmi')] priests."
 swe_lappmark.5.b: "Teach them in Swedish."
 swe_lappmark.5.b.entry: "Sámi schools taught in Swedish."
 swe_lappmark.5.b_tt: "Every [location|e] we own in Västerbotten and the Lappmarks with [ShowCultureName('sapmi')] [pops|e] gains [ShowModifier('swe_forsvenskning')] for 20 years."

 swe_lappmark.6.title: "The Silver Road"
 swe_lappmark.6.entry: "$swe_lappmark.6.title$"
 swe_lappmark.6.desc: "The silver in the mountains above [ShowLocationName('silbojock')] is worth nothing until it reaches the coast, and there is no road. $swe_lappmark.6.desc_draft$ One alternative is to hire carriers and pay what they ask. The other is to leave the silver in the mountain, and the north as quiet as it is."
 swe_lappmark.6.desc_open: "The mine in the mountains above [ShowLocationName('silbojock')] is already working, but its silver is worth nothing until it reaches the coast, and there is no road. $swe_lappmark.6.desc_draft$ The alternative is to hire carriers and pay what they ask."
 swe_lappmark.6.desc_draft: "The [ShowCultureName('sapmi')] have reindeer and sledges, and they know the country. Draft them, whole lappbyar if need be, and the silver will cost us next to nothing. But a family hauling ore cannot follow its herd, and many will slip away over the border."
 swe_lappmark.6.historical_info: "Mining at Nasafjäll began in 1635, with a smelter at Silbojock about 40 km away. The Sámi were forced to haul ore and supplies to and from the mine with their reindeer. A decree of 1640 moved the Lais, Gran and Tuorpon lappbyar to Arjeplog to provide more carriers. Since they could not herd at the same time, many grew poor, and many fled to Norway or the coast. From 1635 to 1659 the mines yielded about 860 kg of silver and 255 tonnes of lead. In 1659 Norwegian soldiers attacked and burned the churches and most of the buildings. The Lais and Gran Sámi asked to return to Lycksele only in 1777."
 swe_lappmark.6.a: "Draft the lappbyar."
 swe_lappmark.6.a.entry: "The Sámi were drafted to haul the silver."
 swe_lappmark.6.a_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('pite_lappmark_province')] gains [ShowModifier('swe_silver_road')] for 20 years."
 swe_lappmark.6.b: "Hire carriers."
 swe_lappmark.6.b.entry: "The Crown hired carriers for the silver."
 swe_lappmark.6.c: "Leave the silver in the mountain."
 swe_lappmark.6.c.entry: "The silver above Silbojock stayed in the mountain."

 swe_lappmark.7.title: "A Town at Torneå"
 swe_lappmark.7.entry: "$swe_lappmark.7.title$"
 swe_lappmark.7.desc: "The Crown wants a proper town at the mouth of the Torne, and our officials have chosen a site on the island of Seittenkari, away from the old trading place and the merchants who run it. The people here refuse to build there. If there must be a town, they say, it should stand on Suensaari, where the old trading place has always been. And they want the trade of the whole north to go with it."
 swe_lappmark.7.historical_info: "In 1585 Johan III planned a town at the mouth of the Torne River, but the land traders and above all the Birkarlar brought the plan down. In 1620 Gustav II Adolf ordered a town on the island of Seittenkari, as part of founding Umeå, Piteå and Luleå. The locals thought the site unsuitable, and it was never built. The charter of 12 May 1621 put the town on Suensaari instead, and gave its merchants the largest trading district in the realm: Kajanaland, the Torne valley, the Lapplands of Torne and Kemi, and a large part of northern Norway."
 swe_lappmark.7.a: "Build it where the Crown says."
 swe_lappmark.7.a.entry: "Torneå was built on the Crown's chosen site."
 swe_lappmark.7.b: "Suensaari it is, and give them the trade."
 swe_lappmark.7.b.entry: "Torneå was founded on Suensaari."

 STATIC_MODIFIER_NAME_swe_town_moved: "Rebuilt by the Water"
 STATIC_MODIFIER_DESC_swe_town_moved: "The town has been pulled down and built again nearer the sea. There is deep water at the quay once more, for now."
 STATIC_MODIFIER_NAME_swe_silted_harbour: "The Retreating Sea"
 STATIC_MODIFIER_DESC_swe_silted_harbour: "The land rises a little every year, and the quay stands further from the water each time anyone looks. Ships lie out in the bay and send their cargo in by boat."

 swe_lappmark.8.title: "The Receding Shore"
 swe_lappmark.8.entry: "$swe_lappmark.8.title$"
 swe_lappmark.8.desc: "[ShowLocationName('lulea')] and [ShowLocationName('pitea')] were built where the people of the coast already met, around the church and the market, and for a while that was good enough. The land here rises out of the sea, a little every year, and the water has been leaving ever since. Ships now lie out in the bay and send their cargo in by boat. We could order both towns pulled down and rebuilt nearer open water, at our cost and to the burghers' displeasure. Or they can stay where they are, with their church, their market and a longer walk to the sea every year."
 swe_lappmark.8.historical_info: "Gustav II Adolf chartered Luleå and Piteå in 1621, among several towns on the Gulf of Bothnia, and some were placed at an existing church or market rather than where ships could best reach them. The land there is still rising after the last ice age, by about a centimetre a year, and within a few decades sea traffic had become so difficult that Sundsvall, Luleå and Piteå were all moved nearer the sea. Luleå went about ten kilometres in 1649, although some of its people refused to leave, and the old site lives on as the church town of Gammelstad, now a World Heritage Site. At Piteå a great fire in July 1666 settled the matter: building began on Häggholmen in 1667, and the town moved there in 1668. In Hudiksvall the inner part of the town was simply abandoned."
 swe_lappmark.8.a: "Move the towns."
 swe_lappmark.8.a.entry: "Luleå and Piteå were moved nearer the sea."
 swe_lappmark.8.b: "Leave them where they are."
 swe_lappmark.8.b.entry: "Luleå and Piteå stayed where they were, while the sea did not."
 swe_lappmark.8.a_tt: "All [pops|e] in [ShowLocationName('lulea')] and [ShowLocationName('pitea')] lose 5% [pop_satisfaction|e]."
 swe_lappmark.8.b_tt: "All [pops|e] in [ShowLocationName('lulea')] and [ShowLocationName('pitea')] gain 5% [pop_satisfaction|e]."
