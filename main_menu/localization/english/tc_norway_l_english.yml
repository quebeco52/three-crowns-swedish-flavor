l_english:
 STATIC_MODIFIER_NAME_swe_finnmark_bailiffs: "The Crown's Bailiffs"
 STATIC_MODIFIER_DESC_swe_finnmark_bailiffs: "Our bailiffs travel the fjords each winter to collect the Crown's tax from the fishermen and the Sámi, and record who has paid and to whom."
 STATIC_MODIFIER_NAME_swe_finnmark_settlers: "Settlers on the Arctic Coast"
 STATIC_MODIFIER_DESC_swe_finnmark_settlers: "The Crown offers land and years free of tax to any who will settle and fish on this coast."
 STATIC_MODIFIER_NAME_swe_norwegian_law: "Norwegian Law and Assembly"
 STATIC_MODIFIER_DESC_swe_norwegian_law: "Norway keeps its own law and its own assembly, and the Crown's bailiffs answer to the customs of the country."

 swe_norway.2.title: "The Arctic Coast"
 swe_norway.2.entry: "$swe_norway.2.title$"
 swe_norway.2.desc: "Our flag flies over the coast of [ShowProvinceDefinitionName('finnmark_province')], where the fjords open on the Arctic Ocean and the fishing boats go out under the midnight sun. Every crown of the North has sent its men here to tax the Sámi, and the fish and furs of the coast would pay the Crown's bailiffs many times over. A tax-gatherer who comes once a year holds a coast less surely than people who live on it, though, and the Crown could instead offer land and years free of tax to settlers willing to go so far north. Few will go without them."
 swe_norway.2.historical_info: "From the middle of the 16th century Swedish bailiffs and the birkarlar, the traders of the Bothnian valleys, collected tax from the Sámi as far as the Arctic coast, in rivalry with Danish-Norwegian and Russian collectors. After Russia gave up its rights over the western Sámi at Teusina in 1595, Duke Karl claimed two-thirds of the Sámi tax between Malangen and the Varangerfjord, and a Danish inquiry of 1597 found the Sámi paying tax to Sweden along much of that coast. Christian IV sailed to Vardø in 1599 to show whose coast it was. At his coronation in 1607 Karl IX took the title of king of the Lapps in Nordland, and his claims to the coast helped bring on the Kalmar War. At Knäred in 1613 Sweden gave them up. Karl X Gustav revived the claim in 1658, to command the sea route to Archangel, but his negotiators had to give it up at Roskilde that February, and his efforts to win it back in the months that followed came to nothing. Inland, the Sámi of Kautokeino and Karasjok went on paying tax to more than one crown until the border treaty of 1751 gave the district to Norway. A codicil to the treaty let the Sámi go on crossing the new border with their reindeer."
 swe_norway.2.a: "Send the Crown's bailiffs north."
 swe_norway.2.a.entry: "Our bailiffs collected the tax of the Arctic coast."
 swe_norway.2.a_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('finnmark_province')] gains [ShowModifier('swe_finnmark_bailiffs')] for 20 years, and the peasant and tribal [pops|e] there lose 5% [pop_satisfaction|e]."
 swe_norway.2.b: "Settle the coast with our own people."
 swe_norway.2.b.entry: "Settlers were sent to the Arctic coast."
 swe_norway.2.b_tt: "Every coastal [location|e] we own in [ShowProvinceDefinitionName('finnmark_province')] gains [ShowModifier('swe_finnmark_settlers')] for 20 years."

 swe_norway.3.title: "The Crown of Norway"
 swe_norway.3.entry: "$swe_norway.3.title$"
 swe_norway.3.desc: "No king rules in Norway now but ours. In [ShowLocationName('nidaros')] the cathedral stands over Saint Olav's grave, and Norwegian kings have been crowned under its roof. If we go north and take the crown there, swearing to keep Norway's own law and assembly, the journey and the feast will cost us, and our bailiffs will have to consult the Norwegian lawmen before they do anything in the valleys. The farmers will remember that we asked. Or we can save ourselves the journey: send our own bailiffs, judge Norwegian suits by Swedish law, and govern [ShowLocationName('oslo')] and [ShowLocationName('bergen')] from [ShowLocationName('stockholm')] like any Swedish province. The Norwegians have lived under their own law for a long time, and they will not thank us for taking it."
 swe_norway.3.historical_info: "Magnus Eriksson inherited Norway in 1319, and in 1343 his younger son Håkan was named to succeed him there. After Kristofer of Bavaria died in 1448, Archbishop Aslak Bolt and part of the Norwegian council chose Karl Knutsson against Christian I of Denmark. Karl was crowned in Nidaros Cathedral on 20 November 1449, the last medieval coronation there, before his councillors gave up his claim to Norway at Halmstad in May 1450. In 1564, during the Northern Seven Years' War, Claude Collart took Trondheim and Steinvikholm Castle and sent home a helmet and spurs from Nidaros Cathedral that were hung in Storkyrkan as Saint Olav's, before Norwegian forces retook the province. The Treaty of Roskilde in February 1658 gave Sweden Trondhjems len again, and the Treaty of Copenhagen returned it in 1660. At Kiel in January 1814 Frederik VI ceded Norway to the King of Sweden, but the Norwegians adopted a constitution at Eidsvoll on 17 May and elected Christian Frederik as king. After a short campaign that summer, the Convention of Moss on 14 August 1814 ended the fighting on the promise that Norway would keep its constitution and its Storting in a union with Sweden. The Storting elected Karl XIII on 4 November 1814, and Karl XIV Johan was crowned King of Norway in Nidaros Cathedral on 7 September 1818."
 swe_norway.3.a: "Go north to [ShowLocationNameWithNoTooltip('nidaros')]."
 swe_norway.3.a.entry: "We took the crown of Norway at Nidaros and left the kingdom its own law."
 swe_norway.3.a_tt: "Every [location|e] we own in [ShowAreaName('syd_norge_area')] and [ShowAreaName('nord_norge_area')] except [ShowProvinceDefinitionName('jamtland_province')] and [ShowProvinceDefinitionName('bohus_province')] gains [ShowModifier('swe_norwegian_law')] for 50 years."
 swe_norway.3.b: "Govern Norway from [ShowLocationNameWithNoTooltip('stockholm')]."
 swe_norway.3.b.entry: "We governed Norway from Stockholm like any Swedish province."
 swe_norway.3.b_tt: "Every [location|e] we own in [ShowAreaName('syd_norge_area')] and [ShowAreaName('nord_norge_area')] except [ShowProvinceDefinitionName('jamtland_province')] and [ShowProvinceDefinitionName('bohus_province')] where [ShowCultureName('norwegian')] culture dominates gains [ShowModifier('swe_forsvenskning')] for 20 years."
 swe_norway.3.oslo_tt: "[ShowLocationName('oslo')] is held by us or one of our subjects."
 swe_norway.3.bergen_tt: "[ShowLocationName('bergen')] is held by us or one of our subjects."
 swe_norway.3.nidaros_tt: "[ShowLocationName('nidaros')] is held by us or one of our subjects."
 swe_norway.3.no_norwegian_crown_tt: "Norway no longer exists as a country."
