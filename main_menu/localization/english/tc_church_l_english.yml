l_english:
 swe_church.1.title: "The Uppsala Synod"
 swe_church.1.entry: "$swe_church.1.title$"
 swe_church.1.desc: "Our church broke with Rome long ago, but it has never declared what it believes. Each king has pulled it his own way, and many priests still follow a liturgy full of the old Catholic ceremonies. The [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] now ask to meet at [ShowLocationName('uppsala')] and settle the matter: one confession for the whole realm, the Confession of Augsburg, which every future king must swear to uphold."
 swe_church.1.desc_ruler: "Our church broke with Rome long ago, but it has never declared what it believes, and now [ROOT.GetCountry.GetGovernment.GetRuler.GetName] does not share our faith. The [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] fear for the church and ask to meet at [ShowLocationName('uppsala')]. They want one confession for the whole realm, the Confession of Augsburg, and they want the [ROOT.GetCountry.GetGovernment.GetRulerTitle] to swear to uphold it."
 swe_church.1.desc_heir: "Our church broke with Rome long ago, but it has never declared what it believes, and [ROOT.GetCountry.GetGovernment.GetHeir.GetName], the heir to the throne, does not share our faith. The [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] ask to meet at [ShowLocationName('uppsala')] while there is still time. They want one confession for the whole realm, the Confession of Augsburg, and no coronation until the heir has sworn to uphold it."
 swe_church.1.historical_info: "For decades after the break with Rome, the Swedish church had no formal confession. In 1576 John III introduced a new liturgy, the Red Book, which brought back many Catholic ceremonies, and his son and heir Sigismund was a Catholic and already King of Poland. After John's death, Duke Charles and the clergy called a church meeting at Uppsala in early 1593. It adopted the Augsburg Confession, rejected the Red Book, and required Sigismund to accept the decision before his coronation. As the meeting closed, its chairman Nicolaus Olai Bothniensis declared: 'Now Sweden has become one man, and we all have one Lord and God.'"
 swe_church.1.a: "One faith for the whole realm."
 swe_church.1.a.entry: "The church adopts the Augsburg Confession."
 swe_church.1.b: "Leave the church as it is."
 swe_church.1.b.entry: "The church stays without a confession."
 swe_church.1.b_tt: "We can still grant $swe_uppsala_mote$ later."

 swe_kyrkolagen_decision.title: "The Church Law"
 swe_kyrkolagen_decision.desc: "The bishops have drawn up a new church law for the whole realm. Every parish would keep a register of its people, and each year the priest would visit every household to test whether its members can read and know their catechism. The [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] grumble at the priest coming into their homes, but the [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] say that a people who can read the word of God for themselves will not easily be led astray."
 swe_kyrkolagen_decision.desc.entry: "A new church law could teach every Swede to read."
 swe_kyrkolagen_decision.historical_info: "The Church Law of 1686, issued under Charles XI, set out the order of the Swedish church in detail. It required everyone to learn to read, so that they could study the Bible and the catechism themselves, and parish priests checked their progress at yearly household examinations recorded in the parish registers. By the end of the 18th century most Swedes could read, though far fewer could write."
 swe_kyrkolagen_decision.a: "Every Swede shall learn to read."
 swe_kyrkolagen_decision.a_tt: "$swe_uppsala_mote$ gains a bonus to [literacy|e]."
 swe_kyrkolagen_country_bonus: "The following bonus comes from the Church Law:"
