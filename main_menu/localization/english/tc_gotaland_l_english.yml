l_english:
 STATIC_MODIFIER_NAME_swe_varend_border_peace: "The Border Peace"
 STATIC_MODIFIER_DESC_swe_varend_border_peace: "The peasants here have sworn peace with their neighbours across the border, whatever the kings do. The oxen and the salt keep moving, and the musters come up short."
 STATIC_MODIFIER_NAME_swe_border_peace_forbidden: "The Peace Forbidden"
 STATIC_MODIFIER_DESC_swe_border_peace_forbidden: "The Crown has forbidden any private peace with the far side of the border, and its bailiffs are watching the old trading paths."
 STATIC_MODIFIER_NAME_swe_sunnerbo_judge: "The Unwanted Judge"
 STATIC_MODIFIER_DESC_swe_sunnerbo_judge: "The Crown's choice sits as judge here, though the district wanted nothing to do with him and has kept him waiting for its law book."
 STATIC_MODIFIER_NAME_swe_sunnerbo_local_judge: "A Local Judge"
 STATIC_MODIFIER_DESC_swe_sunnerbo_local_judge: "The district chose a judge from among its own good men, and he judges from the law book it bought for itself."
 STATIC_MODIFIER_NAME_swe_oxen_ban: "The Oxen Ban"
 STATIC_MODIFIER_DESC_swe_oxen_ban: "The old cattle trade across the border is forbidden, and the Crown's bailiffs enforce it. The forest is full of angry men, and the bailiffs do not travel alone."
 STATIC_MODIFIER_NAME_swe_oxen_for_the_mines: "Småland Oxen for the Mines"
 STATIC_MODIFIER_DESC_swe_oxen_for_the_mines: "With the cattle of Småland forbidden to cross the border, the miners and smiths here eat well, and the work goes faster for it."
 STATIC_MODIFIER_NAME_swe_oxen_trade: "The Oxen Cross the Border"
 STATIC_MODIFIER_DESC_swe_oxen_trade: "The cattle still go south to their old buyers, and the Crown's bailiffs have little say in it."
 STATIC_MODIFIER_NAME_swe_knallar: "The Knallar"
 STATIC_MODIFIER_DESC_swe_knallar: "Farmers from this district walk the country with their packs twice a year, selling what their households have made."
 STATIC_MODIFIER_NAME_swe_town_monopoly_enforced: "The Town Monopoly"
 STATIC_MODIFIER_DESC_swe_town_monopoly_enforced: "The bailiffs stop peddlers on the roads and seize their packs, and the farmers wonder how they will pay this year's taxes."

 swe_gotaland.1.title: "Oxen Make Peace"
 swe_gotaland.1.entry: "$swe_gotaland.1.title$"
 swe_gotaland.1.desc: "The people of southern Småland and their neighbours in Blekinge have met at a ting and sworn peace with each other, whatever their kings may do. They need each other: the Smålanders buy their salt, herring and spices through [ShowLocationName('ronneby')], and Blekinge buys their beef and butter. If we let the peace stand, the trade will go on, and we may find these men slow to march when we call on them. If we forbid it, they may not listen."
 swe_gotaland.1.historical_info: "Border people in Småland and Blekinge made about ten such agreements between 1505 and 1525, because war disrupted their trade. A saying of the period ran 'Oxen mäklar fred', oxen broker peace. The first document to survive comes from the Hjortsberga landsting in August 1505. It covered Värend, Möre, Sunnerbo, Västbo, Blekinge and Göinge, and was confirmed in 1510. In 1506 the peasants of Värend cited their league and their trade when they asked Svante Nilsson to spare Ronneby, and he called off the attack. In 1505 Joakim Trolle was astonished to see Värend muster 1,000 men with crossbows, at one man per farm."
 swe_gotaland.1.a: "Let the peace stand."
 swe_gotaland.1.a.entry: "The border peace with Blekinge was left to stand."
 swe_gotaland.1.a_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('tioharad_province')] gains [ShowModifier('swe_varend_border_peace')] for 20 years."
 swe_gotaland.1.b: "Forbid it."
 swe_gotaland.1.b.entry: "The border peace with Blekinge was forbidden."
 swe_gotaland.1.b_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('tioharad_province')] gains [ShowModifier('swe_border_peace_forbidden')] for 10 years."

 swe_gotaland.2.title: "We Bought the Law Book"
 swe_gotaland.2.entry: "$swe_gotaland.2.title$"
 swe_gotaland.2.desc: "We have removed the judge of the district around [ShowLocationName('ljungby')] for refusing to answer our call to arms, and named a loyal nobleman in his place. The district has written back in fury. It will accept any other good local man, it says, but not this one. He will never get their law book: they bought it themselves, and they will not have him as judge. Our officials say a judge is ours to appoint. But it is hard to hold court without the book."
 swe_gotaland.2.historical_info: "In April 1507 the regent Svante Sture wrote to the people of Sunnerbo that their district judge, Olof Galle, had refused to come to Kalmar to help with the siege. He was removed, and the district was told to accept Knut Arvidsson of Toftaholm. Three months later Sunnerbo sent a protest, though Olof himself may have been behind it. It offered to let Svante choose among other good men of the district, but it wanted at all costs to be rid of Knut: 'faa aldrigh wora lagbok. Wi haffwm henne sielffue köpth, ok honum wiliom vii inthe haffwa til höreshöfdinge.' He will never get our law book. We bought it ourselves, and we will not have him as judge. Knut Arvidsson remained judge all the same."
 swe_gotaland.2.a: "The new judge stays."
 swe_gotaland.2.a.entry: "The new judge stayed, law book or no law book."
 swe_gotaland.2.b: "Let them choose a local man."
 swe_gotaland.2.b.entry: "The district chose a local man as judge."

 swe_gotaland.3.title: "The Oxen Ban"
 swe_gotaland.3.entry: "$swe_gotaland.3.title$"
 swe_gotaland.3.desc: "The miners and smiths of the mining country need meat, and the best cattle in the realm are being driven over the border to foreign buyers. A ban on exporting oxen from southern Småland would feed the mines and bring the border trade under the Crown's eye. But the Smålanders have traded over that border for as long as anyone remembers, and they already complain of the bailiffs and the taxes. In the forests around [ShowLocationName('vaxjo')], men are talking openly of a fight."
 swe_gotaland.3.historical_info: "Gustav Vasa's ban on exporting cattle to Denmark came with higher taxes, limits on the use of beech and oak forests, and the taking of church silver in 1541. Nils Dacke, a farmer from Vissefjärda who had killed a bailiff six years earlier, led the rising of 1542. His men crushed royal mercenaries with barricades at Kisa, and on 8 November 1542 the king agreed to a settlement. Dacke then ruled most of Småland except Kalmar and Jönköping, restored the old service and reopened the border trade. Royal forces won the decisive battle on the ice near Virserum in 1543, and that August Dacke was shot near the Blekinge border. His head was displayed on a pole, and no amnesty was given."
 swe_gotaland.3.a: "Enforce the ban."
 swe_gotaland.3.a.entry: "The Crown banned the export of oxen from Småland."
 swe_gotaland.3.a_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('tioharad_province')] gains [ShowModifier('swe_oxen_ban')] for 10 years, and the peasant [pops|e] there lose 15% [pop_satisfaction|e]."
 swe_gotaland.3.a_mines_tt: "Every iron and copper mine we own in [ShowProvinceDefinitionName('dalarna_province')] and [ShowProvinceDefinitionName('vastmanland_province')] gains [ShowModifier('swe_oxen_for_the_mines')] for 10 years."
 swe_gotaland.3.b: "Let the oxen cross."
 swe_gotaland.3.b.entry: "The oxen kept crossing the border."
 swe_gotaland.3.b_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('tioharad_province')] gains [ShowModifier('swe_oxen_trade')] for 25 years."

 swe_gotaland.4.title: "The Knallar"
 swe_gotaland.4.entry: "$swe_gotaland.4.title$"
 swe_gotaland.4.desc: "Twice a year the farmers around [ShowLocationName('skene')] and [ShowLocationName('bogesund')] load their packs with whatever their households have made and walk the country, selling it door to door. It is against the law, which keeps such trade for town merchants, and the burghers demand that it stop. The farmers say they could not pay their taxes otherwise. They have even begun to talk among themselves in a language of their own, so that nobody can tell what they are saying."
 swe_gotaland.4.historical_info: "From the mid-1500s, farmers in Sjuhäradsbygden in Västergötland began selling home-made goods door to door, although the law reserved this trade for town merchants. The region received special laws in the 1680s that allowed trade in the countryside, and from 1776 one person from each farm could travel to trade. At the peak around 1800, between 1,000 and 1,500 farmers a year took trade passes from the county government, usually making two trips a year through Sweden and into Norway. They developed a secret language, månsing, and some of its words entered Swedish slang. Freedom of trade came in 1864, and the peddling ended around 1900."
 swe_gotaland.4.a: "Let them trade."
 swe_gotaland.4.a.entry: "The knallar were left to trade."
 swe_gotaland.4.b: "Enforce the town monopoly."
 swe_gotaland.4.b.entry: "The peddlers were kept off the roads."

 STATIC_MODIFIER_NAME_swe_visby_staple: "All Trade Through Visby"
 STATIC_MODIFIER_DESC_swe_visby_staple: "Everything Gotland sells must now pass over Visby's quays, and its burghers take their share of every cargo."
 STATIC_MODIFIER_NAME_swe_gotland_harbours_closed: "Harbours Closed"
 STATIC_MODIFIER_DESC_swe_gotland_harbours_closed: "The rural harbours may not trade. The lime and timber must go to Visby or nowhere, and the letters of complaint go to the Crown."
 STATIC_MODIFIER_NAME_swe_gotland_harbours_open: "The Rural Harbours"
 STATIC_MODIFIER_DESC_swe_gotland_harbours_open: "The peasants of Gotland sell their lime and timber from their own shore to any skipper who calls."

 swe_gotaland.6.title: "The Rural Harbours"
 swe_gotaland.6.entry: "$swe_gotaland.6.title$"
 swe_gotaland.6.desc: "The burghers of [ShowLocationName('visby')] have asked for what burghers usually ask: all the trade of Gotland should pass through their town. At the rural harbours the island's peasants sell lime, timber and tar straight to foreign skippers, and much of it never comes near [ShowLocationName('visby')]. A ban would fill its quays and make the trade far easier to tax. It would also give every peasant on Gotland the same grievance, and these are people who have long known how to write to a king."
 swe_gotaland.6.historical_info: "Gotland's peasants traded for themselves, selling cattle, timber, tar, ironwork and limestone at rural harbours around the island or in their own boats across the Baltic. From the late 1400s the Danish crown tried to steer this trade through Visby, and it stayed a central quarrel throughout Danish rule. Sweden took the island in 1645 and tried the same thing at once: in 1646 trade at the rural harbours was banned so that all of it would pass through Visby. Three years later, after widespread complaints, the ban was lifted and the harbours reopened for heavy goods, above all lime and timber. The right to trade freely at the rural harbours comes up in every Gotland peasant petition the historian Jens Lerbom examined."
 swe_gotaland.6.a: "All trade goes through Visby."
 swe_gotaland.6.a.entry: "Trade at Gotland's rural harbours was banned."
 swe_gotaland.6.a_tt: "Every other [location|e] we own in [ShowProvinceDefinitionName('gotland_province')] gains [ShowModifier('swe_gotland_harbours_closed')] for 10 years, and the peasant [pops|e] there lose 10% [pop_satisfaction|e]."
 swe_gotaland.6.b: "Leave the harbours open."
 swe_gotaland.6.b.entry: "Gotland's rural harbours were left open."
 swe_gotaland.6.b_tt: "Every other [location|e] we own in [ShowProvinceDefinitionName('gotland_province')] gains [ShowModifier('swe_gotland_harbours_open')] for 10 years."

 STATIC_MODIFIER_NAME_swe_alingsas_manufaktur: "The Alingsås Manufactories"
 STATIC_MODIFIER_DESC_swe_alingsas_manufaktur: "Foreign weavers and the Swedes they train work here under royal privilege and on state money. A good deal of what they make is still in the warehouse."

 swe_gotaland.7.title: "The Consul's Proposal"
 swe_gotaland.7.entry: "$swe_gotaland.7.title$"
 swe_gotaland.7.desc: "A merchant who made his money in London has come home to [ShowLocationName('allingsas')] with a proposal. He has gathered tools and skilled workers abroad, though exporting either is strictly forbidden, and he wants to set them down in his home town to teach Swedes to make what we now buy from others. All he asks is privileges, and our money until the works can pay for themselves. That could take years, and nobody can promise that anyone will buy the cloth."
 swe_gotaland.7.historical_info: "Jonas Alströmer made his fortune in London and became Swedish consul there in 1722. He brought workers and tools home despite a strict ban on exporting them. The first shipment reached Alingsås on 1 November 1723, and his first privilege followed on 22 June 1724. With Fredrik I at their head, the official aristocracy and Stockholm's merchants were persuaded to buy shares. The works wove cloth, stockings and ribbon, among much else, and employed 875 people by 1746. The range was too scattered, and most of the output sat unsold. State loans and premiums carried them through a fire in 1749, and 413,600 daler silvermynt was eventually written off. When the privileges came up in 1765-66, renewal was refused, a decisive break with the old subsidy policy."
 swe_gotaland.7.a: "Give him his privileges."
 swe_gotaland.7.a.entry: "Manufactories were founded at Alingsås."
 swe_gotaland.7.b: "We can go on buying cloth."
 swe_gotaland.7.b.entry: "The consul's proposal was turned down."

 STATIC_MODIFIER_NAME_swe_marstrand_porto_franco: "Porto Franco"
 STATIC_MODIFIER_DESC_swe_marstrand_porto_franco: "Ships of every flag trade off Marstrand untaxed, and men of every faith and several bad debts live there unmolested. Whatever reaches the mainland pays in full, at least when someone sees it go."

 swe_gotaland.8.title: "Marstrand"
 swe_gotaland.8.entry: "$swe_gotaland.8.title$"
 swe_gotaland.8.desc: "The herring have made the coast of Bohuslän rich, and the island of Marstrand, off [ShowLocationName('konghalla')], has one of the best harbours on it. There is a proposal to declare the island a free port. Nothing landed there would pay duty until it left for the mainland, anyone could worship there as they please, and no one fleeing the law would be handed over unless his crime touched honour or life. Foreign ships would come to us. So would smugglers, and most of the money would stay in the pockets of those who made it. The customs house we have now, at least, pays."
 swe_gotaland.8.historical_info: "The herring boom of the mid-18th century made Marstrand a centre of the trade. On 15 August 1775, at Ekolsund, Gustav III declared it a free port: trade inside it was free and untaxed, goods leaving for the mainland paid the same tolls as foreign imports, its people had complete religious freedom, and fugitives were protected unless their crimes touched honour or life. A Jewish congregation formed there and built the first synagogue in Sweden. Smuggling was widespread and hard to stop, and most of the income went into private hands. The burghers themselves asked for the rights to be withdrawn, and the regency of Gustav IV Adolf ended the free port by decree on 15 May 1794. The herring boom had faded by 1808."
 swe_gotaland.8.a: "Declare it a free port."
 swe_gotaland.8.a.entry: "Marstrand was declared a free port."
 swe_gotaland.8.b: "Keep the customs."
 swe_gotaland.8.b.entry: "Marstrand was refused a free port."

 STATIC_MODIFIER_NAME_swe_kvarnholmen: "Kvarnholmen"
 STATIC_MODIFIER_DESC_swe_kvarnholmen: "Kalmar stands on the island of Kvarnholmen now, behind bastions in the Dutch manner, with its quays on open water and the castle left to look after itself."

 swe_gotaland.9.title: "The Fire at Kalmar"
 swe_gotaland.9.entry: "$swe_gotaland.9.title$"
 swe_gotaland.9.desc: "A fire that started in a cooper's yard before dawn has burned about three quarters of [ShowLocationName('kalmar')]. The great church has lost its roof and its bells, and the town hall, the school, the hospital and the customs house are damaged or gone. The council of the realm has long wanted the town moved to the island of Kvarnholmen, where it could be walled in the modern manner, no longer crowd the castle in a siege, and give its ships better water. The burghers have found reasons to stay for just as long, and they are already putting up sheds in the ashes to see them through the winter. If we hold them to the island now, they will have to build a whole town from nothing, with money and labourers they do not have. If we let them rebuild, they will do it on their old plots, over their old cellars, and the town will crowd the castle as before."
 swe_gotaland.9.historical_info: "After the Kalmar War of 1611-13, Gustav II Adolf had a Flemish engineer, Andreas Sersanders, draw Kalmar anew as a fortress town on a radial plan, though it is unclear how much of it was ever built. In 1640 the council of the realm decided to move the town to Kvarnholmen instead, an idea of Axel Oxenstierna's, but the burghers held back, and the move only began after the fire of 9 September 1647. Even then it went slowly, for want of labourers and money. Johan Wärnschiöldh laid out the new town on a grid in 1651, and in 1657, with 95 houses standing, the burghers were ordered to move at once. The medieval walls of the old town were pulled down and carried across to build the new bastions, and the old town lay almost empty for the next hundred years."
 swe_gotaland.9.a: "Hold them to the island."
 swe_gotaland.9.a.entry: "Kalmar was moved to Kvarnholmen."
 swe_gotaland.9.a_tt: "The burgher [pops|e] of [ShowLocationName('kalmar')] lose 5% [pop_satisfaction|e]."
 swe_gotaland.9.b: "Let them rebuild where they stood."
 swe_gotaland.9.b.entry: "Kalmar was rebuilt on its old site."
 swe_gotaland.9.b_tt: "The burgher [pops|e] of [ShowLocationName('kalmar')] gain 5% [pop_satisfaction|e]."

 swe_kalmar_domkyrka: "Kalmar domkyrka"
 swe_kalmar_domkyrka_desc: "A great baroque church in the new town of Kalmar on Kvarnholmen, built to designs by Nicodemus Tessin the Elder."

 swe_gotaland.10.title: "A Church for Kalmar"
 swe_gotaland.10.entry: "$swe_gotaland.10.title$"
 swe_gotaland.10.desc: "The new town on Kvarnholmen has its streets, its squares and its bastions, but no church. Every Sunday its people go out through the gate to the old one, patched up after the fire and standing almost alone in the empty old town. Tessin, the court architect, has drawn a church for the new town after the churches of Italy and France, grand enough to be a cathedral, and it would take many years and a great deal of money to build. The [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] would have [ShowLocationName('kalmar')] honour God as handsomely as it now defends itself. The old church still has its walls, however, and the walk is not far."
 swe_gotaland.10.historical_info: "The new church on Kvarnholmen was begun in 1660 to designs by Nicodemus Tessin the Elder, who took his models from Italy and France. Kalmar had had a superintendent of its own since 1603, and on 5 April 1678 Karl XI made it a diocese, covering about half of mainland Kalmar county and all of Öland. The same year, fearing another siege of the castle in the Scanian War, the Swedes blew up the old church, which had served for some thirty years after the fire. The new one was consecrated half-finished in 1682 and completed in 1703. It was begun under one Karl, consecrated under a second and finished under a third."
 swe_gotaland.10.a: "Send for Tessin."
 swe_gotaland.10.a.entry: "Kalmar's new church was built to Tessin's designs."
 swe_gotaland.10.b: "The old church survived the fire."
 swe_gotaland.10.b.entry: "Kalmar kept its old church."
