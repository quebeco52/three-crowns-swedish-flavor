l_english:
 STATIC_MODIFIER_NAME_swe_varend_border_peace: "The Border Peace"
 STATIC_MODIFIER_DESC_swe_varend_border_peace: "The peasants here have sworn peace with their neighbours across the border, whatever the kings do. The oxen and the salt keep moving, and the musters come up short."
 STATIC_MODIFIER_NAME_swe_border_peace_forbidden: "The Peace Forbidden"
 STATIC_MODIFIER_DESC_swe_border_peace_forbidden: "The Crown has forbidden any private peace with the far side of the border, and its bailiffs are watching the old trading paths."
 STATIC_MODIFIER_NAME_swe_sunnerbo_judge: "The Unwanted Judge"
 STATIC_MODIFIER_DESC_swe_sunnerbo_judge: "The Crown's choice sits as judge here, though the district wanted nothing to do with him and has kept him waiting for its law book."
 STATIC_MODIFIER_NAME_swe_sunnerbo_local_judge: "A Local Judge"
 STATIC_MODIFIER_DESC_swe_sunnerbo_local_judge: "The district chose a judge from among its own good men, and he judges from the law book it bought for itself."
 STATIC_MODIFIER_NAME_swe_oxen_ban: "The Oxen Ban"
 STATIC_MODIFIER_DESC_swe_oxen_ban: "The old cattle trade across the border is forbidden, and the Crown's bailiffs enforce it. The forest is full of angry men, and the bailiffs do not travel alone."
 STATIC_MODIFIER_NAME_swe_oxen_for_the_mines: "Småland Oxen for the Mines"
 STATIC_MODIFIER_DESC_swe_oxen_for_the_mines: "With the cattle of Småland forbidden to cross the border, the miners and smiths here eat well, and the work goes faster for it."
 STATIC_MODIFIER_NAME_swe_oxen_trade: "The Oxen Cross the Border"
 STATIC_MODIFIER_DESC_swe_oxen_trade: "The cattle still go south to their old buyers, and the Crown's bailiffs have little say in it."
 STATIC_MODIFIER_NAME_swe_knallar: "The Knallar"
 STATIC_MODIFIER_DESC_swe_knallar: "Farmers from this district walk the country twice a year with packs of home-made goods, and nobody stops them."
 STATIC_MODIFIER_NAME_swe_town_monopoly_enforced: "The Town Monopoly"
 STATIC_MODIFIER_DESC_swe_town_monopoly_enforced: "The bailiffs stop peddlers on the roads and seize their packs, and the farmers wonder how they will pay this year's taxes."

 swe_gotaland.1.title: "Oxen Make Peace"
 swe_gotaland.1.entry: "$swe_gotaland.1.title$"
 swe_gotaland.1.desc: "The people of southern Småland and their neighbours in Blekinge have met at a ting and sworn peace with each other, whatever their kings may do. They need each other: the Smålanders buy their salt, herring and spices through [ShowLocationName('ronneby')], and Blekinge buys their beef and butter. If we let the peace stand, the trade will go on, and we may find these men slow to march when we call on them. If we forbid it, they may not listen."
 swe_gotaland.1.historical_info: "Border people in Småland and Blekinge made about ten such agreements between 1505 and 1525, because war disrupted their trade. A saying of the period ran 'Oxen mäklar fred', oxen broker peace. The first document to survive comes from the Hjortsberga landsting in August 1505. It covered Värend, Möre, Sunnerbo, Västbo, Blekinge and Göinge, and was confirmed in 1510. In 1506 the peasants of Värend cited their league and their trade when they asked Svante Nilsson to spare Ronneby, and he called off the attack. In 1505 Joakim Trolle was astonished to see Värend muster 1,000 men with crossbows, at one man per farm."
 swe_gotaland.1.a: "Let the peace stand."
 swe_gotaland.1.a.entry: "The border peace with Blekinge was left to stand."
 swe_gotaland.1.a_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('tioharad_province')] gains [ShowModifier('swe_varend_border_peace')] for 20 years."
 swe_gotaland.1.b: "Forbid it."
 swe_gotaland.1.b.entry: "The border peace with Blekinge was forbidden."
 swe_gotaland.1.b_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('tioharad_province')] gains [ShowModifier('swe_border_peace_forbidden')] for 10 years."

 swe_gotaland.2.title: "We Bought the Law Book"
 swe_gotaland.2.entry: "$swe_gotaland.2.title$"
 swe_gotaland.2.desc: "We have removed the judge of the district around [ShowLocationName('ljungby')] for refusing to answer our call to arms, and named a loyal nobleman in his place. The district has written back in fury. It will accept any other good local man, it says, but not this one, and he is not to have the law book it paid for out of its own pocket. A judge is ours to appoint. But a court is hard to hold without its law book."
 swe_gotaland.2.historical_info: "In April 1507 the regent Svante Nilsson wrote to the people of Sunnerbo that their district judge, Olof Galle, had refused to come to Kalmar to help with the siege. He was removed, and the district was told to accept Knut Arvidsson of Toftaholm. Three months later Sunnerbo sent a protest, though Olof himself may have been behind it. It offered to let Svante choose among other good men of the district, but it wanted at all costs to be rid of Knut: 'faa aldrigh wora lagbok. Wi haffwm henne sielffue köpth, ok honum wiliom vii inthe haffwa til höreshöfdinge.' He will never get our law book. We bought it ourselves, and we will not have him as judge. Knut Arvidsson stayed on as judge."
 swe_gotaland.2.a: "The new judge stays."
 swe_gotaland.2.a.entry: "The new judge stayed, law book or no law book."
 swe_gotaland.2.b: "Let them choose a local man."
 swe_gotaland.2.b.entry: "The district chose a local man as judge."

 swe_gotaland.3.title: "The Oxen Ban"
 swe_gotaland.3.entry: "$swe_gotaland.3.title$"
 swe_gotaland.3.desc: "The miners and smiths of the mining country need meat, and the best cattle in the realm are being driven over the border to foreign buyers. A ban on exporting oxen from southern Småland would feed the mines and bring the border trade under the Crown's eye. But the Smålanders have traded over that border for as long as anyone remembers, and they already complain of the bailiffs and the taxes. In the forests around [ShowLocationName('vaxjo')], men are talking openly of a fight."
 swe_gotaland.3.historical_info: "Gustav Vasa's ban on exporting cattle to Denmark came with higher taxes, limits on the use of beech and oak forests, and the taking of church silver in 1541. Nils Dacke, a farmer from Vissefjärda who had killed a bailiff six years earlier, led the rising of 1542. His men crushed royal mercenaries with barricades at Kisa, and on 8 November 1542 the king agreed to a settlement. Dacke then ruled most of Småland except Kalmar and Jönköping, restored the old service and reopened the border trade. Royal forces won the decisive battle on the ice near Virserum in 1543, and that August Dacke was shot near the Blekinge border. His head was displayed on a pole, and no amnesty was given."
 swe_gotaland.3.a: "Enforce the ban."
 swe_gotaland.3.a.entry: "The Crown banned the export of oxen from Småland."
 swe_gotaland.3.a_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('tioharad_province')] gains [ShowModifier('swe_oxen_ban')] for 10 years, and the peasant [pops|e] there lose 10% [pop_satisfaction|e]."
 swe_gotaland.3.a_mines_tt: "Every iron and copper mine we own in [ShowProvinceDefinitionName('dalarna_province')] and [ShowProvinceDefinitionName('vastmanland_province')] gains [ShowModifier('swe_oxen_for_the_mines')] for 10 years."
 swe_gotaland.3.b: "Let the oxen cross."
 swe_gotaland.3.b.entry: "The oxen kept crossing the border."
 swe_gotaland.3.b_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('tioharad_province')] gains [ShowModifier('swe_oxen_trade')] for 20 years."

 swe_gotaland.4.title: "The Knallar"
 swe_gotaland.4.entry: "$swe_gotaland.4.title$"
 swe_gotaland.4.desc: "Twice a year the farmers around [ShowLocationName('skene')] and [ShowLocationName('bogesund')] load their packs with whatever their households have made and walk the country, selling it door to door. It is against the law, which keeps such trade for town merchants, and none of their goods pay customs anywhere. The burghers demand that it stop. The farmers say they could not pay their taxes otherwise. They have even begun to talk among themselves in a language of their own, so that nobody can tell what they are saying."
 swe_gotaland.4.historical_info: "From the mid-1500s, farmers in Sjuhäradsbygden in Västergötland began selling home-made goods door to door, although the law reserved this trade for town merchants. The region received special laws in the 1680s that allowed trade in the countryside, and from 1776 one person from each farm could travel to trade. At the peak around 1800, between 1,000 and 1,500 farmers a year took trade passes from the county government, usually making two trips a year through Sweden and into Norway. They developed a secret language, månsing, and some of its words entered Swedish slang. Freedom of trade came in 1864, and the peddling ended around 1900."
 swe_gotaland.4.a: "Let them trade."
 swe_gotaland.4.a.entry: "The knallar were left to trade."
 swe_gotaland.4.b: "Enforce the town monopoly."
 swe_gotaland.4.b.entry: "The peddlers were kept off the roads."
 swe_gotaland.4.a_tt: "The peasant [pops|e] in every [location|e] we own in [ShowProvinceDefinitionName('vastergotland_province')] gain 10% [pop_satisfaction|e], and the burgher [pops|e] there lose 5%."
 swe_gotaland.4.b_tt: "The burgher [pops|e] in every [location|e] we own in [ShowProvinceDefinitionName('vastergotland_province')] gain 10% [pop_satisfaction|e]."

 STATIC_MODIFIER_NAME_swe_visby_staple: "All Trade Through Visby"
 STATIC_MODIFIER_DESC_swe_visby_staple: "Everything Gotland sells must now pass over Visby's quays, and its burghers take their share of every cargo."
 STATIC_MODIFIER_NAME_swe_gotland_harbours_closed: "Harbours Closed"
 STATIC_MODIFIER_DESC_swe_gotland_harbours_closed: "The rural harbours may not trade. The lime and timber must go to Visby or nowhere, and the letters of complaint go to the Crown."
 STATIC_MODIFIER_NAME_swe_gotland_harbours_open: "The Rural Harbours"
 STATIC_MODIFIER_DESC_swe_gotland_harbours_open: "The peasants of Gotland sell their lime and timber from their own shore to any skipper who calls."

 swe_gotaland.6.title: "The Rural Harbours"
 swe_gotaland.6.entry: "$swe_gotaland.6.title$"
 swe_gotaland.6.desc: "The burghers of [ShowLocationName('visby')] have asked for what burghers usually ask: all the trade of Gotland should pass through their town. At the rural harbours the island's peasants sell lime, timber and tar straight to foreign skippers, and much of it never comes near [ShowLocationNameWithNoTooltip('visby')]. A ban would fill its quays and make the trade far easier to tax. It would also give every peasant on Gotland the same grievance, and these are people who have long known how to write to a king."
 swe_gotaland.6.historical_info: "Gotland's peasants traded for themselves, selling cattle, timber, tar, ironwork and limestone at rural harbours around the island or in their own boats across the Baltic. From the late 1400s the Danish crown tried to steer this trade through Visby, and it stayed a central quarrel throughout Danish rule. Sweden took the island in 1645 and tried the same thing at once: in 1646 trade at the rural harbours was banned so that all of it would pass through Visby. Three years later, after widespread complaints, the ban was lifted and the harbours reopened for heavy goods, above all lime and timber. The right to trade freely at the rural harbours comes up in every Gotland peasant petition the historian Jens Lerbom examined."
 swe_gotaland.6.a: "All trade goes through Visby."
 swe_gotaland.6.a.entry: "Trade at Gotland's rural harbours was banned."
 swe_gotaland.6.a_tt: "Every other [location|e] we own in [ShowProvinceDefinitionName('gotland_province')] gains [ShowModifier('swe_gotland_harbours_closed')] for 10 years, and the peasant [pops|e] there lose 10% [pop_satisfaction|e]."
 swe_gotaland.6.b: "Leave the harbours open."
 swe_gotaland.6.b.entry: "Gotland's rural harbours were left open."
 swe_gotaland.6.b_tt: "Every other [location|e] we own in [ShowProvinceDefinitionName('gotland_province')] gains [ShowModifier('swe_gotland_harbours_open')] for 10 years."
 swe_gotaland.6.a_visby_tt: "The burgher [pops|e] of [ShowLocationName('visby')] gain 10% [pop_satisfaction|e]."
 swe_gotaland.6.b_visby_tt: "The burgher [pops|e] of [ShowLocationName('visby')] lose 5% [pop_satisfaction|e]."

 STATIC_MODIFIER_NAME_swe_alingsas_manufaktur: "The Alingsås Manufactories"
 STATIC_MODIFIER_DESC_swe_alingsas_manufaktur: "Foreign weavers and the Swedes they train work here under royal privilege and on state money. A good deal of what they make is still in the warehouse."

 swe_gotaland.7.title: "The Consul's Proposal"
 swe_gotaland.7.entry: "$swe_gotaland.7.title$"
 swe_gotaland.7.desc: "A merchant who made his money in London has come home to [ShowLocationName('allingsas')] with a proposal. He has gathered tools and skilled workers abroad, though exporting either is strictly forbidden, and he wants to set them down in his home town to teach Swedes to make what we now buy from others. All he asks is privileges, and our money until the works can pay for themselves. That could take years, and nobody can promise that anyone will buy the cloth."
 swe_gotaland.7.historical_info: "Jonas Alströmer made his fortune in London and became Swedish consul there in 1722. He brought workers and tools home despite a strict ban on exporting them. The first shipment reached Alingsås on 1 November 1723, and his first privilege followed on 22 June 1724. With Fredrik I at their head, the official aristocracy and Stockholm's merchants were persuaded to buy shares. The works wove cloth, stockings and ribbon, among much else, and employed 875 people by 1746. The range was too scattered, and most of the output sat unsold. State loans and premiums carried them through a fire in 1749, and 413,600 daler silvermynt was eventually written off. When the privileges came up in 1765-66, renewal was refused, a decisive break with the old subsidy policy."
 swe_gotaland.7.a: "Give him his privileges."
 swe_gotaland.7.a.entry: "Manufactories were founded at Alingsås."
 swe_gotaland.7.b: "We can go on buying cloth."
 swe_gotaland.7.b.entry: "The consul's proposal was turned down."

 STATIC_MODIFIER_NAME_swe_marstrand_porto_franco: "Porto Franco"
 STATIC_MODIFIER_DESC_swe_marstrand_porto_franco: "Ships of every flag trade off Marstrand untaxed, and men of every faith and several bad debts live there unmolested. Whatever reaches the mainland pays in full, at least when someone sees it go."

 swe_gotaland.8.title: "Marstrand"
 swe_gotaland.8.entry: "$swe_gotaland.8.title$"
 swe_gotaland.8.desc: "The herring have made the coast of Bohuslän rich, and the island of Marstrand, off [ShowLocationName('konghalla')], has one of the best harbours on it. The island could be declared a free port. Nothing landed there would pay duty until it left for the mainland, anyone could worship there as they please, and no one fleeing the law would be handed over unless his crime touched honour or life. Foreign ships would come to us. So would smugglers, and most of the money would stay in the pockets of those who made it. The customs house we have now, at least, pays."
 swe_gotaland.8.historical_info: "The herring boom of the mid-18th century made Marstrand a centre of the trade. On 15 August 1775, at Ekolsund, Gustav III declared it a free port: trade inside it was free and untaxed, goods leaving for the mainland paid the same tolls as foreign imports, its people had complete religious freedom, and fugitives were protected unless their crimes touched honour or life. A Jewish congregation formed there and built the first synagogue in Sweden. Smuggling was widespread and hard to stop, and most of the income went into private hands. The burghers themselves asked for the rights to be withdrawn, and the regency of Gustav IV Adolf ended the free port by decree on 15 May 1794. The herring boom had faded by 1808."
 swe_gotaland.8.a: "Declare it a free port."
 swe_gotaland.8.a.entry: "Marstrand was declared a free port."
 swe_gotaland.8.b: "Keep the customs."
 swe_gotaland.8.b.entry: "Marstrand was refused a free port."

 STATIC_MODIFIER_NAME_swe_kvarnholmen: "Kvarnholmen"
 STATIC_MODIFIER_DESC_swe_kvarnholmen: "Kalmar stands on the island of Kvarnholmen now, behind bastions in the Dutch manner, with its quays on open water and the castle left to look after itself."

 swe_gotaland.9.title: "The Fire at Kalmar"
 swe_gotaland.9.entry: "$swe_gotaland.9.title$"
 swe_gotaland.9.desc: "A fire that started in a cooper's yard before dawn has burned about three quarters of [ShowLocationName('kalmar')]. The great church has lost its roof and its bells, and most of the town's public buildings are damaged or gone. The council of the realm has long wanted the town moved to the island of Kvarnholmen, where it could be walled in the modern manner, no longer crowd the castle in a siege, and give its ships better water. The burghers have found reasons to stay for just as long, and they are already putting up sheds in the ashes to see them through the winter. If we hold them to the island now, they will have to build a whole town from nothing, with money and labourers they do not have. If we let them rebuild, they will do it on their old plots, over their old cellars, and the town will crowd the castle as before."
 swe_gotaland.9.historical_info: "After the Kalmar War of 1611-13, Gustav II Adolf had a Flemish engineer, Andreas Sersanders, draw Kalmar anew as a fortress town on a radial plan, though it is unclear how much of it was ever built. In 1640 the council of the realm decided to move the town to Kvarnholmen instead, an idea of Axel Oxenstierna's, but the burghers held back, and the move only began after the fire of 9 September 1647. Even then it went slowly, for want of labourers and money. Johan Wärnschiöldh laid out the new town on a grid in 1651, and in 1657, with 95 houses standing, the burghers were ordered to move at once. The medieval walls of the old town were pulled down and carried across to build the new bastions, and the old town lay almost empty for the next hundred years."
 swe_gotaland.9.a: "Hold them to the island."
 swe_gotaland.9.a.entry: "Kalmar was moved to Kvarnholmen."
 swe_gotaland.9.a_tt: "The burgher [pops|e] of [ShowLocationName('kalmar')] lose 5% [pop_satisfaction|e]."
 swe_gotaland.9.b: "Let them rebuild where they stood."
 swe_gotaland.9.b.entry: "Kalmar was rebuilt on its old site."
 swe_gotaland.9.b_tt: "The burgher [pops|e] of [ShowLocationName('kalmar')] gain 5% [pop_satisfaction|e]."

 swe_kalmar_domkyrka: "Kalmar domkyrka"
 swe_kalmar_domkyrka_desc: "A great baroque church in the new town of Kalmar on Kvarnholmen, built to designs by Nicodemus Tessin the Elder."

 swe_gotaland.10.title: "A Church for Kalmar"
 swe_gotaland.10.entry: "$swe_gotaland.10.title$"
 swe_gotaland.10.desc: "The new town on Kvarnholmen has its streets, its squares and its bastions, but no church. Every Sunday its people go out through the gate to the old one, patched up after the fire and standing almost alone in the empty old town. The court architect has drawn a church for the new town after the churches of Italy and France, grand enough to be a cathedral, and it would take many years and a great deal of money to build. The [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] would have [ShowLocationName('kalmar')] honour God as handsomely as it now defends itself. The old church still has its walls, and the walk is not far."
 swe_gotaland.10.historical_info: "The new church on Kvarnholmen was begun in 1660 to designs by Nicodemus Tessin the Elder, who took his models from Italy and France. Kalmar had had a superintendent of its own since 1603, and on 5 April 1678 Karl XI made it a diocese, covering about half of mainland Kalmar county and all of Öland. The same year, fearing another siege of the castle in the Scanian War, the Swedes blew up the old church, which had served for some thirty years after the fire. The new one was consecrated half-finished in 1682 and completed in 1703. It was begun under one Karl, consecrated under a second and finished under a third."
 swe_gotaland.10.a: "Build the new church."
 swe_gotaland.10.a.entry: "A great new church was begun on Kvarnholmen."
 swe_gotaland.10.b: "The old church will serve."
 swe_gotaland.10.b.entry: "Kalmar kept its old church."

 STATIC_MODIFIER_NAME_swe_western_gate: "The Gate to the West"
 STATIC_MODIFIER_DESC_swe_western_gate: "The realm's only harbour on the western sea. What Västergötland has to sell is loaded here for the Hanseatic towns."
 STATIC_MODIFIER_NAME_swe_nya_lodose: "Nya Lödöse"
 STATIC_MODIFIER_DESC_swe_nya_lodose: "The town at the mouth of the Göta älv, below the toll at Bohus. Ships from the western sea come straight to its quays."
 STATIC_MODIFIER_NAME_swe_bohus_toll: "The Toll at Bohus"
 STATIC_MODIFIER_DESC_swe_bohus_toll: "Every cargo bound for the town first pays a toll under a foreign castle downstream."

 swe_gotaland.11.title: "The Toll at Bohus"
 swe_gotaland.11.entry: "$swe_gotaland.11.title$"
 swe_gotaland.11.desc: "[ShowLocationName('lodose')] is our only gate to the western sea, and every ship bound for it must first pass under Bohus, a foreign castle that has begun to take a toll on whatever goes up or down the river. The town could be moved downstream, below the toll, to the mouth of the Säveån in [ShowLocationName('utlandet')]. That means building a new town on wet ground, and ordering the burghers to leave the one they have. They would rather not. Their houses, churches and quays stand where they are, and their privileges in the Hanseatic towns were granted to Lödöse, not to a new town on a marsh."
 swe_gotaland.11.historical_info: "Lödöse on the Göta älv was Sweden's only port to the west, and at its height, between about 1250 and 1350, it had some 2,000 inhabitants. In the 1450s the Norwegians and Danes began to take a toll at Bohus fortress and so controlled the traffic to the town. In 1473 Sten Sture the Elder decided to move it some forty kilometres downstream to the mouth of the Säveån, in what is now Göteborg, and privileges were issued on 17 August. The first site, the island of Säveholmen, proved too marshy, so the town was built on both banks of the stream. It was to be called Götaholm, but the burghers asked to keep the old name, so that they might enjoy the privileges in the Hanseatic towns that old Lödöse had enjoyed, and it became Nya Lödöse. The new site also drew the trade of Sjuhärad, which otherwise went out through Danish Halland, and by the end of the century the town was counted among the realm's four leading trading towns, with Stockholm, Åbo and Söderköping. Many burghers stayed in old Lödöse all the same and went on trading there. In 1624 the burghers of Nya Lödöse were ordered to move again, to the newly founded Göteborg."
 swe_gotaland.11.a: "Build the town at the river mouth."
 swe_gotaland.11.a.entry: "Lödöse was moved downstream as Nya Lödöse."
 swe_gotaland.11.b: "Lödöse stays where it is."
 swe_gotaland.11.b.entry: "Lödöse stayed above the toll."

 STATIC_MODIFIER_NAME_swe_forfeited_estates: "Forfeited Estates"
 STATIC_MODIFIER_DESC_swe_forfeited_estates: "The lands of the condemned lords have fallen to the Crown, and their neighbours have taken note."

 swe_gotaland.12.title: "The Lords at Larv"
 swe_gotaland.12.entry: "$swe_gotaland.12.title$"
 swe_gotaland.12.desc: "In the parsonage at Larv the lords of Västergötland renounced their oath to us, with the Bishop of [ShowLocationName('skara')] among them, and called the province out against the new teaching. The province did not come. Its peasants met at Broddetorp and would not follow them, and the leaders have fled the realm. The councillors who stayed behind protest their loyalty and ask to be heard by the estates. We hold the letters they sent one another. A court would take their heads and their lands. The lords of the realm would learn what a broken oath costs, and would not thank us for the lesson. Fines and a new oath would fill the treasury instead, and one mother has already come to beg for her son's life."
 swe_gotaland.12.historical_info: "In the spring of 1529 Ture Jönsson (Tre Rosor), steward of the realm, and Bishop Magnus Haraldsson of Skara raised Västergötland against Gustav Vasa, to depose him and stop the Reformation. At the parsonage of Larv on 20 April the lords renounced their allegiance, and a thousand peasants held the pass at Hova in Tiveden. But at Broddetorp on 25 April the peasants of the province refused to follow the lords, and the king remitted taxes and promised that the commons would keep their old customs. Ture Jönsson and the bishop fled to Denmark. In June a court of the estates at Strängnäs was shown the letters the lords had exchanged, and it sentenced the councillors Måns Bryntesson (Lilliehöök) and Nils Olofsson (Vinge) to lose life and property. Måns was beheaded on Stortorget in Stockholm on 5 July. Ture Eriksson (Bielke) was spared when his mother begged for his life, and paid a fine instead. Others were fined too, among them the peasant who had led the commons at Hova, who paid twenty oxen, and the lords of Västergötland swore a new oath."
 swe_gotaland.12.a: "Their heads and their lands."
 swe_gotaland.12.a.entry: "The councillors of Västergötland lost their heads and their lands."
 swe_gotaland.12.a_tt: "Every [location|e] we own in [ShowProvinceDefinitionName('vastergotland_province')] gains [ShowModifier('swe_forfeited_estates')] for 20 years."
 swe_gotaland.12.b: "Fines, and a new oath."
 swe_gotaland.12.b.entry: "The lords of Västergötland paid fines and swore again."

 STATIC_MODIFIER_NAME_swe_vaxjo_bishops_town: "The Bishop's Town"
 STATIC_MODIFIER_DESC_swe_vaxjo_bishops_town: "The town belongs to its bishop. He takes the fines for trading in the countryside and shares them with his cathedral."
 STATIC_MODIFIER_NAME_swe_vaxjo_bailiff: "The Crown's Fines"
 STATIC_MODIFIER_DESC_swe_vaxjo_bailiff: "A bailiff of ours sits in the bishop's town and collects the Crown's fines from those who trade in the countryside."

 swe_gotaland.13.title: "A Town for the Bishop"
 swe_gotaland.13.entry: "$swe_gotaland.13.title$"
 swe_gotaland.13.desc: "Every bishop in the realm has his seat in a town except the Bishop of [ShowLocationName('vaxjo')], who keeps his cathedral among the farms of Värend. The trade of the district is done at country fairs, and its craftsmen live wherever they please. The bishop asks us to make Växjö a town, with all the trade of the district held there and its craftsmen settled in it. He also asks for the fines that would enforce it, to share with his cathedral's building fund. Such fines are ours by right, and in our other towns a bailiff of ours collects them, though until there is a town here there is nothing to fine. The peasants of Värend will have further to carry their goods either way."
 swe_gotaland.13.historical_info: "In 1342 Magnus Eriksson granted Växjö town privileges at the request of its bishop, who, the charter says, had suffered from not having his seat in a town. Every other Swedish see had grown into a town by the early 1300s. All trade in the district was to be done in Växjö, except what the peasants bought and sold for sowing or for their farms' needs, and goldsmiths, kettle-smiths, shoemakers, tailors, skinners and other craftsmen were told to move there unless they owned land. The fine for trading in the countryside, forty marks and the goods, was to be shared between the cathedral's building fund and the bishop, and not paid to the king as usual. No royal bailiff is known in Växjö, and the bishop served as the town's lord. The cathedral was enlarged, pilgrims came for Saint Sigfrid, and a small burghers' town grew up beside the church, though its mayor and council appear in the records only in the 1400s."
 swe_gotaland.13.a: "The fines shall go to his cathedral."
 swe_gotaland.13.a.entry: "Växjö was made a town under its bishop."
 swe_gotaland.13.b: "The fines are the Crown's."
 swe_gotaland.13.b.entry: "Växjö was made a town under a royal bailiff."
 swe_gotaland.13.varend_tt: "The peasant [pops|e] of [ShowLocationName('albo')], [ShowLocationName('konga')] and [ShowLocationName('uppvidinge')] lose 5% [pop_satisfaction|e]."

 STATIC_MODIFIER_NAME_swe_fair_forbidden: "The Fair Forbidden"
 STATIC_MODIFIER_DESC_swe_fair_forbidden: "The country fair here has been forbidden and its trade sent to the town. The goods of anyone caught trading are forfeit."

 swe_gotaland.14.title: "The Fair at Värnamo"
 swe_gotaland.14.entry: "$swe_gotaland.14.title$"
 swe_gotaland.14.desc: "The burghers of [ShowLocationName('jonkoping')] have paid towards our army whenever we asked, and now they ask a favour in return. The country fairs at Värnamo and elsewhere in the forests draw off the trade that ought to come to their town, and they want them abolished, with the goods of anyone caught trading there seized. They would be grateful in the usual way. But Värnamo is no upstart. The men of Östbo have held their ting there for well over a century, and the fair grew up beside it. They will not like being told to carry their goods to Jönköping instead, and there is no telling whether they will obey."
 swe_gotaland.14.historical_info: "At a council meeting in the Greyfriars' convent at Jönköping shortly after Christmas 1473, Sten Sture the Elder granted the town a new privilege. Its burghers paid towards the Swedish army and were among the regent's most loyal allies. The fairs at Hultarp, Värnamo and Åsarp were abolished and forbidden, their trade was to come to Jönköping instead, and anyone who broke the ban would lose all his goods and pay a heavy fine. The privilege was read aloud on every market day in Jönköping. It is also the first mention of the fair at Värnamo, where the men of Östbo had held their ting since at least 1333. The fair seems to have lived on regardless, for in the 1500s the burghers of Jönköping themselves were trading at a small fair there."
 swe_gotaland.14.a: "Send the trade to Jönköping."
 swe_gotaland.14.a.entry: "The country fairs were moved to Jönköping."
 swe_gotaland.14.a_tt: "The peasant [pops|e] of [ShowLocationName('trollaborg')] lose 5% [pop_satisfaction|e]."
 swe_gotaland.14.b: "Let Värnamo keep its fair."
 swe_gotaland.14.b.entry: "Värnamo kept its fair."
 swe_gotaland.14.b_tt: "The peasant [pops|e] of [ShowLocationName('trollaborg')] gain 5% [pop_satisfaction|e]."

 STATIC_MODIFIER_NAME_swe_kalmar_staple: "Kalmar's Staple"
 STATIC_MODIFIER_DESC_swe_kalmar_staple: "The trade of the coast and the uplands must come to Kalmar's quays, and the small harbours that once took it have been closed."

 swe_gotaland.15.title: "The Harbour at Pata"
 swe_gotaland.15.entry: "$swe_gotaland.15.title$"
 swe_gotaland.15.desc: "The burghers of [ShowLocationName('kalmar')] complain that their trade is leaking away up the coast. At Pata, on the manor of Strömserum, some twenty households of masons, tailors and cloth-shearers buy and sell and load ships as if they were a town, which no letter of ours has ever made them. Kalmar asks that all trade at Pata be forbidden and its craftsmen sent to Kalmar. Inland, the small town of Vimmerby draws off the trade of the uplands, and its privileges are ours to withdraw as well. The farmers of the coast and the uplands would then have to carry everything they sell to Kalmar."
 swe_gotaland.15.historical_info: "In 1524 the burghers of Kalmar complained of illegal trade at Pata, a settlement on the manor of Strömserum near the mouth of the Alsterån. Its rent roll of 1502 lists 23 households, more than the eight landholders of Eksjö in 1554, but no letter ever calls it a town. In 1527 the council of the realm forbade all trade at Pata on pain of losing goods and ships, and repeated the threat in 1532, and in the 1520s and 1530s those who lived there by trade and crafts were told to move to Kalmar. Pata died when Gustav Vasa made Strömserum a royal farm in 1553. A new trading place, Pataholm, later grew up on an islet nearby as a dependency of Kalmar, shipping timber, tar and pitch from the inland. Gustav also withdrew Vimmerby's town privileges in 1532, and it became a town again only in 1604."
 swe_gotaland.15.a: "All trade shall go through Kalmar."
 swe_gotaland.15.a.entry: "Trade at Pata was forbidden, and Vimmerby lost its privileges."
 swe_gotaland.15.a_tt: "The peasant [pops|e] of [ShowLocationName('handbord')] and [ShowLocationName('sevede')] lose 5% [pop_satisfaction|e]."
 swe_gotaland.15.b: "Pata and Vimmerby may go on trading."
 swe_gotaland.15.b.entry: "Pata and Vimmerby went on trading."
 swe_gotaland.15.b_tt: "The burgher [pops|e] of [ShowLocationName('kalmar')] lose 5% [pop_satisfaction|e], and the peasant [pops|e] of [ShowLocationName('handbord')] and [ShowLocationName('sevede')] gain 5%."

 STATIC_MODIFIER_NAME_swe_visingsborg_county: "The County of Visingsborg"
 STATIC_MODIFIER_DESC_swe_visingsborg_county: "The farms around Visingsö pay their taxes to the count's own collectors, and the count governs here as no bailiff of ours would dare."

 swe_gotaland.16.title: "The New Counts"
 swe_gotaland.16.entry: "$swe_gotaland.16.title$"
 swe_gotaland.16.desc: "We have lately made the first counts the realm has had, and one of them has been reminding us ever since that a count ought to have a county. He has his eye on Visingsö in Vättern and the parishes along the shore near [ShowLocationName('jonkoping')], and he would account for our taxes there through his own collectors instead of our bailiffs. A great lord with lands of his own to govern would bind the high nobility to the throne. Every farm in his county would also pay him before it paid us. A count is a count with or without a county, and the title alone costs us nothing."
 swe_gotaland.16.historical_info: "Gustav Vasa had made no counts. At his coronation on 29 June 1561 Erik XIV made the first three, Per Brahe the Elder, Svante Sture and Gustav Johansson (Tre Rosor), and only after repeated reminders was Brahe given Visingsö, on 20 March 1562. The first counties were small, but on 9 July 1569, the day before his own coronation, Johan III greatly enlarged Visingsborg with the parishes of Gränna and Habo and five more around the royal manor of Alvhem, so that it grew from 56 whole and 5 half farms in 1567 to 388 whole and 116 half farms. Unlike the other counts, Brahe could account for the Crown's taxes there through his own collectors. The town of Jönköping stayed outside the county. His grandson Per Brahe the Younger founded a school on Visingsö in 1636 and the town of Gränna in 1652, and when he died in 1680 the county went back to the Crown in the Great Reduction."
 swe_gotaland.16.a: "Give him Visingsö."
 swe_gotaland.16.a.entry: "The count was given the county of Visingsborg."
 swe_gotaland.16.b: "The title is enough."
 swe_gotaland.16.b.entry: "The count was left without a county."
