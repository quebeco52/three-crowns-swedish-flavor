l_english:
 STATIC_MODIFIER_NAME_swe_pomeranian_emancipation: "Free Pomeranian Peasants"
 STATIC_MODIFIER_DESC_swe_pomeranian_emancipation: "The old constitution of the Pomeranian estates is gone, and with it the serfdom that bound the peasants to the manors. Swedish law applies here now."

 swe_pomerania.1.title: "Serfdom in Pomerania"
 swe_pomerania.1.entry: "$swe_pomerania.1.title$"
 swe_pomerania.1.desc: "Everywhere else in our realm the [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] are free men, but on the manors of Pomerania they are still serfs, bound to the land and to the lords who own it. The Pomeranian estates guard their old constitution jealously and refuse whatever the Crown asks of them. Our ministers propose to set that constitution aside, bring in Swedish law and free the Pomeranian peasants."
 swe_pomerania.1.historical_info: "Swedish Pomerania kept its own constitution under the Swedish Crown, and with it a harsh serfdom on the noble estates, which Ernst Moritz Arndt attacked in a book of 1803. In 1806 the Pomeranian estates refused Gustav IV Adolf a militia. On 26 June he set aside their constitution and took the province out of the Holy Roman Empire, weeks before the Empire was dissolved, and then announced Swedish law and the abolition of serfdom. The French occupation of 1807 held the reforms back, and they were only partly carried out after Sweden regained the province in 1810."
 swe_pomerania.1.a: "Free the peasants."
 swe_pomerania.1.a.entry: "The Pomeranian peasants were freed."
 swe_pomerania.1.a_tt: "Every [location|e] we own in [ShowAreaNameWithNoTooltip('pomerania_area')] gains $STATIC_MODIFIER_NAME_swe_pomeranian_emancipation$."
 swe_pomerania.1.b: "Leave the estates their rights."
 swe_pomerania.1.b.entry: "Pomerania keeps its old constitution."
